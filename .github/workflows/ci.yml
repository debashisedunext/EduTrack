# EduTrack — CI
# Stream A owns this file (docs/TEAM-PLAN.md §6).

name: CI

# ── Why this file is shaped around cost ──────────────────────────────────────
#
# The account is on the GitHub Free tier: 2,000 Actions minutes a month for a
# private repo, which is about 91 minutes per working day. In the two days to
# 11 Aug this workflow spent 1,202 minutes and the allowance ran out mid-sprint
# — every job since has been refused before its first step, on every branch.
#
# Three things were paying for nothing:
#
#   1. A docs-only commit ran the whole pipeline. A quarter of all runs were
#      `chore(plan)` schedule refreshes compiling Java because a Gantt chart
#      moved.
#   2. Every change was verified twice — once on the PR, then identically again
#      on the merge push 30 seconds later.
#   3. Every intermediate push to an in-progress branch cost a full run.
#
# Hence: paths-ignore, per-path job gating on pull requests, and no CI on
# drafts. Roughly 600 min/day to roughly 72.
#
# UPDATE 20 Aug 2026 — the repository went public on 17 Aug, so Actions minutes
# are unlimited again and the cost ceiling above no longer binds. One economy
# from that period has been REVERSED here: "a PR-only test pass with the merge
# push proving only the combined jar". It was not a saving. It made develop's
# post-merge signal green-on-nothing, which is worse than no signal, and it is
# what let A-065 break every open backend PR from behind a passing tick. Pushes
# to develop and main now run the full suite. See the `changes` job.
#
# If the team outgrows this, the answer is a self-hosted runner (free and
# unlimited on any tier) rather than trimming further. Note that the `backend`
# job needs `services:` containers, which only run on a Linux runner.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [develop, main]
    # `ready_for_review` is NOT in the default set (opened, synchronize,
    # reopened). Without it, the draft guard below would be a trap: a developer
    # marks a draft ready and CI never fires, so the PR sits looking unverified
    # forever and the one run that matters is the one we skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [develop, main]
    paths-ignore: ['docs/**', '**/*.md']
  # A-074 · the nightly half of dependency scanning. The `security-scan` job
  # explains why a full vulnerability scan runs here rather than on pull
  # requests: a CVE published overnight is not a defect in somebody's branch,
  # and failing their PR for it is exactly how a security gate becomes the
  # thing people learn to route around.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- changes
  # Which areas a PR actually touches, so a Tailwind tweak does not start MySQL
  # and Redis. Costs well under a minute and saves about nine on the average PR.
  #
  # Deliberately not a third-party action: this is ten lines of git, and a
  # supply-chain dependency to compute a diff is a poor trade.
  #
  # It also carries the draft guard for the whole workflow — every test job
  # needs this one, so skipping it here skips them all in one place.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # 🔴 The draft guard is about DRAFTS. It must not also be an event guard.
    #
    # This read `github.event_name == 'pull_request' && ...draft == false`, and
    # the first clause silenced every push to develop and main: all four test
    # jobs below `needs: changes`, so a skipped gate skipped the lot and the
    # push reported success on the jar alone. `package` was the only job that
    # ever ran there.
    #
    # That is how A-065 sat on a green develop while breaking every open
    # backend PR (19 Aug). Its own PR #230 was red and was merged three seconds
    # after CI started, and nothing downstream could contradict it, because the
    # post-merge run tested nothing and said so in green.
    #
    # A push to develop is not a duplicate of the PR run that preceded it. It
    # is the only run that sees the MERGED result — two PRs each green against
    # an older base can still be red together, which is exactly the A-065 and
    # B-022 pair. There is no other place to catch that.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          # On a pull_request there is a base to diff against and per-path
          # gating is worth having. On a push there is not — `base_ref` is
          # empty — and more to the point a push to develop is the integration
          # signal, so it runs the whole suite rather than a subset chosen from
          # a diff. Deliberately not `event.before...HEAD`: that is empty on a
          # force-push and wrong on the first push of a branch.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
            echo "$FILES"
          else
            echo "Push to ${{ github.ref_name }} — running every job on the merged result."
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 🔴 An empty diff means "we do not know", never "nothing changed".
          #
          # Every filter below is a `grep` over $FILES, so an empty $FILES makes
          # all of them false and every job skips — and the PR reports green
          # having tested precisely nothing. That is not hypothetical: on
          # 17 Aug D-028, a backend change, merged to develop with its backend
          # job skipped, and the first PR that did run the suite found a
          # failure that had been sitting there unseen.
          #
          # The diff can come back empty for reasons that have nothing to do
          # with the change: `origin/$base_ref` not resolvable in the checkout,
          # a base that already contains the commits, a shallow fetch. All of
          # them are "cannot tell", and the safe answer to "cannot tell" is to
          # run everything.
          #
          # The OTHER fallback further down was meant to be this guard and is
          # not: it greps $FILES too, so it is also silent when $FILES is empty.
          if [ -z "$FILES" ]; then
            echo "::warning::Could not determine changed files — running every job."
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          match() { echo "$FILES" | grep -qE "$1" && echo true || echo false; }

          # contracts/ feeds both the Java DTOs and the generated TS client, so
          # it appears in more than one area on purpose.
          BACKEND=$(match '^(backend/|contracts/)')
          FRONTEND=$(match '^frontend/')
          CONTRACT=$(match '^(contracts/|frontend/src/api/)')

          # Anything outside the four known trees — this workflow, the Makefile,
          # docker-compose.yml, a root pom — could affect any area, so run the
          # lot.
          #
          # This comment used to claim that without it "the filter fails OPEN".
          # It does not, and the wording mattered: the filter fails **CLOSED**,
          # skipping everything, and reading otherwise is part of why the gap
          # above went unnoticed. This clause only helps when $FILES is
          # non-empty but matches none of the three areas. When $FILES is empty
          # it greps nothing, finds nothing, and stays silent — which is what
          # the guard further up now covers.
          OTHER=$(echo "$FILES" | grep -vE '^(backend/|frontend/|contracts/|docs/)' || true)
          if [ -n "$OTHER" ]; then
            echo "Changed outside the known areas — running everything:"
            echo "$OTHER"
            BACKEND=true; FRONTEND=true; CONTRACT=true
          fi

          echo "backend=$BACKEND"   >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "contract=$CONTRACT" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- guard
  migration-guard:
    name: Migration guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: No edits to applied migrations
        run: |
          # Flyway checksums applied migrations. Editing one breaks every
          # other developer's database, so it is blocked here.
          CHANGED=$(git diff --name-status \
            origin/${{ github.base_ref }}...HEAD -- '**/db/migration/*.sql' \
            | awk '$1 ~ /^(M|D|R)/ {print $2}')
          if [ -n "$CHANGED" ]; then
            echo "::error::An already-applied migration was modified or deleted:"
            echo "$CHANGED"
            echo "Corrections must be NEW migrations — see CONTRIBUTING.md."
            exit 1
          fi
          echo "✓ No applied migrations were altered."

      - name: Timestamp versioning enforced
        run: |
          BAD=$(git diff --name-only --diff-filter=A \
            origin/${{ github.base_ref }}...HEAD -- '**/db/migration/*.sql' \
            | grep -Ev '/V[0-9]{8}_[0-9]{4}__[a-z0-9_]+\.sql$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Migrations must be named V<YYYYMMDD>_<HHMM>__<snake_case>.sql:"
            echo "$BAD"
            exit 1
          fi
          echo "✓ Migration naming is correct."

  # ---------------------------------------------------------------- backend
  # PR-only, here and in `frontend` and `contract`. A `pull_request` run already
  # tests the *merge result* (refs/pull/N/merge), not the branch head — so the
  # push run that fired seconds after the merge was re-proving a green result.
  # The merge push now runs `package` alone, which is the one check a PR never
  # performs.
  #
  # What this gives up: if `develop` moves between the PR run and the merge, a
  # semantic conflict is caught by `package`'s compile-and-boot rather than by
  # the test suite. Accepted deliberately — the alternative costs 240 min/day.
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: edutrack_test
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_USER: edutrack
          MYSQL_PASSWORD: edutrack
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        working-directory: backend
        # -DskipFrontend: the frontend job below covers lint/test/build in
        # parallel. Building it here too would double the work and serialise
        # feedback. The `package` job proves the combined artifact.
        run: mvn -B verify -DskipFrontend

      # Maven's failure summary names the module and points at a directory on a
      # runner that no longer exists — "See .../target/surefire-reports for the
      # individual test results" — so the one thing a reader needs, *which test
      # failed*, is the one thing the tail of the log does not carry. The
      # reports are uploaded as an artifact below, but downloading those needs
      # credentials, which whoever is reading a red build may not have.
      #
      # So print them. Only the reports that actually contain a failure, so a
      # green-but-noisy run stays quiet and a red one says what broke without
      # anybody leaving the page.
      - name: Which tests failed
        if: failure()
        working-directory: backend
        run: |
          shopt -s nullglob
          found=0
          for f in */target/*-reports/*.txt; do
            if grep -qE '<<< (FAILURE|ERROR)' "$f"; then
              found=1
              echo "──────────────────────────────────────────────────────────"
              echo "$f"
              echo "──────────────────────────────────────────────────────────"
              cat "$f"
            fi
          done
          [ "$found" = 1 ] || echo "No surefire/failsafe report contains a failure — \
          the build broke somewhere other than a test (compilation, a plugin, or the JVM)."
      # v6, not v5, while everything else here sits on its own first Node-24
      # major. upload-artifact@v5 still declares `using: node20`, so pinning it
      # to v5 for the sake of a tidy version column would keep the deprecation
      # warning this bump exists to clear. Check `using:` in an action's
      # action.yml before assuming a major moved runtimes.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------- frontend
  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test -- --run
      - working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------- contract
  # Note: the backend half of the contract gate lives in the `backend` job.
  # ContractConformanceTest fails if the running app serves an operation the
  # contract does not describe, or any mutation verb on an append-only path,
  # and prints per-area coverage of the contract.
  contract:
    name: OpenAPI contract — validity, conventions, staleness
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate the OpenAPI document
        run: npx --yes @redocly/cli@latest lint contracts/openapi.yaml
      - name: Enforce the API conventions
        run: |
          # Redocly checks it is valid OpenAPI. This checks it is *our* OpenAPI —
          # the envelope, problem+json, idempotency, ETag/If-Match, cursor
          # pagination, 404-not-403, and no mutation verb on append-only paths.
          pip install --quiet pyyaml
          python3 contracts/check-conventions.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Regenerate client
        working-directory: frontend
        run: npm run api:generate
      - name: Fail if the committed client is stale
        run: |
          # The ONLY thing preventing Java <-> TypeScript drift now that shared
          # Zod schemas are off the table (PLAN.md §2.2, deviation D-4).
          #
          # Verified to actually fire: adding one field to a schema in
          # contracts/openapi.yaml dirties four generated files.
          if [ -n "$(git status --porcelain frontend/src/api/generated)" ]; then
            echo "::error::Generated API client is stale."
            echo "Run 'npm run api:generate' in frontend/ and commit the result."
            git --no-pager diff --stat frontend/src/api/generated
            exit 1
          fi
          echo "✓ Generated client is up to date."
      - name: Type-check the regenerated client
        working-directory: frontend
        run: |
          # A spec change can generate a client that does not compile — an enum
          # narrowed to a name TypeScript reserves, a schema that recurses. The
          # frontend job only type-checks what was committed, so without this the
          # break surfaces in whichever unrelated PR next touches the frontend.
          npx tsc --noEmit -p tsconfig.app.json

  # ------------------------------------------------------- dependency-review
  # A-074 · the pull-request half of dependency scanning.
  #
  # This asks one question only: does THIS pull request introduce a dependency
  # with a known vulnerability? It diffs the manifests against the base branch,
  # so it can only ever fail on something the author actually did.
  #
  # That distinction is the whole design. The obvious implementation — run a
  # vulnerability scanner on every PR and fail on any finding — makes a CVE
  # published against an unrelated transitive dependency at 3am fail the next
  # six PRs, none of which caused it and none of which can fix it. CLAUDE.md
  # already records where that road ends: "a verification step nobody can
  # afford is a verification step nobody performs". The full scan still
  # happens; it happens nightly, below, where it blocks nobody and can be
  # loud.
  #
  # First-party GitHub action, no key, and it needs the repository to be public
  # or to have the dependency graph enabled — which it is, since 17 Aug.
  dependency-review:
    name: Security — dependency review
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      # A-074 · dependency-review reads GitHub's Dependency graph, which is a
      # REPOSITORY SETTING and not something a branch can turn on. With it off
      # the action does not report "nothing found" — it errors:
      #
      #   Dependency review is not supported on this repository.
      #   Please ensure that Dependency graph is enabled.
      #
      # and it does that on EVERY pull request, so a red check nobody can fix
      # from a branch sits in front of every merge until an admin flips a switch
      # most people do not know exists. That is precisely the shape CLAUDE.md
      # warns about — a verification step nobody can afford is a verification
      # step nobody performs — and the way it actually ends is somebody deleting
      # the job, taking the real check with it.
      #
      # So probe first, and be loud about the answer. Deliberately NOT
      # `continue-on-error` on the review itself: that would swallow a genuine
      # high-severity finding exactly as quietly as it swallows this, and not
      # doing that is the entire job.
      #
      # Note what is still covered while this is off: `security-scan` runs
      # OSV-Scanner and `npm audit` over both ecosystems nightly and on every
      # push, and neither needs the Dependency graph. What is lost is the
      # per-PR, diff-scoped check — the one that can attribute a finding to the
      # author who introduced it.
      - name: Is the Dependency graph enabled?
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo '✓ Dependency graph is enabled — running the review.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency review skipped::The Dependency graph is disabled for this repository, so per-PR dependency review cannot run. Enable it under Settings → Code security and analysis. Dependencies are still scanned nightly and on push by the 'Security — dependency & image scan' job."
          fi

      - uses: actions/dependency-review-action@v4
        if: steps.probe.outputs.available == 'true'
        with:
          # Moderate and below are reported in the PR comment but do not fail
          # it. The bar to block a merge is a vulnerability somebody would
          # actually stop a release for.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # GPL/AGPL in a proprietary product is a legal problem discovered at
          # the worst possible time. Cheap to check while we are already here.
          deny-licenses: AGPL-3.0, GPL-3.0

  # ------------------------------------------------------------ security-scan
  # A-074 · the full sweep. Nightly, on pushes to develop and main, and on
  # demand — deliberately NOT on pull requests. See dependency-review above.
  #
  # WHAT IS AND IS NOT SCANNED HERE, stated plainly because the task line item
  # says "dependency and container scanning" and only one of those is fully
  # possible today:
  #
  #   · Dependencies — yes. OSV-Scanner reads backend/**/pom.xml and
  #     frontend/package-lock.json and covers both ecosystems in one pass, with
  #     no NVD API key and none of OWASP dependency-check's ~10 minute startup.
  #
  #   · npm audit — yes, and it is not redundant. It resolves the lockfile the
  #     way npm itself does, so it catches advisories against the exact
  #     resolved tree rather than the declared ranges.
  #
  #   · The application container — THERE ISN'T ONE. This repository builds a
  #     single executable jar (see the `package` job) and has no Dockerfile;
  #     docker-compose.yml runs MySQL, Redis, MinIO and Mailpit for local
  #     development only. Image scanning arrives with A-075, which owns
  #     deployment and is the task that will introduce an image to scan.
  #     Saying so here beats a scanner pointed at nothing and reporting green.
  #
  #   · The images we DO pin — yes, and report-only. We choose the tags in
  #     docker-compose.yml, so a critical in mysql:8.4 is worth knowing about,
  #     but it is not something a developer can fix in a branch and it must
  #     never redden the build. `continue-on-error` is the honest expression of
  #     "tell me, do not stop me".
  security-scan:
    name: Security — dependency & image scan
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    env:
      # One tool, one pinned digest-able tag, run through Docker. Deliberately
      # not a marketplace action, for the reason the `changes` job gives about
      # computing a diff: a scanner is a binary we can pin, and an action is a
      # supply-chain dependency inside the job that exists to police the supply
      # chain. Trivy covers Maven, npm, config and images in one place, so this
      # is one tool rather than three.
      TRIVY: aquasec/trivy:0.58.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the jar, so the scan sees what actually ships
        run: |
          # Scanning pom.xml reads declared ranges; scanning the assembled jar
          # reads the versions Maven actually resolved, transitive dependencies
          # included. Those differ, and the second one is what runs in
          # production. No tests and no frontend — this is about the dependency
          # set, not about correctness, which the `backend` job already covers.
          cd backend && ./mvnw -q -ntp package -DskipTests -DskipFrontend

      - name: Vulnerable dependencies — the shipped jar and the npm lockfile
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY" filesystem \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 15m \
            backend/api/target frontend/package-lock.json

      - name: npm audit — the resolved tree, not the declared ranges
        working-directory: frontend
        run: |
          # Not redundant with the above. npm resolves the lockfile the way npm
          # does, and its advisory database is not Trivy's — the two disagree
          # often enough that running both is cheaper than picking one and
          # being wrong.
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

      - name: Misconfiguration in docker-compose.yml
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY" config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            docker-compose.yml

      - name: Base images pinned by docker-compose (report only)
        continue-on-error: true
        run: |
          # Report-only on purpose — see the job header. These are upstream
          # images on tags we choose, so a critical is worth knowing about, but
          # it is not fixable in a branch and must never redden a build.
          #
          # Parsed out of the compose file rather than listed here, so adding a
          # service to local development cannot silently go unscanned.
          IMAGES=$(grep -oP '^\s+image:\s*\K\S+' docker-compose.yml | sort -u)
          echo "Scanning: $IMAGES"
          for image in $IMAGES; do
            echo "── $image ─────────────────────────────────"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --timeout 10m \
              "$image" || echo "::warning::trivy could not scan $image"
          done

      - name: There is no application image to scan yet
        run: |
          # A guard, not a comment. If somebody adds a Dockerfile without
          # extending this job, the one image we actually build and ship would
          # go unscanned while this job continued reporting green — which is
          # precisely the failure it exists to prevent.
          FOUND=$(find . -name Dockerfile -not -path './node_modules/*' \
                         -not -path './frontend/node_modules/*' -not -path './.git/*')
          if [ -n "$FOUND" ]; then
            echo "::error::A Dockerfile now exists ($FOUND), but this job only scans"
            echo "::error::the base images from docker-compose.yml. Add an image scan"
            echo "::error::for the application image — that is A-075's step, and this"
            echo "::error::guard is how A-074 makes sure it is not quietly forgotten."
            exit 1
          fi
          echo "✓ No application image yet — image scanning lands with A-075."

  # ---------------------------------------------------------------- package
  package:
    name: Package — single deployable jar
    runs-on: ubuntu-latest
    # No `needs:` — and that is load-bearing, not an omission.
    #
    # This job runs only on push, and `backend`/`frontend` now run only on
    # pull_request. A skipped dependency skips the dependent job, so keeping
    # `needs: [backend, frontend]` would mean this never runs again — the sole
    # check on the merge commit, silently gone, with the workflow still green.
    #
    # Nothing is lost by dropping it: the two jobs it waited for cannot be
    # running at this point, and this job builds everything from source anyway.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Full build — Maven downloads its own Node
        working-directory: backend
        # -DskipFrontend=false: the pom now defaults it to true, so a local
        # build never deletes a developer's node_modules out from under a
        # running dev server. This is the one build that must bundle the
        # frontend, and the step below fails if it did not.
        run: mvn -B package -DskipTests -DskipFrontend=false
      - name: Verify the frontend is inside the jar
        run: |
          JAR=$(ls backend/api/target/edutrack-api-*.jar | head -1)
          if ! unzip -l "$JAR" | grep -q 'BOOT-INF/classes/static/index.html'; then
            echo "::error::Frontend missing from $JAR — the app would serve no UI."
            unzip -l "$JAR" | head -30
            exit 1
          fi
          echo "✓ $JAR contains the built frontend"
      - name: Smoke-test the jar — start it and serve a request
        run: |
          # Inspecting the artifact is not the same as running it. A dependency
          # declared at the wrong scope produces a jar that looks perfect and
          # dies during context refresh; that shipped once, green, because this
          # job only ever ran `unzip -l`.
          JAR=$(ls backend/api/target/edutrack-api-*.jar | head -1)

          # What is excluded here, and why almost nothing is any more.
          #
          # Only Flyway. It connects unconditionally during context refresh and
          # offers no switch to stop it, and this job runs no database.
          #
          # The exclusion list used to grow instead of shrink, and each addition
          # made this job assert less. A-020 removed the DataSource exclusion
          # once AuthUserRepository needed a JdbcClient. Then JPA repositories
          # were excluded in its place — and that is what broke on 11 Aug, three
          # weeks after the beans that broke it were written:
          #
          #   Parameter 0 of constructor in ClientImportSchema required a bean
          #   of type 'ClientRepository' that could not be found.
          #
          # B-030's import schemas and B-023's CalendarService are ordinary
          # production beans that read through Spring Data. Excluding the
          # repositories they need does not make the jar leaner, it makes this
          # job start a context nobody runs — which is the exact failure this
          # step exists to catch, reintroduced by the step itself.
          #
          # So JPA stays ON, the way ApplicationSmokeTest has run since B-023.
          # What made Hibernate dial MySQL during refresh was reading JDBC
          # metadata to choose a dialect; naming the dialect and refusing that
          # lookup lets it build an EntityManagerFactory entirely offline. The
          # HikariDataSource is built without opening its pool, and the pool
          # opens on the first getConnection(), which nothing below performs.
          #
          # Verified locally against the packaged jar: starts in 9s, /actuator
          # /health UP, GET / serves 200 — with no MySQL and no Redis running.
          #
          # Comments cannot live inside the command: a `#` after a line
          # continuation ends it, taking the trailing backslash with it.
          EXCLUDE=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

          java -jar "$JAR" \
            --spring.profiles.active=local \
            --spring.autoconfigure.exclude="$EXCLUDE" \
            --spring.jpa.hibernate.ddl-auto=none \
            --spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect \
            --spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false \
            --server.port=8099 \
            --management.health.redis.enabled=false \
            --management.health.mail.enabled=false \
            --management.health.db.enabled=false > /tmp/app.log 2>&1 &
          APP=$!
          # Readiness is `/`, not /actuator/health. Health aggregates the Redis,
          # mail and database indicators, which are DOWN here by design — there
          # is no infrastructure in this job, and there should not be: the
          # question is whether the jar starts and serves, not whether
          # docker-compose is up. Those three indicators are disabled above so
          # the health assertion below is about the application rather than the
          # environment.
          #
          # `db` joined that list on 17 Aug, the first time this job ran after
          # the Actions allowance was restored. It had always aggregated into
          # /actuator/health; the assertion below simply never ran against a
          # jar carrying a DataSource health indicator and no database, so it
          # returned 503 the moment it did. The local integration gate never
          # caught it because it asserts only `/` — and because a developer
          # running it has docker-compose up, so a real MySQL was answering.
          up=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8099/; then up=1; break; fi
            if ! kill -0 $APP 2>/dev/null; then
              echo "::error::The app exited during startup."; tail -60 /tmp/app.log; exit 1
            fi
            sleep 2
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::The app never became healthy within 120s."; tail -60 /tmp/app.log; exit 1
          fi
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099$1")
            if [ "$code" = "$2" ]; then echo "  ✓ $1 -> $code"
            else echo "::error::$1 returned $code, expected $2"; fail=1; fi
          }
          check /                     200   # the SPA
          check /tickets/CRM-26-00347 200   # a deep link must reach index.html
          check /v3/api-docs/edutrack 200   # springdoc, which D-005 depends on
          check /actuator/health      200
          # The point of this check is that an unknown API path must not be
          # served the SPA shell — a 200 with index.html would make every
          # mistyped endpoint look like it worked. It asserted 404 until the
          # filter chain landed (A-032, A-033): this smoke test calls with no
          # credentials, and Spring Security now answers before routing, so an
          # unauthenticated caller gets 401 and never reaches a 404. 401 is the
          # correct answer here and still proves the shell was not served.
          #
          # This is Stream A's surface — flagged for Shivendra's review.
          check /api/v1/nope          401   # not the HTML shell; auth answers first

          # A-074 · the CSP, against the real artefact.
          #
          # This is the ONLY place the built index.html meets the policy
          # builder. ContentSecurityPolicy hashes whatever inline script it
          # finds in classpath:/static/index.html, and that file only exists
          # once the frontend has been built into the jar — which is this job
          # and nowhere else. Every unit test necessarily uses a substitute
          # document, and every integration test runs with no frontend at all.
          #
          # So the failure this catches is specific and otherwise invisible:
          # Vite changes how it emits the theme script, the hash stops matching,
          # and the application renders blank in production while the whole
          # suite stays green. Nothing in a unit test parses CSP.
          CSP=$(curl -s -o /dev/null -D - -w '' http://localhost:8099/ | tr -d '\r' \
                | grep -i '^content-security-policy:' | cut -d' ' -f2-)
          echo "  CSP: $CSP"
          if [ -z "$CSP" ]; then
            echo "::error::No Content-Security-Policy header on the SPA document."; fail=1
          elif ! echo "$CSP" | grep -q "script-src 'self' 'sha256-"; then
            echo "::error::script-src carries no inline-script hash. The jar contains an"
            echo "::error::index.html with an inline <script> (D-15's theme script), so a"
            echo "::error::hash must be there — without it that script is blocked and the"
            echo "::error::app renders with a flash of the wrong theme, or not at all."
            fail=1
          elif echo "$CSP" | grep -q "script-src[^;]*'unsafe-inline'"; then
            echo "::error::script-src allows 'unsafe-inline', which defeats the policy."; fail=1
          else
            echo "  ✓ CSP carries an inline-script hash and no 'unsafe-inline' script-src"
          fi

          kill $APP 2>/dev/null || true
          if [ $fail -ne 0 ]; then tail -60 /tmp/app.log; exit 1; fi
          echo "✓ the packaged jar starts and serves"
      - uses: actions/upload-artifact@v6
        with:
          name: edutrack-api-jar
          path: backend/api/target/edutrack-api-*.jar
          if-no-files-found: error
