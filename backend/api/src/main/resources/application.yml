spring:
  application:
    name: edutrack-api

  datasource:
    # DATETIME(6) stored as UTC — never TIMESTAMP (2038 limit + silent session
    # timezone conversion). See PLAN.md §3.1.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edutrack}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:edutrack_app}
    password: ${DB_PASSWORD:edutrack}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      pool-name: edutrack-pool

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway, never by Hibernate. Stream A owns migrations.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
        # ONLY_FULL_GROUP_BY stays enabled — it catches real bugs. See PLAN.md §3.4.
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Timestamp versioning: V20260812_1430__description.sql — CONTRIBUTING.md
    validate-on-migrate: true
    # Migrations run as edutrack_migrate, NOT as the runtime user (A-010).
    # edutrack_app holds no DDL and only INSERT+SELECT on the append-only
    # tables, so it cannot create a schema even if asked to. Keeping the two
    # credentials separate is what lets the runtime user stay that narrow.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edutrack}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8&serverTimezone=UTC
    user: ${DB_MIGRATE_USER:edutrack_migrate}
    password: ${DB_MIGRATE_PASSWORD:edutrack_migrate}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}          # Mailpit in local dev
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB            # blueprint §4B.4
      max-request-size: 50MB

  mvc:
    problemdetails:
      # A-020. Framework-raised failures — malformed body, unreadable request,
      # wrong media type, Bean Validation — are emitted as RFC 9457
      # application/problem+json instead of Spring's default error JSON.
      # contracts/CONVENTIONS.md §3 records this as the reason we did NOT adopt
      # the blueprint's { data, meta, error } envelope for errors (PLAN.md §4,
      # deviation D-12): Spring Boot 3 already produces the conformant shape, so
      # a hand-written handler would be fighting the framework to produce a
      # worse one. Application-specific problems still set their own stable
      # `type` URI — see AuthExceptionHandler.
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never           # never leak internals to a client
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
    # Stable ordering. springdoc emits reflection order otherwise, so the
    # generated client churns between runs and CI's staleness check (D-005)
    # fails on a diff that means nothing.
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  # Bean Validation annotations on the DTOs become minLength/pattern/required in
  # the schema — the single source of truth for validation, executed on both
  # sides via generated Zod. PLAN.md §2.2, deviation D-4.
  model-converters:
    pageable-converter:
      enabled: false

edutrack:
  jwt:
    # A-022 · HS256. NimbusJwtEncoder rejects anything under 256 bits, so this
    # placeholder is deliberately long — shortening it fails startup, not login.
    # Committed default is fine for `local`/CI; every other environment MUST
    # override via JWT_SIGNING_SECRET, the same way DB and mail credentials do.
    secret: ${JWT_SIGNING_SECRET:local-dev-only-jwt-signing-secret-change-me-in-every-other-environment}
    # A URL, not a bare word — Jwt.getIssuer() parses `iss` as one, and this
    # matches the stable https://edutrack/... identifiers AuthExceptionHandler
    # already uses for problem `type` URIs.
    issuer: https://edutrack
    access-token-ttl: PT15M       # 900s, per blueprint §10.1

  auth:
    # A-023 · the opaque refresh token. Nothing here needs an environment
    # override — unlike the JWT secret there is no key to rotate, because the
    # token is random per issue and Redis holds only its SHA-256.
    refresh-token:
      ttl: P7D                    # 604800s, per blueprint §10.1
      cookie-name: refresh_token
      # Narrower than "/" deliberately: only /auth/refresh (A-024) and
      # /auth/logout (A-025) read this cookie. Scoping it to the whole API
      # would attach a seven-day credential to every ticket list request.
      cookie-path: /api/v1/auth
      # RefreshTokenConfig REFUSES TO START if this is false outside `local`.
      # It exists only for Safari on http://localhost and for plain-http LAN
      # addresses used to test on a real phone, both of which reject a Secure
      # cookie and therefore cannot hold a session at all.
      secure-cookie: true

    # A-025 · the two bounds §10.1 puts on a session's life. These are NOT the
    # same thing as refresh-token.ttl above, and the difference is deliberate:
    # the TTL is how long the server REMEMBERS a token, these are how long it
    # will HONOUR one. Remembering for longer is what lets A-024 refuse a
    # replayed day-three token as detected THEFT (revoking the family, raising
    # an alert) rather than shrugging at an unrecognised value.
    session:
      idle-timeout: PT30M         # measured from the last successful refresh
      absolute-timeout: PT12H     # measured from login; never extended by use

    # A-027 · the forgot/reset-password flow.
    password-reset:
      # Blueprint §10.3. Short because this token grants an account without a
      # password and lives in a mailbox — the one place a credential is most
      # likely to be read by someone other than its owner.
      ttl: PT30M
      # Where the emailed link points, before `?token=…`. Genuinely
      # environment-specific, hence a property.
      #
      # DELIBERATELY NOT derived from the request's Host header, which is the
      # convenient choice and a well-known hole: an attacker who can set that
      # header makes the mail *we* send point at *their* server, and the victim
      # clicks a link we authored and hands over the token.
      base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}

    # A-028 · password policy. Blueprint §10.3.
    #
    # The composition rules — upper, lower, digit, symbol — are NOT here.
    # They live in @ValidPassword so springdoc emits them into the schema and
    # orval generates the matching Zod, per PLAN.md §2.2 (D-4). A knob that
    # switched off "requires a symbol" would also be a knob somebody turns off
    # during an incident caused by it being on.
    password-policy:
      # §10.3's "no reuse of last 3". Each one costs an Argon2id verification
      # at 64 MB on a password change, so the number is a real cost as well as
      # a policy. 0 disables the rule outright — the honest way to say "we do
      # not want this", rather than leaving it configured and unenforced.
      history-depth: ${PASSWORD_HISTORY_DEPTH:3}

      # §10.3 calls the 90-day expiry "optional", and it ships OFF.
      #
      # NIST SP 800-63B §5.1.1.2 advises against scheduled rotation: people
      # answer a forced change by incrementing a digit, so an organisation
      # trades real entropy for the appearance of hygiene, plus a quarterly
      # support spike. Rotation is worth it on evidence of compromise, and
      # A-026's must_change_password already covers that case deliberately
      # rather than by calendar.
      #
      # Built because the blueprint asks for it and some compliance regimes
      # require it; defaulted off so nothing acquires the behaviour by
      # accident. Switching it on needs no migration — password_changed_at is
      # already maintained on every password write.
      expiry-enabled: ${PASSWORD_EXPIRY_ENABLED:false}
      max-age: ${PASSWORD_MAX_AGE:P90D}

    # A-029 · two-factor authentication. Blueprint §10.1, screen S-04.
    totp:
      # The name an authenticator app shows above the code. The organisation's,
      # not ours — and it is how a user with accounts on two EduTrack
      # installations tells the entries apart.
      issuer: ${TOTP_ISSUER:EduTrack}

      # 30-second steps accepted either side of now. One tolerates ±30s of
      # phone-clock drift plus the seconds between reading a code and pressing
      # submit. Each extra step multiplies how many codes are valid at once, so
      # this buys tolerance at a directly proportional cost in strength.
      window-steps: ${TOTP_WINDOW_STEPS:1}

      # Single-use codes issued at enrolment. Ten is the industry norm: few
      # enough to print, many enough that losing a phone twice does not
      # exhaust them.
      recovery-codes: ${TOTP_RECOVERY_CODES:10}

      # Encrypts the shared secret at rest. Unlike a password the secret must
      # be recoverable — verifying a code recomputes HMAC over it — so this is
      # encryption rather than hashing, and the key living outside the database
      # is what makes a stolen dump useless on its own.
      #
      # TotpConfig REFUSES TO START outside `local` while this is still the
      # committed default. A default key is in the repository, so it is the
      # same as no encryption at all: source plus a database dump would yield
      # every enrolled user's second factor.
      encryption-key: ${TOTP_ENCRYPTION_KEY:local-dev-only-totp-encryption-key-change-me-in-every-other-environment}

  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:edutrack}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    # MinIO ignores the region and the AWS SDK insists on one; a signature is
    # computed over it either way. Path style is required for MinIO, where the
    # bucket is not a DNS name, and is harmless against real S3.
    region: ${S3_REGION:us-east-1}
    path-style: ${S3_PATH_STYLE:true}

  # C-025 · attachment security. Blueprint §4B.4.
  attachments:
    # How long a download URL is good for. "Short-lived" in §4B.4; five minutes
    # is long enough to click a link and open the file, short enough that the
    # copy left in a browser history or a proxy log is worthless by the time
    # anyone reads it.
    signed-url-ttl: ${ATTACHMENT_SIGNED_URL_TTL:PT5M}

    # §4B.4's caps. max-file-bytes MUST track spring.servlet.multipart's
    # max-file-size above — the container refuses the body first, and if the two
    # disagree the caller gets a different error on either side of the gap.
    # Making these settings-backed rather than properties is C-027.
    max-file-bytes: ${ATTACHMENT_MAX_FILE_BYTES:10485760}      # 10 MB
    max-ticket-bytes: ${ATTACHMENT_MAX_TICKET_BYTES:52428800}  # 50 MB
    max-files: ${ATTACHMENT_MAX_FILES:20}

    thumbnail:
      # C-026. A small PNG reduction, built AFTER the virus scan says CLEAN and
      # served through the same signed URL as the file itself.
      #
      # `enabled: false` is an operator's escape hatch for a broken ImageIO, not
      # a feature flag — every thumbnailUrl simply comes back null, which the
      # client already renders by falling back to the full image.
      enabled: ${ATTACHMENT_THUMBNAILS_ENABLED:true}

      # Longest side of the reduction. 320 covers a 160px gallery tile on a 2×
      # display, which is the biggest place one is drawn.
      max-edge: ${ATTACHMENT_THUMBNAIL_MAX_EDGE:320}

      # The decompression-bomb ceiling, and the one value here with a security
      # job. A 10 MB PNG may legitimately be 40000×40000 — 1.6 BILLION pixels and
      # several GB of heap once decoded — and §4B.4's file-size cap cannot see it,
      # because the bomb is small until it is opened. Dimensions are read from the
      # header and checked before a single pixel is decoded.
      max-source-pixels: ${ATTACHMENT_THUMBNAIL_MAX_SOURCE_PIXELS:50000000}

    scan:
      # clamd, spoken to over INSTREAM. Off by default, and off does NOT mean
      # "treat everything as clean": with no scanner every upload is stored,
      # stays PENDING and is never downloadable. That is the correct failure —
      # §4B.4 is "scan BEFORE the file becomes visible", and a file nobody
      # scanned has not satisfied it.
      enabled: ${CLAMAV_ENABLED:false}
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      timeout: ${CLAMAV_TIMEOUT:PT30S}

      # Serve a file whose scan did NOT complete. AttachmentScanConfig REFUSES
      # TO START with this true outside `local` — the same guard RefreshTokenConfig
      # puts on secure-cookie and TotpConfig on the placeholder key, and for the
      # same reason: an outage would otherwise serve every upload unscanned and
      # nothing about the running product would look different.
      fail-open: false

  webhooks:
    email:
      # D-034/D-039. The provider webhooks are unauthenticated by necessity —
      # the provider holds no EduTrack session — so this HMAC secret is the
      # only thing stopping anyone who can reach the URL from suppressing an
      # arbitrary address and silencing that person's mail.
      #
      # Deliberately empty by default: with no secret configured the verifier
      # rejects every request. An open endpoint is a worse default than a
      # temporarily unreachable one.
      secret: ${EMAIL_WEBHOOK_SECRET:}

  # D-035 · at most one mail per recipient per ticket in this window
  # (blueprint §4B.6). A ticket edited five times in a minute must not put
  # five mails in the assignee's inbox. The throttled mail is dropped, not
  # delayed — spreading a burst out still delivers every mail.
  mail:
    rate-limit-window: ${MAIL_RATE_LIMIT_WINDOW:PT1M}

logging:
  level:
    com.edunext.edutrack: ${LOG_LEVEL:INFO}

---
# ---------------------------------------------------------------------------
# Local development profile. Safe on its own — no principal is injected here.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

logging:
  level:
    com.edunext.edutrack: DEBUG

edutrack:
  attachments:
    scan:
      # C-025. Local development has no clamd, and without this every attachment
      # would be stored and then be permanently undownloadable — which is the
      # correct production behaviour and makes the feature untestable on a laptop.
      # Set ONLY here: AttachmentScanConfig refuses to start with it anywhere
      # else, so it cannot reach an environment that matters.
      fail-open: true

---
# ---------------------------------------------------------------------------
# A-012 · dev-noauth. Opt-in on top of `local` — activate BOTH together:
#
#     ./mvnw -pl api spring-boot:run -Dspring-boot.run.profiles=local,dev-noauth
#
# Never alone: DevNoAuthConfig refuses to start the application if `local`
# is not also active, so this fake principal can never reach a real
# environment. CI activates neither profile, so none of this code loads there.
#
# Injects ONE configurable fake principal so Streams B, C and D can develop
# against a realistic Authentication before A-020's real login exists. The
# values below are the org-wide defaults (Admin, unscoped). To develop as a
# scoped role, override in your own gitignored application-local.yml:
#
#   edutrack:
#     dev-noauth:
#       user-id: 4
#       role: DEVELOPER
#       project-ids: [1, 2]
#       reportee-ids: []
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev-noauth

edutrack:
  dev-noauth:
    user-id: 1
    username: dev.admin
    full-name: "Dev Admin (fake principal — A-012)"
    role: ADMIN
    project-ids: []
    reportee-ids: []

---
# ---------------------------------------------------------------------------
# B-007 · fixtures. Opt-in on top of `local`, exactly like dev-noauth above —
# activate BOTH together:
#
#     ./mvnw -pl api spring-boot:run -Dspring-boot.run.profiles=local,fixtures
#
# Never alone: FixtureGuard refuses to start the application if `local` is
# not also active, so the 200-ticket corpus can never be loaded into a real
# environment. CI activates neither profile, so none of this code runs there.
#
# Deliberately NOT a Flyway migration — SEED-MANIFEST.md §5 flags exactly
# this: the corpus is dev/test data, not the reference data every environment
# boots with, and `spring.flyway.locations` is shared between `api` and
# `worker` with nothing separating a fixture migration from a real one. A
# profile-gated ApplicationRunner (feature/fixtures) is the isolation instead
# — it never runs unless both profiles are explicitly requested.
#
# Idempotent by inspection, not by a flag here: FixtureLoader checks for the
# CRM/PAY/WEB projects before writing anything and skips if they exist, so
# restarting the app under this profile is a safe no-op after the first run.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: fixtures
