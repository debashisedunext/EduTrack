spring:
  application:
    name: edutrack-api

  datasource:
    # DATETIME(6) stored as UTC — never TIMESTAMP (2038 limit + silent session
    # timezone conversion). See PLAN.md §3.1.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edutrack}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:edutrack_app}
    password: ${DB_PASSWORD:edutrack}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      pool-name: edutrack-pool

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway, never by Hibernate. Stream A owns migrations.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
        # ONLY_FULL_GROUP_BY stays enabled — it catches real bugs. See PLAN.md §3.4.
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Timestamp versioning: V20260812_1430__description.sql — CONTRIBUTING.md
    validate-on-migrate: true
    # Migrations run as edutrack_migrate, NOT as the runtime user (A-010).
    # edutrack_app holds no DDL and only INSERT+SELECT on the append-only
    # tables, so it cannot create a schema even if asked to. Keeping the two
    # credentials separate is what lets the runtime user stay that narrow.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edutrack}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8&serverTimezone=UTC
    user: ${DB_MIGRATE_USER:edutrack_migrate}
    password: ${DB_MIGRATE_PASSWORD:edutrack_migrate}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}          # Mailpit in local dev
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB            # blueprint §4B.4
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never           # never leak internals to a client
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

edutrack:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:edutrack}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}

logging:
  level:
    com.edunext.edutrack: ${LOG_LEVEL:INFO}

---
# ---------------------------------------------------------------------------
# Local development profile. Safe on its own — no principal is injected here.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

logging:
  level:
    com.edunext.edutrack: DEBUG

---
# ---------------------------------------------------------------------------
# A-012 · dev-noauth. Opt-in on top of `local` — activate BOTH together:
#
#     ./mvnw -pl api spring-boot:run -Dspring-boot.run.profiles=local,dev-noauth
#
# Never alone: DevNoAuthConfig refuses to start the application if `local`
# is not also active, so this fake principal can never reach a real
# environment. CI activates neither profile, so none of this code loads there.
#
# Injects ONE configurable fake principal so Streams B, C and D can develop
# against a realistic Authentication before A-020's real login exists. The
# values below are the org-wide defaults (Admin, unscoped). To develop as a
# scoped role, override in your own gitignored application-local.yml:
#
#   edutrack:
#     dev-noauth:
#       user-id: 4
#       role: DEVELOPER
#       project-ids: [1, 2]
#       reportee-ids: []
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev-noauth

edutrack:
  dev-noauth:
    user-id: 1
    username: dev.admin
    full-name: "Dev Admin (fake principal — A-012)"
    role: ADMIN
    project-ids: []
    reportee-ids: []
