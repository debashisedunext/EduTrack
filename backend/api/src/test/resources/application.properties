# Test-scope configuration for the api module.
#
# A-029 · a real TOTP encryption key for the test JVM.
#
# TotpConfig refuses to start outside the `local` profile while the committed
# development key is still in place — deliberately, because that key is in the
# repository and a default encryption key is the same as no encryption at all.
# @SpringBootTest runs with no active profile, so without this line every
# integration test in the module fails to build a context, and the failure
# points at the guard rather than at anything the test is about.
#
# Supplying a distinct key here rather than activating `local` is the more
# honest fix: the tests then exercise the same encrypt-and-store path production
# uses, instead of taking the one branch that skips the check. It also keeps the
# guard itself meaningful — TotpConfigTest asserts the refusal directly, so
# nothing here can quietly disable it.
edutrack.auth.totp.encryption-key=test-only-totp-encryption-key-not-used-in-any-real-environment

# A-074 · the API documentation, which is closed by default from this release on.
#
# Two tests in this module read it from the running application and neither is
# about springdoc:
#   · ContractConformanceTest fetches /v3/api-docs to compare what the backend
#     actually serves against the reviewed contract. Its own failure message
#     says "it must permit /v3/api-docs/** and /swagger-ui/**".
#   · SecurityChainIT asserts /v3/api-docs is reachable unauthenticated.
#
# Enabled here rather than in either test so that closing it by default costs
# no edit in Stream D's contract test, and so the two tests keep asserting what
# they were written to assert. SecurityHeadersAndDocsIT covers the closed case
# directly, with the flag turned back off for that context alone — so nothing
# here can hide a regression in the default.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
