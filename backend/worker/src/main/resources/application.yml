spring:
  application:
    name: edutrack-worker

  main:
    web-application-type: none

    # Without this the process starts and exits inside a tenth of a second, and
    # every @Scheduled job in it — the SLA scans, the escalations, the mail
    # outbox, A-051's stats refresh — never runs once.
    #
    # It is the combination that does it, which is why neither setting looks
    # wrong on its own. `web-application-type: none` means no web server is
    # holding a non-daemon thread open, and `threads.virtual.enabled` below
    # means the task scheduler runs on virtual threads, which are *always*
    # daemon threads and cannot keep a JVM alive. Nothing else in this process
    # holds one, so the JVM has no reason to stay up and does not.
    #
    # Nothing fails when that happens. The log says "Started WorkerApplication"
    # and the process is simply gone — which is how it survived: every worker IT
    # drives its bean directly rather than waiting for a schedule, so the whole
    # suite passes against a process that would never run a job in production.
    keep-alive: true

  # Java 25 virtual threads (PLAN.md §2.1 — the reason the runtime was raised
  # from 21). A batch of mail sends is almost entirely blocked on SMTP I/O, so
  # carrying one platform thread per in-flight message buys nothing.
  threads:
    virtual:
      enabled: true

  datasource:
    # DATETIME(6) stored as UTC — never TIMESTAMP. See PLAN.md §3.1.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edutrack}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:edutrack_app}
    password: ${DB_PASSWORD:edutrack}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # One connection per concurrently-sending message, plus headroom for the
      # claim transaction. Keep at or above edutrack.outbox.batch-size.
      maximum-pool-size: 15
      pool-name: edutrack-worker-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # api owns migration. See WorkerApplication's javadoc.
  flyway:
    enabled: false

  # D-011 holds the scheduler locks here. Redis is already required by api for
  # refresh tokens and the JWT blacklist, so this adds no new infrastructure.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}          # Mailpit in local dev
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

edutrack:
  # D-035 · at most one mail per recipient per ticket in this window
  # (blueprint §4B.6). A ticket edited five times in a minute must not put
  # five mails in the assignee's inbox. The throttled mail is dropped, not
  # delayed — spreading a burst out still delivers every mail.
  mail:
    rate-limit-window: ${MAIL_RATE_LIMIT_WINDOW:PT1M}

    # D-032 · the right-hand side of every Message-ID we mint.
    #
    # MUST be stable for the life of a deployment and MUST be a domain we
    # own. Changing it re-roots every future mail, so an existing ticket's
    # thread silently splits in two at the moment of the change — the old
    # mails reference the old root and the new ones reference a root nothing
    # has ever seen. Some providers also reject or spam-score a Message-ID
    # whose domain does not match the sender.
    message-id-domain: ${MAIL_MESSAGE_ID_DOMAIN:edutrack.local}

    # SMTP refuses a message with no sender, and an unset From would make
    # every send a permanent failure the outbox retries three times before
    # giving up. Override per environment alongside MAIL_HOST.
    from: ${MAIL_FROM:no-reply@edutrack.local}

  # D-020 · the SLA scan (blueprint §16 item 3). Fifteen minutes is the
  # blueprint's figure: short enough that a breach is announced while somebody
  # can still act on the day, long enough that the scan is not the reason the
  # database is busy. Shortening it does not detect breaches sooner in any
  # useful sense — the Planned Close Date is a date, not a second.
  sla:
    scan-interval: ${SLA_SCAN_INTERVAL:PT15M}

    # D-023 · the stage-SLA scan (§16 item 3b). A separate scanner and a
    # separate interval from the ticket scan above: a ticket can sit well
    # inside its Planned Close Date while rotting four days in one queue, and
    # the two questions have no reason to be asked on the same schedule.
    stage-scan-interval: ${STAGE_SLA_SCAN_INTERVAL:PT15M}

    # D-021 · the pre-breach sweep. Same cadence as the breach scan, because
    # the useful moment to warn somebody is "soon after they cross 80%", and a
    # slower sweep spends the remaining fifth of the window before speaking.
    pre-breach-scan-interval: ${PRE_BREACH_SCAN_INTERVAL:PT15M}

    # D-022 · the stale-task sweep. Hourly, not quarter-hourly: the threshold
    # is three working DAYS, so a fifteen-minute sweep asks a question whose
    # answer cannot have changed on ninety-five passes out of ninety-six, and
    # each pass costs a working-hours computation per open ticket.
    stale-scan-interval: ${STALE_SCAN_INTERVAL:PT1H}

    # D-024 · the second escalation level. Half-hourly: the trigger is 48
    # working hours past the close date, so the exact minute it fires does not
    # matter, but a manager hearing about it the same morning does.
    l2-scan-interval: ${L2_SCAN_INTERVAL:PT30M}

  # A-051 · the summary tables A-050 declared. CLAUDE.md forbids a live
  # COUNT(*) behind a dashboard, so these rows are the dashboard's only source
  # and staleness here is what a user actually sees.
  stats:
    # Five minutes is the blueprint's figure for dashboard freshness. It is a
    # recompute, not an accumulation, so a missed pass costs latency and never
    # correctness — which is why this can be shortened or lengthened freely.
    refresh-interval: ${STATS_REFRESH_INTERVAL:PT5M}

    # How many trailing days each pass recomputes. A past day can still change:
    # effort is attributed to work_date (§4A.4), so a timesheet filled in on
    # Friday for Monday's work rewrites Monday. Seven covers a working week of
    # late entry; anything older is repaired by the backfill sweep rather than
    # by every pass paying for a month.
    window-days: ${STATS_WINDOW_DAYS:7}

    # Ceiling on how much history one pass fills in. A database that has never
    # run this has every historical day missing, and an uncapped first run would
    # hold the scheduler lock well past its PT4M bound. Backfill advances one
    # contiguous chunk per pass instead and catches up over several.
    backfill-per-pass: ${STATS_BACKFILL_PER_PASS:30}

  outbox:
    enabled: true
    poll-interval: PT5S
    batch-size: 10
    # How long a claimed row stays invisible to other workers. Must exceed the
    # slowest realistic send, or a slow SMTP round-trip becomes a double send.
    lease: PT2M
    # D-033: three retries, then an in-app failure notification.
    max-attempts: 4
    backoff-base: PT1M
    backoff-cap: PT1H
    # `logging` records what would have been sent without touching SMTP, and
    # is the default until D-029 lands the Thymeleaf templates that render a
    # body — email_log carries a subject but no body column. Switch to `smtp`
    # only alongside a real template master.
    transport: logging

  # B-110 · the onboarding outbox (ob_notification_outbox, A-107). Its own
  # block rather than a reuse of edutrack.outbox above: the two queues drain
  # different tables to different populations, and a ticketing mail burst
  # should be tunable without touching the cadence a client's sign-off
  # request leaves at. Same shape, same defaults, on purpose.
  ob-outbox:
    enabled: true
    poll-interval: PT5S
    batch-size: 10
    # How long a claimed row stays SENDING before another worker may reclaim
    # it. Must exceed the slowest realistic send, or an in-flight message is
    # delivered twice.
    lease: PT2M
    # Three retries, then FAILED and an in-app failure notification.
    max-attempts: 4
    backoff-base: PT1M
    backoff-cap: PT1H
    # How often a queue filling with rows on channels this deployment has no
    # adapter for — WHATSAPP until D-101 — is reported in the log. Such rows
    # wait rather than fail, so this is the only place they are visible.
    unroutable-report-interval: PT15M
    email:
      # `logging` records what would have been sent without touching SMTP,
      # and is the default until B-111 lands the templates that render a
      # body. Switch to `smtp` only alongside B-111's transport.
      transport: logging
