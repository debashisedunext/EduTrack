spring:
  application:
    name: edutrack-worker

  main:
    web-application-type: none

  # Java 25 virtual threads (PLAN.md §2.1 — the reason the runtime was raised
  # from 21). A batch of mail sends is almost entirely blocked on SMTP I/O, so
  # carrying one platform thread per in-flight message buys nothing.
  threads:
    virtual:
      enabled: true

  datasource:
    # DATETIME(6) stored as UTC — never TIMESTAMP. See PLAN.md §3.1.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edutrack}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:edutrack_app}
    password: ${DB_PASSWORD:edutrack}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # One connection per concurrently-sending message, plus headroom for the
      # claim transaction. Keep at or above edutrack.outbox.batch-size.
      maximum-pool-size: 15
      pool-name: edutrack-worker-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # api owns migration. See WorkerApplication's javadoc.
  flyway:
    enabled: false

  # D-011 holds the scheduler locks here. Redis is already required by api for
  # refresh tokens and the JWT blacklist, so this adds no new infrastructure.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}          # Mailpit in local dev
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

edutrack:
  # D-035 · at most one mail per recipient per ticket in this window
  # (blueprint §4B.6). A ticket edited five times in a minute must not put
  # five mails in the assignee's inbox. The throttled mail is dropped, not
  # delayed — spreading a burst out still delivers every mail.
  mail:
    rate-limit-window: ${MAIL_RATE_LIMIT_WINDOW:PT1M}

    # D-032 · the right-hand side of every Message-ID we mint.
    #
    # MUST be stable for the life of a deployment and MUST be a domain we
    # own. Changing it re-roots every future mail, so an existing ticket's
    # thread silently splits in two at the moment of the change — the old
    # mails reference the old root and the new ones reference a root nothing
    # has ever seen. Some providers also reject or spam-score a Message-ID
    # whose domain does not match the sender.
    message-id-domain: ${MAIL_MESSAGE_ID_DOMAIN:edutrack.local}

    # SMTP refuses a message with no sender, and an unset From would make
    # every send a permanent failure the outbox retries three times before
    # giving up. Override per environment alongside MAIL_HOST.
    from: ${MAIL_FROM:no-reply@edutrack.local}

  # D-020 · the SLA scan (blueprint §16 item 3). Fifteen minutes is the
  # blueprint's figure: short enough that a breach is announced while somebody
  # can still act on the day, long enough that the scan is not the reason the
  # database is busy. Shortening it does not detect breaches sooner in any
  # useful sense — the Planned Close Date is a date, not a second.
  sla:
    scan-interval: ${SLA_SCAN_INTERVAL:PT15M}

  outbox:
    enabled: true
    poll-interval: PT5S
    batch-size: 10
    # How long a claimed row stays invisible to other workers. Must exceed the
    # slowest realistic send, or a slow SMTP round-trip becomes a double send.
    lease: PT2M
    # D-033: three retries, then an in-app failure notification.
    max-attempts: 4
    backoff-base: PT1M
    backoff-cap: PT1H
    # `logging` records what would have been sent without touching SMTP, and
    # is the default until D-029 lands the Thymeleaf templates that render a
    # body — email_log carries a subject but no body column. Switch to `smtp`
    # only alongside a real template master.
    transport: logging
