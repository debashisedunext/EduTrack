# TaskDesk — Bitbucket Pipelines
#
# Replaces the .github/workflows/ci.yml referenced in docs/TEAM-PLAN.md.
# Stream A owns this file (see docs/TEAM-PLAN.md §6).
#
# Enable at: Repository settings → Pipelines → Settings → Enable Pipelines.

image: maven:3.9-eclipse-temurin-21

definitions:
  caches:
    npm: frontend/node_modules
  services:
    mysql:
      image: mysql:8.4
      variables:
        MYSQL_DATABASE: taskdesk_test
        MYSQL_ROOT_PASSWORD: rootpw
        MYSQL_USER: taskdesk
        MYSQL_PASSWORD: taskdesk
    redis:
      image: redis:7-alpine

  steps:
    - step: &backend-build
        name: Backend — build & test
        caches:
          - maven
        services:
          - mysql
          - redis
        script:
          # Testcontainers is preferred; these services are the fallback for
          # suites that expect a plain MySQL on localhost.
          - cd backend
          - mvn -B -q verify
        artifacts:
          - backend/**/target/*.jar
          - backend/**/target/surefire-reports/**

    - step: &frontend-build
        name: Frontend — lint, test & build
        image: node:20
        caches:
          - npm
        script:
          - cd frontend
          - npm ci
          - npm run lint
          - npm run test -- --run
          - npm run build

    - step: &contract-check
        name: OpenAPI contract — staleness check
        image: node:20
        script:
          # Regenerate the client from the committed spec and fail if the
          # working tree changes. This is the ONLY thing preventing Java ⇄
          # TypeScript drift once shared Zod schemas are off the table.
          - cd frontend
          - npm ci
          - npm run api:generate
          - |
            if [ -n "$(git status --porcelain src/api/generated)" ]; then
              echo "✗ Generated API client is stale."
              echo "  Run 'npm run api:generate' and commit the result."
              git --no-pager diff --stat src/api/generated
              exit 1
            fi
            echo "✓ Generated client is up to date."

    - step: &migration-guard
        name: Migration guard
        image: atlassian/default-image:4
        script:
          # Applied migrations are checksummed by Flyway. Editing one breaks
          # every other developer's database, so it is blocked in CI.
          - git fetch origin develop --depth=50
          - |
            CHANGED=$(git diff --name-status origin/develop...HEAD \
                      -- '*/db/migration/*.sql' | awk '$1 ~ /^(M|D|R)/ {print $2}')
            if [ -n "$CHANGED" ]; then
              echo "✗ An already-applied migration was modified or deleted:"
              echo "$CHANGED"
              echo "  Corrections must be NEW migrations. See CONTRIBUTING.md."
              exit 1
            fi
            echo "✓ No applied migrations were altered."
          # Timestamp versioning — V20260812_1430__description.sql
          - |
            BAD=$(git diff --name-only --diff-filter=A origin/develop...HEAD \
                  -- '*/db/migration/*.sql' \
                  | grep -Ev '/V[0-9]{8}_[0-9]{4}__[a-z0-9_]+\.sql$' || true)
            if [ -n "$BAD" ]; then
              echo "✗ Migration filenames must be V<YYYYMMDD>_<HHMM>__<snake_case>.sql:"
              echo "$BAD"
              exit 1
            fi
            echo "✓ Migration naming is correct."

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *migration-guard
          - step: *backend-build
          - step: *frontend-build
          - step: *contract-check

  branches:
    develop:
      - parallel:
          - step: *backend-build
          - step: *frontend-build
          - step: *contract-check

    main:
      - parallel:
          - step: *backend-build
          - step: *frontend-build
      - step:
          name: Tag release candidate
          script:
            - echo "main is deployable — add deployment step here at M5."
