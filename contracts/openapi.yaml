        actor: { $ref: '#/components/schemas/UserRef' }
        actorType: { type: string, enum: [USER, SYSTEM], description: '`SYSTEM` for auto-escalation.' }
        fieldName: { type: [string, 'null'] }
        oldValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        stageCode: { type: [string, 'null'] }
        cycleNo: { type: integer }
        iterationNo: { type: integer }
        isCorrection: { type: boolean }
        correctsEntryId: { type: [integer, 'null'], format: int64 }
        entryHash: { type: string, description: Chained to the previous entry for this ticket. }
        createdAt: { type: string, format: date-time }
    HistoryListResponse:
      type: object
