openapi: 3.1.0

info:
  title: EduTrack API
  version: 1.0.0-draft
  summary: Organisation task and client ticketing platform.
  description: |
    The agreed contract between all four streams. Every endpoint in blueprint §13.

    **This file is hand-authored and under review (D-001).** It is the design
    contract, not yet the generated one. From D-003 onwards `springdoc` emits the
    real spec from the Java DTOs — Bean Validation annotations are the single
    source of truth for validation rules — and D-005's CI check fails the build
    when the committed TypeScript client drifts from it. Until then this file is
    what the frontend generates against and what the backend must implement.

    ## Conventions that apply to every operation

    - **Prefix** — every path is served under `/api/v1`.
    - **Envelope** — success responses are `{ data, meta? }`. Errors are
      `{ error }` carrying an RFC 9457 problem object. Nothing returns a bare
      array or a bare scalar; adding a field later must never be a breaking change.
    - **Errors** — `application/problem+json`, RFC 9457. `type` is a stable URI
      the frontend may switch on; `detail` is for humans and may change.
    - **Idempotency** — every POST that creates something accepts
      `Idempotency-Key`. Replaying a key within 24 h returns the original response
      rather than creating a second row.
    - **ETag** — detail reads return `ETag`; send `If-None-Match` to get `304`,
      and `If-Match` on the corresponding `PATCH` to avoid a lost update.
    - **Pagination** — `?cursor=&limit=`, never offset. Offset paging over a table
      that is being written to skips and repeats rows.

    `contracts/CONVENTIONS.md` is the normative version (D-002), including the
    endpoints that deliberately opt out of `If-Match` or pagination and why.

    ## Two rules the API shape itself enforces

    **Row scoping returns 404, not 403.** Out-of-scope IDs are indistinguishable
    from non-existent ones. A `403` on `/tickets/{id}` would confirm the ticket
    exists, which is an existence leak. Scoping is applied server-side by
    `ScopeResolver` on every ticket query — never by a frontend filter.

    **History and effort logs are append-only.** `GET` and `POST` exist;
    `PUT`, `PATCH` and `DELETE` deliberately do not, on `/history`,
    `/effort-logs`, and stage transitions. This is not an oversight to be fixed
    later — the routes must never be added. A correction is a new compensating
    entry (`isCorrection`, `correctsEntryId`), like an accounting reversal, and
    the database rejects mutation independently via triggers and grants.

  contact:
    name: Stream D — Engines & Realtime
  license:
    name: Proprietary
    identifier: LicenseRef-EduNext-Proprietary

servers:
  - url: /api/v1
    description: Same origin as the SPA — the app ships as a single jar.
  - url: http://localhost:8080/api/v1
    description: Local development.

tags:
  - name: auth
    description: Login, tokens, password lifecycle.
  - name: users
    description: Resource master. Blueprint §7.2, screens S-07/S-08.
  - name: projects
    description: Project master, members, per-project SLA policies.
  - name: tickets
    description: |
      Ticket CRUD, assignment, closure and the reopen cycle.
      **`cycleNo` and `iterationNo` are two independent counters.** `iterationNo`
      increments when a ticket is pushed *backwards* within a cycle (a QA
      rejection); `cycleNo` increments when a *closed* ticket is reopened.
      Confusing them is the single most likely defect in this domain.
  - name: ribbon
    description: The Workflow Ribbon — stage transitions, handoff, rework, skip. §4A.
  - name: journey
    description: Per-stage, per-resource effort roll-up with the active/idle split. §4A.4.
  - name: comments
    description: Ticket comments — internal by default, five-minute edit window, tombstoned deletes.
  - name: attachments
    description: Upload, scan, thumbnail and serve files by short-lived signed URL. §4B.4.
  - name: clients
    description: Client master and the client 360 view. §4B.2, §4B.7.
  - name: imports
    description: Excel import — one engine, two registered schemas. §4B.3.
  - name: masters
    description: Task types, priorities, statuses, holidays, workflow templates.
  - name: dashboard
    description: Twenty widgets over pre-aggregated summary tables, every one deep-linkable. S-05.
  - name: reports
    description: Eighteen reports through one parameterised runner, with xlsx/csv/pdf export. S-27.
  - name: notifications
    description: Twenty-four events across in-app, bell, email and browser push, with a per-user preference matrix. §11.
  - name: chat
    description: Ticket thread, direct message and project channel — three surfaces, one engine. S-25.
  - name: webhooks
    description: Inbound from the mail provider. Unauthenticated; signature-verified.
  - name: audit
    description: Every login, permission change, master change and ticket action. Export only. S-16.

security:
  - bearerAuth: []

paths:
  # ───────────────────────────────────────────────────────────── auth ────────
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for an access token
      description: |
        Sets the refresh token as an `HttpOnly; Secure; SameSite=Strict` cookie —
        it is never in the response body, where script could read it.

        **Failures are deliberately indistinguishable.** Wrong username, wrong
        password and unknown user all return the same `invalid-credentials`
        problem. Saying which field was wrong is a username-enumeration oracle.
        Lockout after 5 failures for 15 minutes is reported as `account-locked`
        only *after* correct credentials, for the same reason.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`refresh_token=…; HttpOnly; Secure; SameSite=Strict; Max-Age=604800`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: Account locked after repeated failures.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        Reads the refresh cookie; takes no body. The consumed token is revoked and
        replaced on every call.

        **Reuse of an already-consumed token means the token was stolen** — the
        entire token family is revoked and the user must log in again. A silent
        re-issue here would let an attacker keep a parallel session alive
        indefinitely.
      security: []
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401':
          description: Missing, expired, or reused token. On reuse the whole family is revoked.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      description: |
        Deletes the refresh token and blacklists the access token's `jti` in Redis
        until its natural expiry — otherwise a logged-out access token stays valid
        for up to 15 minutes.
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password-reset link
      description: |
        **Always returns 202**, whether or not the address is known. A different
        response for unknown addresses is a user-enumeration oracle. The token is
        single-use, 30-minute TTL, and stored hashed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 'If the address exists, a reset mail has been queued.' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Complete a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 32 }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed; all sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '410':
          description: Token expired or already used.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The authenticated user, with resolved permissions and scope
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/password:
    patch:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Change own password
      description: Rejects reuse of the last three passwords. Clears `mustChangePassword`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Changed. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── A-029 · two-factor enrolment ────────────────────────────────────────────
  #
  # STREAM A ADDITION — flagged for Debashis's review rather than made silently
  # (CLAUDE.md, code ownership: Stream D owns this file).
  #
  # The contract described 2FA only as LoginRequest.totpCode, with no endpoints
  # for enrolling, confirming, disabling, or for recovery codes. A-029 needs all
  # of them, and ContractConformanceTest fails the build on any served endpoint
  # that is not here — its own message says "add it to the contract and get it
  # reviewed, or remove it". These are added so the build is green and the
  # generated client can be regenerated; the review is still owed.
  #
  # Recovery codes are an addition beyond the blueprint too: §10.3 and S-04
  # describe TOTP and stop, but a second factor living on one device makes a lost
  # phone a permanently locked account.
  /me/2fa/setup:
    post:
      tags: [auth]
      operationId: beginTwoFactorEnrolment
      summary: Start two-factor enrolment
      description: |
        Generates a shared secret and returns it with an `otpauth://` URI to
        render as a QR code. **Does not enable 2FA** — the account is unchanged
        until `/me/2fa/confirm` succeeds, so a QR that fails to scan cannot lock
        the user out of the account they were protecting.

        Calling it again replaces an unconfirmed secret. Refused once 2FA is on:
        re-enrolling requires disabling first, and disabling requires the
        password, so a stolen access token cannot swap the second factor.
      responses:
        '200':
          description: Secret and otpauth URI. 2FA is not yet enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorSetupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/2fa/confirm:
    post:
      tags: [auth]
      operationId: confirmTwoFactorEnrolment
      summary: Confirm two-factor enrolment and switch it on
      description: |
        Verifies a code from the authenticator — proving the secret was added —
        and only then enables 2FA.

        **Returns the recovery codes, once.** They are stored hashed and cannot
        be shown again. Issued here rather than at setup, because codes handed
        out for an enrolment that was never completed would be live credentials
        for an account with no second factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Two-factor enabled. Recovery codes returned once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorRecoveryCodesResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/2fa/disable:
    post:
      tags: [auth]
      operationId: disableTwoFactor
      summary: Turn two-factor authentication off
      description: |
        **Requires the account password**, not just a valid access token.
        Removing the second factor is the first thing a stolen fifteen-minute
        token would be used for, and a token must not be enough to strip the
        protection it was layered under.

        Clears the secret and every recovery code, so re-enabling means scanning
        a new QR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204': { description: 'Two-factor off. Secret and recovery codes cleared.' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ──────────────────────────────────────────────────────────── users ────────
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List resources (S-07)
      description: |
        The Resource Master grid, and the directory every assignee picker reads.

        Every role may call this — the resource directory is not confidential,
        and the ticket-assignee picker (S-18) and `@mention` resolution are the
        same data. Only Admin sees the write actions, which are separate routes.

        The file download is `GET /users/export`, deliberately a separate
        operation — see the note there.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string }, description: 'Name, username, email or employee code.' }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/RoleCode' } }
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: managerId, in: query, schema: { type: integer, format: int64 } }
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a resource
      description: |
        Generates a temporary password and sets `mustChangePassword`. Username,
        email and employee code are each unique.

        **The generated password is in `meta.temporaryPassword` of the `201`,
        and that is the only time it is ever readable.** It is stored as an
        Argon2id hash like any other, so no later request can recover it — an
        admin who loses it issues a reset rather than looking it up. This is
        why the create response has its own schema instead of reusing
        `UserResponse`: a password field on `User` could be returned by
        `listUsers`, and a field that *cannot* leak is worth more than a field
        that is merely not populated today.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserWriteRequest' }
      responses:
        '201':
          description: Created. `meta.temporaryPassword` is readable once, here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCreatedResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get:
      tags: [users]
      operationId: getUser
      summary: One resource, in full (S-08)
      description: |
        The S-08 form's read. Returns `UserDetail` — every field `listUsers`
        returns, plus the ones only the form needs: mobile, joining date,
        location, capacity, weekly-off override, skills, and the per-project
        role assignments.

        **This carries the `ETag` that `PATCH /users/{userId}` requires as
        `If-Match`.** Added in B-011 because it was missing: CONVENTIONS.md §5
        pairs every `If-Match` write with a detail read that emits the tag, and
        `PATCH /users/{userId}` had no such read — so the precondition it
        documents was unobtainable and the operation could not be called
        correctly by anybody. `/projects/{projectId}` and `/clients/{clientId}`
        have their detail reads; this was the gap.

        The tag is derived from the response content, not from `updated_at`, so
        a save that rewrites identical values does not invalidate a concurrent
        edit that conflicts with nothing.
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              schema: { type: string }
              description: Send back as `If-Match` on the `PATCH`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a resource
      description: |
        **A reporting-manager change is rejected with `409` if it creates a cycle
        at any depth**, not merely self-reference. A→B→C→A is as broken as A→A,
        and the database `CHECK` only catches the latter. Landed in **B-012**;
        the `type` is `manager-cycle` and `errors` names `reportingManagerId`,
        so the refusal lands on the picker like any field error.

        The same `409` is returned when the proposed manager's own reporting
        line does not terminate — a cycle that already exists further up. The
        walk is bounded, so such data is a refusal rather than a `500`, and
        repairing the line above is a separate edit.

        `If-Match` is required, not optional — a write without one is refused
        with `428`. Treating a missing precondition as "no conflict" would mean
        the guard protects only the clients that already opted in, which is the
        set that needed it least. Read the current tag from `GET /users/{userId}`.

        See `UserWriteRequest` for which keys are required here and what an
        absent one versus an explicit `null` one does.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserWriteRequest' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag:
              schema: { type: string }
              description: The new tag, so a second edit needs no re-read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428':
          description: |
            `If-Match` absent. GET the resource and send back its `ETag`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /users/{userId}/status:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    patch:
      tags: [users]
      operationId: setUserStatus
      summary: Activate or deactivate
      description: |
        Deactivating a resource holding open tickets returns `409` with
        `openTicketCount`. The caller must reassign them first — via
        `POST /tickets/bulk-reassign` — because silently orphaning live tickets is
        how work disappears.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        '204': { description: Changed. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Open tickets must be reassigned first.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/OpenTicketsProblem' }

  /users/export:
    get:
      tags: [users]
      operationId: exportUsers
      summary: Download the filtered resource list (S-07)
      description: |
        The same query as `listUsers`, streamed as a file. Takes the same
        filters and applies them the same way — one code path builds both, so
        "download what I'm looking at" cannot quietly mean something else.

        **Cursor and limit are absent by design.** The export is every matching
        row. One that stopped at the current page would produce a file that
        looks complete and is not, which is the failure nobody checks for
        because the file opens.

        > **Why a separate operation rather than `?export=` on `listUsers`,
        > which is what `/reports/{key}` and `/audit-logs` do.** An operation
        > that declares both `application/json` and
        > `application/octet-stream` generates a client returning
        > `Blob | UserListResponse`. Every existing caller of `useListUsers` —
        > the ticket list's assignee filter and the create form's assignee
        > picker among them — then fails to compile until it narrows a union it
        > has no interest in, and every future caller pays the same tax. Tried
        > it that way in B-010 and reverted; **the same latent break sits in
        > `/reports/{key}` and `/audit-logs`, which have no consumer yet.**
        > Raised with Streams A and D rather than changed here.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, csv] } }
        - { name: q, in: query, schema: { type: string }, description: 'Name, username, email or employee code.' }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/RoleCode' } }
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: managerId, in: query, schema: { type: integer, format: int64 } }
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: The file, named by `Content-Disposition`.
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="resources-2026-08-11.xlsx"'] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/bulk-status:
    post:
      tags: [users]
      operationId: setUserStatusBulk
      summary: Activate or deactivate a selection (S-07)
      description: |
        The bulk half of `PATCH /users/{userId}/status`, for the resource
        grid's selection bar.

        **Answers `200` with a per-resource outcome, not a single verdict.** A
        selection of forty in which two hold open tickets is the normal case,
        and both alternatives are wrong: failing the batch punishes the
        thirty-eight, and succeeding quietly hides the two. Each row comes back
        as `CHANGED`, `UNCHANGED`, `BLOCKED_OPEN_TICKETS` or `NOT_FOUND`, and
        the caller renders exactly what happened.

        `BLOCKED_OPEN_TICKETS` carries the count, matching the singular route's
        `409`. Those resources are reassigned through
        `POST /tickets/bulk-reassign` first — deactivating them regardless is
        how live work disappears.

        No `Idempotency-Key` and no `If-Match`: setting a flag to a stated value
        is idempotent, so a replay converges rather than double-acting, and last
        write wins is the correct semantic. CONVENTIONS.md §5 records the same
        exemption for the singular route.

        **Admin only**, like every master write. Refused before any id in the
        body is read, so the refusal says nothing about which resources exist —
        which is why this documents no `403` of its own, exactly as
        `PATCH /users/{userId}/status` and `POST /users` do not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkUserStatusRequest' }
      responses:
        '200':
          description: Per-resource outcomes. Partial success is expected, not exceptional.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkUserStatusResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{userId}/profile-360:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get:
      tags: [users]
      operationId: getUserProfile360
      summary: Resource 360° profile (S-28)
      description: |
        A-069 · the scorecard half of S-28. The screen composes four calls, and
        this is the one that did not already exist:

        - the open and historical ticket lists come from `GET /tickets`, which
          already paginates and scopes — "complete historical" is precisely the
          list that must not be embedded whole;
        - the effort timeline and velocity chart come from
          `GET /reports/resource-velocity?resourceId=`, which returns closed and
          effort per week for one person and so serves both charts.

        **Who may look at whom is blueprint §2's "View team member history" row**:
        Admin anyone, PM their reportees *or* anybody on their projects, Support
        anybody on their projects, and the three delivery roles nobody — except
        themselves, which §2's Reports row grants them as "Own perf.".

        A caller who may not see the subject gets the same `404` as one asking
        for a user that does not exist. Distinguishing them would let anyone
        enumerate the staff list by id, which is the existence leak the row-scoping
        rule closes for tickets, and a person is at least as sensitive.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile360Response' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{userId}/reportees:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    get:
      tags: [users]
      operationId: listReportees
      summary: Direct and indirect reportees
      parameters:
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 1 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────────────────────────────────── projects ────────
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List projects (S-10)
      description: |
        The S-10 grid, and the picker five other screens fill from.

        **`isActive` and `status` are two questions, not one.** `status` is the
        blueprint's three-way Active / On Hold / Closed and is what the master
        grid renders and filters on. `isActive` is the derived boolean the
        pickers have always sent — the project switcher, the ticket list, the
        create-ticket form and both resource screens — and it means
        `status <> 'CLOSED'`, so an On Hold project still appears in them.

        Deriving it from `status = 'ACTIVE'` instead would have made putting a
        project on hold silently remove it from the create-ticket picker, with
        nothing on the form saying why. Whether On Hold should stop new tickets
        is a product decision that belongs on that form with a visible message,
        not one a boolean makes on its way past.

        Sending both is an `AND`: `?status=ON_HOLD&isActive=false` is a
        contradiction and correctly returns nothing.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: isActive
          in: query
          description: '`true` is every project except `CLOSED`.'
          schema: { type: boolean }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
        - name: managerId
          in: query
          description: Projects this resource manages.
          schema: { type: integer, format: int64 }
        - name: q
          in: query
          description: Case-insensitive substring of the code or the name.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project (S-10)
      description: |
        `projectCode` is upper-cased server-side and must be unique — a duplicate
        is a `409` keyed on the field, because it is the ticket-ID prefix and two
        projects sharing one would issue colliding codes.

        This is the **only** operation that may set it freely. See
        `PATCH /projects/{projectId}` for what happens afterwards.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectWriteRequest' }
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              schema: { type: string }
              description: So an immediate edit needs no re-read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: Duplicate `projectCode`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }

  /projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      operationId: getProject
      summary: One project (S-10)
      description: |
        The read half of the edit form, and **the only place the `ETag` that
        `PATCH` requires can be obtained**. Without it the write below declared a
        precondition with nowhere to satisfy it — the same gap B-011 closed for
        `GET /users/{userId}`.

        `ticketsIssued` is on the detail and not on the list row: it is what
        makes `projectCode` immutable, and the form needs it in order to disable
        the field and say why rather than letting an admin type a new code and
        discover the refusal on save.
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              schema: { type: string }
              description: Send back as `If-Match` on the `PATCH`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Update a project (S-10)
      description: |
        **`projectCode` is immutable once the project has issued a ticket ID** —
        it is the prefix of every code already quoted in mail, chat and client
        conversations, and changing it orphans all of them at once while leaving
        each looking healthy. Attempting it returns `409` with type
        `immutable-project-code`.

        The test is `projects.ticket_seq > 0`, **not** whether a ticket row still
        exists. The counter records that a code was *issued*; a ticket created
        and later deleted still had `CRM-26-00347` sent to a client, so a
        cleanup must not quietly re-open the prefix for editing.

        Sending the *same* code back is always fine, and has to be — S-10 submits
        the whole form on every save, so any other reading would make every edit
        to a live project a `409`.

        `If-Match` is required, not optional; a write without one is refused with
        `428`. Read the current tag from `GET /projects/{projectId}`.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatchRequest' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag:
              schema: { type: string }
              description: The new tag, so a second edit needs no re-read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate `projectCode`, or an attempt to change one that is fixed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428':
          description: '`If-Match` absent. The precondition is required, not opt-in.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /projects/{projectId}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      operationId: listProjectMembers
      summary: The project team (S-10 Team tab)
      description: |
        The roster, ordered by name. **Every authenticated role may read it** —
        this is who a ticket on the project can be assigned to, and a Developer
        who cannot see the team cannot pick a handoff target.

        Not paged. A project team is tens of people, not thousands; a cursor
        here would be pagination machinery on a list that fits on one screen,
        and the Team tab needs the whole set anyway to total the allocations.

        **Deactivated memberships are not returned.** Removing somebody sets
        `is_active = 0` rather than deleting the row, so the record that they
        were once on the project survives — but they are not on the team now,
        and a roster that showed them would be answering a different question.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [projects]
      operationId: addProjectMember
      summary: Add a member with a per-project role and allocation
      description: |
        **Re-adding somebody who was removed reactivates their row rather than
        conflicting with it.** `uq_project_members (project_id, user_id)` means
        there is only ever one row per pair, and a removal deactivates it; a
        `409` here would make every removal permanent, which reads as a bug in
        the remove button rather than as a rule. `409` is for somebody who is
        *already on the team*, which is a request that has nothing to do.

        Requires `project.manage` — blueprint §2's "map resources to a project",
        which B-001 grants to Admin and PM.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMemberWrite' }
      responses:
        '201':
          description: Added, or an earlier membership reactivated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [projects]
      operationId: updateProjectMember
      summary: Change a member's project role or allocation
      description: |
        The Team tab's inline edit. An omitted field keeps its stored value; an
        explicit `null` clears it, which is the only way to get back to "same as
        their global role" or "allocation not stated".

        **Without this, changing an allocation would mean remove-and-re-add** —
        which deactivates and reactivates the membership row and resets
        `addedAt`, turning an edit into a fabricated departure and return.

        No `If-Match`. Two people editing one member's allocation is a race
        whose loser typed a number a moment later and meant it; CONVENTIONS.md
        §5 puts the precondition where a lost update is silent and costly, and
        this row has two fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMemberPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [projects]
      operationId: removeProjectMember
      summary: Remove a member
      description: |
        Rejected with `409` while that member holds open tickets on the project.
        "Open" is `statuses.is_open`, not a hardcoded status list — the status
        vocabulary is master data an Admin extends (S-13).

        The row is **deactivated, not deleted**: it is the record that this
        person was on the project while the tickets assigned to them then were
        being worked, and a `DELETE` would make historical project attribution
        depend on current team composition.

        Removing somebody who is not on the team answers `204`. It is a setter,
        and a client retrying after a dropped response has to converge.
      responses:
        '204': { description: 'Removed, or was not a member.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Member holds open tickets here.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/OpenTicketsProblem' }

  /projects/{projectId}/sla-policies:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      operationId: getSlaPolicies
      summary: SLA matrix — task type × level
      description: |
        The **resolved** grid: one cell per active task type × level, each
        carrying the figures a ticket raised in it would actually be measured
        against and the `source` that produced them.

        Cells are resolved, not listed. `sla_policies` is layered — a null
        `project_id` is the org-wide default and a null `task_type_id` means
        "any type" — so returning this project's own rows would show an
        administrator a nearly empty grid for a project whose tickets all have
        perfectly good SLA targets. Reading the ladder here is the only way the
        screen can say *"8 hours, inherited from the org default"*, which is
        the difference between a matrix somebody can reason about and a form.

        The ladder is §6's, extended past its three policy rungs to the priority
        and task-type master defaults exactly as `SlaResolution.Source`
        describes — the same answer C-012's planned-close-date preview gives, so
        the number on this screen and the date on the create form cannot
        disagree.

        Every role may read it. The grid is what decides every ticket's planned
        close date, and a developer who cannot see why their ticket is due
        Thursday cannot argue with it.
      responses:
        '200':
          description: OK.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaPolicyListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [projects]
      operationId: replaceSlaPolicies
      summary: Replace the SLA matrix
      description: |
        Replaces the whole matrix in one transaction — a partial update would
        leave a task type × level combination silently unmapped, and the first
        ticket to hit it would get no planned close date at all.

        **The body carries this project's overrides, not the resolved grid.** A
        cell absent from it goes back to inheriting; a cell present in it becomes
        a `sla_policies` row for this project and task type. Sending the whole
        grid back — including the cells `GET` resolved from a broader rung —
        would materialise every inherited figure as a project-level override, and
        the project would then silently stop following the org-wide default it
        was shown as following. `isOverride` on each cell is what tells the two
        apart.

        Rows this screen has no cell for are left alone: a project-level default
        (`task_type_id IS NULL`, the §6 rung between this project's overrides and
        the org-wide default) survives a replace, because a task type × level
        grid cannot express one and a replace that dropped it would delete
        configuration through a screen that never displayed it.

        **Removed overrides are deactivated, never deleted.** `clients.sla_policy_id`
        is a foreign key into this table and `PlannedCloseDatePreview.slaPolicyId`
        puts row ids on the wire; a `DELETE` would break the first and orphan the
        second. `is_active = 0` is also what the resolution ladder already reads,
        so a deactivated override falls through to the next rung rather than
        leaving a hole.

        **Changing a policy never retrospectively moves an existing ticket's
        planned close date.** Tickets carry the policy they were created under.

        Admin only — `master.write`. Blueprint §2 lists SLA under master data,
        and B-001's own description of the capability names it. This is
        deliberately narrower than the Team tab beside it, which is
        `project.manage` and reaches PM: mapping a resource to a project is
        project management, and setting the response target a client is held to
        is not.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/SlaPolicyWrite' }
      responses:
        '200':
          description: Replaced. Returns the newly resolved grid.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaPolicyListResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /projects/{projectId}/settings:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [projects]
      operationId: getProjectSettings
      summary: Project settings — allowed task types, mandatory fields, auto-assign
      description: |
        S-10's fourth tab, as one document: which task types may be raised on
        this project, which otherwise-optional ticket fields it requires, and
        who an unassigned new ticket goes to.

        **`taskTypes` is the resolved list, not the stored one.** It carries
        every *active* task type with an `isAllowed` flag, not just the ids this
        project has rows for — the screen is a checkbox list and a response
        holding only the ticked ones cannot render the unticked ones. Same call
        `getSlaPolicies` makes about its grid, and `name` rides along for the
        same reason: `/masters/task-types` is not mounted yet (B-020), and a
        list that renders "task type 7" is not a screen.

        **`restrictsTaskTypes: false` means every active type is allowed**, and
        it is not the same statement as "none are". A project with no
        `project_task_types` rows is unrestricted, which is what every project
        that predates this screen is; if an empty set meant "nothing may be
        raised here", running the migration would have stopped ticket creation
        everywhere. The flag is on the wire so a client never has to infer that
        from an array of eleven `isAllowed: true` values it cannot tell from
        eleven explicit ones.

        Every role may read it. All six can raise a ticket, and the create form
        cannot mark a field mandatory or filter its task-type picker without
        this.
      responses:
        '200':
          description: OK.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSettingsResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [projects]
      operationId: replaceProjectSettings
      summary: Replace project settings
      description: |
        Replaces all three settings in one transaction. A `PATCH` of one field
        would need an `ETag` per field to be safe against a second tab, and the
        tab has one Save button — the whole document is what the screen holds.

        **An empty `allowedTaskTypeIds` clears the restriction rather than
        forbidding everything.** It is the request that returns the project to
        the unrestricted state it was created in, and there is deliberately no
        separate "remove restriction" control: two controls for one outcome is
        how they end up disagreeing (the same call `replaceSlaPolicies` makes
        about a cleared cell). The screen states the consequence in words, which
        is the part that stops it reading as "nothing may be raised".

        **`mandatoryFields` names only fields `TicketCreateRequest` leaves
        optional.** `projectId`, `title`, `taskTypeId` and `level` are already
        required of every ticket, so offering them here would be a control that
        cannot change anything.

        `project.manage` — Admin and PM, like the Team tab and unlike the SLA
        tab. Choosing which task types a project accepts is project
        configuration; setting the response target a client is contractually
        held to is master data. `autoAssignRule` is also already PM-writable
        through `PATCH /projects/{projectId}`, so narrowing this to Admin would
        take away a capability PMs hold today.

        **Nothing enforces these settings yet.** Ticket creation is Stream C's
        (`api/feature/tickets`, `CreateTicketPage`); B-019 stores and serves the
        configuration and C consumes it. Said here rather than left to be
        discovered, because a settings screen whose settings do nothing is a
        screen that looks finished.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectSettingsWrite' }
      responses:
        '200':
          description: Replaced. Returns the stored settings, resolved.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSettingsResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  # ────────────────────────────────────────────────────────── tickets ────────
  /tickets:
    get:
      tags: [tickets]
      operationId: listTickets
      summary: List tickets — row-scoped server-side
      description: |
        `ScopeResolver` narrows this per role before any filter the caller sent:
        Admin unrestricted; PM and Support to their projects; Developer, QA and
        Deployment to `assignedTo = me`. The caller cannot widen it.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string }, description: Full-text over title and description. }
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: clientId, in: query, schema: { type: integer, format: int64 } }
        - { name: taskTypeId, in: query, schema: { type: integer, format: int64 } }
        - { name: moduleId, in: query, schema: { type: integer, format: int64 }, description: 'Product module the concern was raised against (§7.5).' }
        - { name: level, in: query, schema: { $ref: '#/components/schemas/Level' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusCode' } }
        - { name: stage, in: query, schema: { type: string, examples: [QA] } }
        - { name: assigneeId, in: query, schema: { type: integer, format: int64 } }
        - { name: isDelayed, in: query, schema: { type: boolean } }
        - { name: isClientRaised, in: query, schema: { type: boolean } }
        - { name: reopenedOnly, in: query, schema: { type: boolean } }
        - { name: unassigned, in: query, schema: { type: boolean }, description: 'True to return only tickets with no assignee.' }
        - { name: excludeClosed, in: query, schema: { type: boolean }, description: 'True to exclude tickets in CLOSED status.' }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
        - { name: closedFrom, in: query, schema: { type: string, format: date }, description: 'Filters on actualCloseDate, inclusive.' }
        - { name: closedTo, in: query, schema: { type: string, format: date }, description: 'Filters on actualCloseDate, inclusive.' }
        # A-060 · the third date window. Every dashboard card and chart segment
        # that names a period names it over dateReported, which is what the
        # summary tables are keyed by — without this pair those deep-links
        # applied the right filter over all time. ⚠️ contracts/ is Stream D's.
        - { name: reportedFrom, in: query, schema: { type: string, format: date }, description: 'Filters on dateReported, inclusive.' }
        - { name: reportedTo, in: query, schema: { type: string, format: date }, description: 'Filters on dateReported, inclusive.' }
        - { name: sort, in: query, schema: { type: string, default: '-createdAt' } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tickets]
      operationId: createTicket
      summary: Create a ticket
      description: |
        The ticket ID is generated server-side as `{PROJECT_CODE}-{YY}-{NNNNN}`
        using `UPDATE projects SET ticket_seq = LAST_INSERT_ID(ticket_seq + 1)`.
        **Never a `COUNT(*)`** — that produces duplicate IDs under concurrency and
        fails silently. The sequence does not reset at year rollover.

        On success: the ID is issued, a `CREATED` history row is written, the
        assignee is notified, and mail is queued in the same transaction.

        **B-028 — the client gate, owed by whoever implements this operation.**
        Blueprint line 948: a client is not selectable on a ticket until it has
        at least one primary contact. `Client.hasPrimaryContact` reports it on
        every row `GET /clients` returns, and the create form refuses the
        selection with the reason on screen — but this endpoint is the only
        place it can be *enforced*, and there is no server behind `POST
        /tickets` yet (C-013's own notes say the ticket-create service does not
        exist). So: a `clientId` naming a client with `hasPrimaryContact:
        false` must be a **400** keyed on `clientId`, not a silent accept.

        B-029's mirror rule belongs at the same point: a client whose `status`
        is `INACTIVE` blocks a **new** ticket, and never hides historical ones.

        Both are `400` rather than `404` — unlike the row-scope `404` below,
        which exists so an out-of-scope id leaks nothing. These two clients are
        legitimately visible to the caller; what is refused is the combination,
        and a caller who cannot tell "does not exist" from "not yet usable"
        cannot act on either.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreateRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string }, description: '`/api/v1/tickets/{ticketId}/full`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404':
          description: Project, client or assignee not visible to the caller.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /tickets/planned-close-date:
    get:
      tags: [tickets]
      operationId: previewPlannedCloseDate
      summary: Resolve the SLA policy and preview the planned close date (C-012)
      description: |
        Answers **when** a ticket raised now — or at `from` — would be due, and
        **why**, without creating anything.

        The date is the SLA target walked forward over the working calendar:
        weekends, org and project holidays, and the assignee's approved leave are
        skipped rather than counted, so a Friday-18:00 ticket with a four-hour
        target lands on Monday morning. That calculation cannot be done in the
        browser — leave belongs to a resource the caller may not be able to read,
        and a second implementation of it would disagree with the server quietly,
        by a weekend.

        Resolution runs most-specific-first and stops at the first rung that
        answers, reported back as `source`:

        | `source` | rung |
        |---|---|
        | `PROJECT_TASK_TYPE` | this project's policy for this task type and level |
        | `PROJECT_LEVEL` | this project's default for the level |
        | `ORG_DEFAULT` | the org-wide default for the level |
        | `PRIORITY_DEFAULT` | the priority master's `defaultSlaHrs` (S-12) |
        | `TASK_TYPE_DEFAULT` | the task type master's `defaultSlaHrs` (S-11) |
        | `NONE` | nothing matched — `plannedCloseDate` is null |

        The last two rungs go beyond §6's three policy rungs deliberately. A
        project whose SLA matrix has not been configured — every project on its
        first day — would otherwise give every ticket a null planned close date,
        which silently removes it from the breach sweep, the pre-breach warning,
        the delayed KPI and the Due Today saved view.

        Safe to call on every change to project, task type, level or assignee.
        It takes no request body: previewing must not require a valid draft, and
        §4B.1's rule is that changing the level recomputes the date *while the
        form is still being filled in*.
      parameters:
        - name: projectId
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: The SLA matrix is per project; resolving without one would answer with the org-wide default.
        - name: taskTypeId
          in: query
          schema: { type: integer, format: int64 }
          description: |
            Optional — without it the first rung cannot match and resolution
            starts at the project's default for the level, so the form can
            preview before a task type is picked.
        - name: level
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Level' }
        - name: assigneeId
          in: query
          schema: { type: integer, format: int64 }
          description: |
            Whose approved leave stops the clock. Omitted honours only the org
            and project calendar — correct rather than a shortcut, since nothing
            else knows whose leave would apply.
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: |
            When the clock starts, defaulting to now. Present because §7.5 lets a
            PM or Admin backdate Date Reported, and a preview measured from the
            wrong instant is worse than no preview.
      responses:
        '200':
          description: OK. A `NONE` source with null dates is a valid answer, not an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedCloseDateResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/bulk-reassign:
    post:
      tags: [tickets]
      operationId: bulkReassignTickets
      summary: Reassign many tickets from one resource to another (S-17, S-24)
      description: |
        **Each ticket gets its own history entry** — a bulk operation that writes
        one summary row destroys the per-ticket audit trail, which is the point of
        having one.

        **PM and Admin only** — see `/tickets/bulk-level` for the matrix that
        applies to all three bulk actions.

        Two callers, one endpoint: S-24's wizard drives it from a source
        resource, and S-17's grid drives it from a tick-box selection. The
        difference is entirely in how `ticketIds` is assembled.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketIds, toUserId, reason]
              properties:
                ticketIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/TicketId' }
                toUserId: { type: integer, format: int64 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Per-ticket outcome; partial success is possible and reported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResultResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /tickets/bulk-level:
    patch:
      tags: [tickets]
      operationId: bulkChangeTicketLevel
      summary: Change the priority level of many tickets (S-17)
      description: |
        The bulk half of `PATCH /tickets/{ticketId}/priority`, for S-17's grid
        selection. One request rather than one per selected row: fifty ticked
        tickets is fifty round trips, fifty planned-close-date recomputations
        interleaved with each other, and fifty chances for a partial result
        nobody can reconstruct afterwards.

        **The per-ticket rules are unchanged and applied per ticket.**
        `originalLevel` is never overwritten, every accepted change writes its
        own `LEVEL_CHANGED` history entry, and the planned close date is
        recomputed against the working calendar for each ticket individually. A
        bulk call is fifty applications of one rule, not one application to
        fifty rows.

        `reason` is **mandatory here**, where the single-ticket endpoint only
        requires it once the ticket is assigned. A selection spanning both
        assigned and unassigned tickets would otherwise need the caller to know
        which is which before deciding whether to type one, and the reason is
        the only record of why fifty levels moved at once.

        ### Permission matrix — all six roles

        | Role | Allowed |
        |---|---|
        | Admin | yes, unrestricted |
        | PM | yes, within their projects |
        | Support | no — `403` |
        | Developer | no — `403` |
        | QA | no — `403` |
        | Deployment | no — `403` |

        **Refused server-side, not merely hidden.** The grid draws no selection
        column for the four roles that cannot act, but a request built by hand
        is refused all the same. Row scoping applies first, so a ticket outside
        the caller's scope comes back as a per-ticket `Not found` in the result
        rather than a `403` — no existence leak, same rule as everywhere else.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketIds, level, reason]
              properties:
                ticketIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/TicketId' }
                level: { $ref: '#/components/schemas/Level' }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Per-ticket outcome; partial success is possible and reported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResultResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tickets/bulk-close:
    post:
      tags: [tickets]
      operationId: bulkCloseTickets
      summary: Close many tickets in the current cycle (S-17)
      description: |
        The bulk half of `POST /tickets/{ticketId}/close`, for S-17's grid
        selection. Same permission matrix as `PATCH /tickets/bulk-level`.

        **Each ticket closes as its own transaction** — `actualCloseDate` is
        stamped, the open stage transition is sealed, and a `CLOSED` history
        entry is written, per ticket. One ticket refusing does not roll back the
        others, which is why the result is per-ticket rather than a single
        status code.

        **A ticket already closed is reported as refused, not silently
        re-closed.** Re-stamping `actualCloseDate` would move a date that
        reports already depend on, and sealing an already-sealed transition is
        exactly the mutation the append-only rule forbids. The caller sees
        `Already closed` beside that row.

        `resolutionSummary` is shared across the selection by design: a bulk
        close is one decision about a batch, and offering fifty free-text boxes
        would produce fifty copies of the same sentence or fifty blanks.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketIds, resolutionSummary]
              properties:
                ticketIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/TicketId' }
                resolutionSummary: { type: string, minLength: 3, maxLength: 4000 }
                rootCauseCategory: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Per-ticket outcome; partial success is possible and reported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResultResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tickets/{ticketId}:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    patch:
      tags: [tickets]
      operationId: updateTicket
      summary: Update ticket fields
      description: |
        Which fields a caller may change is role-dependent and enforced
        server-side. Every accepted change writes a `FIELD_CHANGED` history entry
        with the old and new value.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketPatchRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /tickets/{ticketId}/full:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    get:
      tags: [tickets]
      operationId: getTicketDetail
      summary: Ticket detail in one call
      description: |
        Ticket, cycles, ribbon, history, effort logs, comments, attachments and
        watchers together. Deliberately one aggregated call rather than the six
        the detail page would otherwise fire — the waterfall is what makes the
        page feel slow, not the payload size.
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - name: cycle
          in: query
          schema: { type: integer, minimum: 1 }
          description: Defaults to the current cycle. Earlier cycles are read-only.
      responses:
        '200':
          description: OK.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetailResponse' }
        '304': { description: Not modified. }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/assign:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [tickets]
      operationId: assignTicket
      summary: Assign or reassign within the current stage
      description: |
        **This does not create a new ribbon segment.** Reassignment inside a stage
        writes `STAGE_REASSIGNED` and splits effort attribution so both resources
        appear in the journey roll-up. Only a handoff advances the ribbon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId: { type: integer, format: int64 }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableTransition' }

  /tickets/{ticketId}/priority:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    patch:
      tags: [tickets]
      operationId: changeTicketPriority
      summary: Change the priority level
      description: |
        **`reason` is mandatory once the ticket is assigned.** Recomputes and
        returns the new planned close date.

        **`originalLevel` is never overwritten.** It is what makes "born critical
        versus became critical" reportable, and it is the first thing a manager
        asks. Writes `LEVEL_CHANGED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { $ref: '#/components/schemas/Level' }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/quick-update:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [tickets]
      operationId: quickUpdateTicket
      summary: Status, effort, note and ETA in one call (S-21)
      description: |
        The two-click update from the list and My Tasks. Effort logged here is
        auto-stamped with the current stage and iteration, so it lands in the
        right journey row with no user action.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickUpdateRequest' }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/effort:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [tickets]
      operationId: logEffort
      summary: Append an effort log
      description: |
        **Append-only. There is no update or delete route, and there never will
        be.** A correction is a new entry with `isCorrection` and
        `correctsEntryId`, exactly like an accounting reversal. The database
        rejects mutation independently via triggers and grants, so a bug in this
        layer cannot silently rewrite history.

        Stage, iteration and cycle are stamped server-side from the ticket's
        current position — never sent by the client, which would let a stale tab
        attribute effort to the wrong stage.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EffortLogRequest' }
      responses:
        '201':
          description: Logged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffortLogResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/effort-logs:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    get:
      tags: [tickets]
      operationId: listEffortLogs
      summary: Effort log — read only
      description: |
        `GET` only. **No `PUT`, `PATCH` or `DELETE` route is defined for this path
        by design.** See `POST /tickets/{ticketId}/effort`.
      parameters:
        - { name: cycle, in: query, schema: { type: integer, minimum: 1 } }
        - { name: stage, in: query, schema: { type: string } }
        - { name: iteration, in: query, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffortLogListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/history:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    get:
      tags: [tickets]
      operationId: listTicketHistory
      summary: History — read only, cycle-grouped
      description: |
        `GET` only. **No mutation route exists for this path by design**, and the
        API rejects mutation even if the DOM is manipulated to attempt it.

        Comments, field changes, handoffs and attachments interleave into one
        chronological stream when `include=comments` — two separate lists that the
        reader has to reconcile by timestamp is the thing this avoids.
      parameters:
        - { name: cycle, in: query, schema: { type: integer, minimum: 1 } }
        - name: include
          in: query
          schema: { type: array, items: { type: string, enum: [comments, attachments] } }
          style: form
          explode: false
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/resolve:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [tickets]
      operationId: resolveTicket
      summary: Mark resolved
      description: |
        Resolved is not closed. Closure belongs to the sign-off stage owner —
        governance decision G-3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolutionSummary]
              properties:
                resolutionSummary: { type: string, minLength: 3, maxLength: 4000 }
                rootCauseCategory: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableTransition' }

  /tickets/{ticketId}/close:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [tickets]
      operationId: closeTicket
      summary: Close the current cycle (S-23)
      description: Stamps `actualCloseDate` and seals the open stage transition.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseRequest' }
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableTransition' }

  /tickets/{ticketId}/reopen:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [tickets]
      operationId: reopenTicket
      summary: Reopen — seal cycle N, open cycle N+1 (S-22)
      description: |
        One transaction: seal cycle N, insert cycle N+1 with a fresh start date,
        planned close date and assignee, increment `reopenCount`, clear
        `actualCloseDate`, write history.

        **Cycle N's effort is never touched.** Each cycle keeps its own ribbon and
        its own effort; the journey roll-up joins on `cycleNo` as well as stage
        and iteration precisely so cycle 1's hours cannot leak into cycle 2's
        totals.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReopenRequest' }
      responses:
        '200':
          description: Reopened into a new cycle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Ticket is not closed, so there is nothing to reopen.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /tickets/{ticketId}/emails:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    get:
      tags: [tickets]
      operationId: listTicketEmails
      summary: Mail delivery log for this ticket
      description: |
        Proves what was sent and what bounced. **Nobody should assume a mail
        arrived that never did**, which is why delivery status is visible in the
        product rather than buried in a provider dashboard.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailLogListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/ask-status:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [tickets, chat]
      operationId: askTicketStatus
      summary: Request a status update from the assignee (S-25)
      description: |
        Posts a structured message into the ticket thread with
        `[Reply with update]` and `[Open Quick Update]` actions. **The manager's
        response time is recorded as a reportable metric** — the round trip is the
        thing worth measuring, not just the ask.

        The card is an ordinary `ChatMessage` with `kind: STATUS_REQUEST`, posted
        by the manager. Draw the card from that: the author is who asked, the body
        is what they asked, and the two buttons belong to the kind. No action list
        is sent — both buttons navigate, and neither calls anything here.

        **Reporting Manager, PM or Admin only**, and a caller who is none of those
        gets `404` rather than `403`: whether you are this assignee's reporting
        manager depends entirely on the row, and CONVENTIONS.md §7 reserves 403
        for failures that do not.

        Repeat clicks are idempotent. While your own request is unanswered, asking
        again returns that one and posts nothing new — a second card, a second
        bell entry and a second row in your awaiting-response list would all be
        noise, and would make the metric count one wait as two. Two *different*
        managers may each have one open; a single reply closes both.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 1000
                  description: >
                    Defaults to "Please share the current status and expected
                    closure."
      responses:
        '202':
          description: >
            Requested — or already outstanding, in which case this is the
            existing request and nothing was posted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusRequestResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >
            The ticket has no assignee, so there is nobody to ask — or you are
            the assignee.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /tickets/{ticketId}/status-requests:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    get:
      tags: [tickets, chat]
      operationId: listTicketStatusRequests
      summary: Open status requests on this ticket (S-25)
      description: |
        The distinct badge §7.6 asks for. Every request still unanswered on this
        ticket, whoever asked, oldest first.

        Scoped by chat membership, like the rest of chat: somebody who is not in
        the ticket's thread sees an empty list rather than a 404, because the
        question is "is anything outstanding here" and the truthful answer to
        someone who cannot see the conversation is "nothing you can see".
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusRequestListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────────────────────────────────────── ribbon ────────
  /tickets/{ticketId}/ribbon:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    get:
      tags: [ribbon]
      operationId: getRibbon
      summary: Ribbon segments for a cycle
      description: |
        One ribbon per cycle. `?cycle=1` renders that completed journey read-only.
      parameters:
        - name: cycle
          in: query
          schema: { type: integer, minimum: 1 }
          description: Defaults to the current cycle.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RibbonResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/handoff:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [ribbon]
      operationId: handoffTicket
      summary: Advance to the next stage (S-29)
      description: |
        **Only the current stage owner — plus PM and Admin — may advance a
        ticket.** A developer cannot push a ticket into Deployment while it sits
        with QA. Enforced server-side; a client that offers the button anyway gets
        `422`.

        One transaction seals the current transition (`exitedAt`, `durationMins`
        **in working minutes**, not wall-clock), inserts the next, notifies the
        receiving owner, and pushes `stage.changed` to `/topic/ticket.{id}` so
        anyone viewing sees it land.

        `effortHours` is mandatory when the project requires effort confirmation
        at handoff (governance decision G-1, default blocking). Without it the
        per-resource roll-up is fiction within a month.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffRequest' }
      responses:
        '200':
          description: Advanced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RibbonResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableTransition' }

  /tickets/{ticketId}/rework:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [ribbon]
      operationId: reworkTicket
      summary: Send the ticket backwards
      description: |
        `reason` is mandatory; a defect list is expected on a QA failure.

        **`iterationNo` increments for every subsequent transition in this
        cycle** — that is what makes rework measurable and what the ping-pong flag
        counts at `iterationNo >= 3`. It does **not** touch `cycleNo`, and by
        default it does not move the planned close date (decision G-2): the
        original commitment stands, and rework is what `iterationNo` measures.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReworkRequest' }
      responses:
        '200':
          description: Moved back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RibbonResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableTransition' }

  /tickets/{ticketId}/skip-stage:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    post:
      tags: [ribbon]
      operationId: skipStage
      summary: Skip an optional stage — PM and Admin only
      description: |
        `reason` mandatory. The segment renders struck-through with the reason on
        hover, rather than disappearing — a stage that silently vanishes from the
        ribbon makes the history unreadable later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                toStageCode: { type: string, description: Defaults to the next stage in the template. }
      responses:
        '200':
          description: Skipped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RibbonResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableTransition' }

  /tickets/{ticketId}/journey:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    get:
      tags: [journey]
      operationId: getJourney
      summary: Per-stage, per-resource effort roll-up (§4A.4)
      description: |
        **The active/idle split is the point of this endpoint.**
        `idleMins = durationMins − Σ effort in that stage and iteration`. A stage
        showing two days of duration against two hours of effort is a queue
        problem, not a capacity problem — and no other view in the product can
        tell you that.

        The underlying query joins effort logs on `cycleNo` as well as stage and
        iteration. Without that, cycle 1's effort double-counts into cycle 2 after
        a reopen — a defect in the blueprint's own query, corrected in PLAN.md §3.4.
      parameters:
        - { name: cycle, in: query, schema: { type: integer, minimum: 1 } }
        - name: groupBy
          in: query
          schema: { type: string, enum: [hop, resource, stage], default: hop }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stages/queue:
    get:
      tags: [ribbon]
      operationId: getStageQueue
      summary: Team inbox for a stage (S-31)
      description: |
        "Waiting in QA", "Waiting in Deployment" — the landing page for QA and
        Deployment roles. Sorted by time-in-stage descending, so the ticket
        rotting longest is first.
      parameters:
        - { name: stage, in: query, required: true, schema: { type: string, examples: [QA] } }
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: unassignedOnly, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageQueueResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────────────────────────────────── comments ────────
  /tickets/{ticketId}/comments:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    get:
      tags: [comments]
      operationId: listComments
      summary: List comments
      parameters:
        - { name: cycle, in: query, schema: { type: integer, minimum: 1 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [comments]
      operationId: createComment
      summary: Post a comment
      description: |
        **`isClientVisible` defaults to false, always.** An accidental leak to a
        client costs far more than an extra click (decision recorded in §16).

        Stamped server-side with the author's role and the stage and iteration at
        time of writing, so the comment stays meaningful when read months later.
        `@mentions` fire a notification and an email.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentWriteRequest' }
      responses:
        '201':
          description: Posted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketId}/comments/{commentId}:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
      - { name: commentId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [comments]
      operationId: editComment
      summary: Edit your own comment
      description: |
        **Author only, for as long as the comment exists.** §4B.5 says "editable
        for 5 minutes; after that the comment is locked" and that limit was lifted
        — deviation **D-14** in `docs/PLAN.md` §4. The five minutes lost to one
        ordinary case: a developer posts a root-cause note, remembers the missing
        half thirty minutes later, and can only add a second card reading
        "correction to the above", leaving the thread with two fragments to
        reconcile instead of one accurate note.

        The limit is still implemented and still enforced — setting
        `edutrack.comments.edit-window: PT5M` restores §4B.5 with no code change.
        While a window is configured, an expired edit returns `422`; with none,
        `422` is reachable only for a comment that is not yours or has been
        removed.

        An edited comment keeps `originalBody` and renders an "edited" marker.
        **No role, including Admin, can silently rewrite a comment** — that is what
        keeps the thread admissible as evidence, and it is why PM and Admin are
        refused here while `deleteComment` allows them: however an Admin's edit were
        labelled, the thread would still attribute the new wording to the original
        author. `originalBody` is written on the **first** edit only, so what is
        preserved is what the author actually posted rather than their last attempt.

        The body is re-sanitised against PLAN.md §3.9 and re-parsed for `@mentions`.
        Only somebody the previous wording did **not** already name is notified —
        otherwise post, edit, edit is a way to ring the same bell repeatedly.

        Visibility is deliberately not editable. Flipping `isClientVisible` in the
        window would be a way to publish an internal note, or to un-publish one the
        client has already had by email while the thread reports otherwise. A
        comment sent to the wrong audience is deleted and rewritten, in the open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        '200':
          description: Edited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Not the author, already removed, or an edit window is configured and has closed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [comments]
      operationId: deleteComment
      summary: Delete a comment, leaving a tombstone
      description: |
        The row survives with `isDeleted`; the body is cleared, and `originalBody`
        with it. Nothing vanishes — the thread keeps "removed by X on date" in place.

        **The author, a PM or an Admin.** §4B.5 names no actor, so C-033 follows
        C-028's widening on attachments and for its reason: a comment posted
        client-visible by mistake is a disclosure, and waiting for its author to
        come back is not a remedy. Their act is never silent, because **every**
        removal here leaves a tombstone — including the author's own, and including
        one made seconds after posting. Unlike `deleteAttachment` there is no
        window and no silent branch: §4B.5 attaches its five minutes to editing and
        says of deletion only that it leaves a mark.

        Idempotent — deleting a tombstone answers `204`, not `404`.
      responses:
        '204': { description: Tombstoned. }
        # C-033. A caller who may read the comment and may not remove it, which is
        # a different refusal from the edit's 422: an edit can be refused by the
        # *row* (the window closed, and the caller was entitled four minutes ago),
        # a deletion only ever by *who is asking*.
        #
        # 403 rather than A-035's 404, on C-028's precedent and its argument: row
        # scope was settled by ScopeResolver before this route was reached, and
        # the caller is looking at the comment in a thread they just fetched, so
        # there is no existence left to conceal. 404 conceals whether a row exists;
        # 403 concedes that it does and refuses the verb.
        '403':
          description: Not the author, and not a PM or Admin.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────── attachments ────────
  /tickets/{ticketId}/attachments:
    parameters: [{ $ref: '#/components/parameters/TicketId' }]
    get:
      tags: [attachments]
      operationId: listAttachments
      summary: List attachments
      parameters:
        - { name: cycle, in: query, schema: { type: integer, minimum: 1 } }
        - { name: clientVisibleOnly, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: Upload an attachment
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      description: |
        Multipart. Accepts drag-drop, file picker **and clipboard paste** — paste
        is what decides whether support agents actually attach screenshots.

        Validated by extension allow-list **and** MIME sniffing — the extension
        alone is trivially wrong. EXIF is stripped, the file is virus-scanned, and
        it becomes visible only after the scan passes. Stored at
        `tickets/{ticketId}/{uuid}`; downloads use short-lived signed URLs and the
        bucket is never public.

        Limits, all configurable: 10 MB per file, 50 MB and 20 files per ticket.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                isClientVisible: { type: boolean, default: false }
                commentId: { type: integer, format: int64 }
      responses:
        '201':
          description: Accepted; `scanStatus` is `PENDING` until the scan completes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File or ticket limit exceeded.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Extension or sniffed MIME type not allowed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /tickets/{ticketId}/attachments/{attachmentId}:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
      - { name: attachmentId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: Delete an attachment
      description: |
        §4B.4's deletion rule. **The stored object and its thumbnail are removed
        in every case; the row always survives.**

        The row surviving is not a hedge — `deletedBy` and `deletedAt` exist to
        be read afterwards, and C-034's History timeline cannot place an
        attachment whose row is gone. The baseline migration that created
        `ticket_attachments` says the same in its own comment. *(This paragraph
        corrects an earlier description here that called the in-window case a
        "hard delete"; no implementation ever did that.)*

        What differs is whether the removal leaves a **visible tombstone**:

        - **The uploader, within 15 minutes** — no tombstone. The row disappears
          from `listAttachments` entirely. A support agent who pastes the wrong
          screenshot and removes it has not done something the ticket needs to
          remember.
        - **Anyone else, or after 15 minutes** — the row is returned by
          `listAttachments` with `isDeleted: true` and both tombstone fields set,
          rendering as "file removed by X on date".

        A PM or an administrator removing a file is therefore *never* silent,
        even inside the window — that is the supervisory act the tombstone exists
        to record, and the case the `isClientVisible` flag beside it anticipates
        (an internal debug log attached as client-visible is a disclosure that
        cannot wait out a timer).

        **Idempotent.** Deleting an already-deleted attachment answers 204, not
        404 — the caller asked for the file to be gone and it is gone, and
        refusing would distinguish "already removed" from "never existed".
      responses:
        '204': { description: Deleted or tombstoned. }
        '403':
          description: |
            Visible to this caller, but not theirs to remove — they are neither
            the uploader nor a PM or administrator. Deliberately **not** 404: the
            caller is looking at the row in a listing they just fetched, so there
            is no existence to conceal. Row scope is a separate question and is
            answered as 404 before this one is asked.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/limits:
    get:
      tags: [attachments]
      operationId: getAttachmentLimits
      summary: Attachment limits in force
      description: |
        §4B.4's three caps, **as configured** rather than as originally
        specified — they are editable at runtime (C-027), so a client that
        hard-codes 10 MB will refuse files this server would accept the moment
        an administrator raises it.

        Every upload surface validates against this. Open to all six roles, and
        deliberately: each of them has an upload surface, and the numbers are
        the ones the picker has always printed on screen. Nothing about the
        org, its projects or its tickets is reachable through it.

        Org-wide and identical for every ticket, which is why it is not under
        `/tickets/{ticketId}/attachments` — that shape would raise the question
        of per-ticket limits, whose answer is no.
      responses:
        '200':
          description: OK.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentLimitsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [attachments]
      operationId: replaceAttachmentLimits
      summary: Set the attachment limits
      description: |
        All three at once. They are only meaningful together — a per-ticket
        total below the per-file cap makes the per-file cap unreachable, since
        every file large enough to test it is refused by the ticket total first
        — so there is no per-field write that could pass through that state.

        `master.write`, which is Admin's alone. The org-wide shape is why it is
        not `project.manage`: nothing here is scoped to a project.

        **`If-Match` is required, not optional.** There is exactly one row and
        it is org-wide, which makes a lost update *more* plausible here than on
        a per-project resource, not less — two administrators editing the
        attachment limits are editing the same row by definition, and a `PUT`
        is a wholesale replace, so the loser of the race is erased having seen
        a success. A missing header is `428`.
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentLimitsWrite' }
      responses:
        '200':
          description: Saved. The body is the new state, including `ceilingBytes`.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentLimitsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428':
          description: '`If-Match` was not sent. Read the limits first and send back their `ETag`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The combination cannot be honoured, or `maxFileBytes` is above
            `ceilingBytes` — the servlet container refuses an oversized body
            during parsing, so a cap above it would save successfully and
            change nothing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  # ──────────────────────────────────────────────────────────  clients ───────
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: List clients
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string }, description: 'Name, code or domain.' }
        - name: isActive
          in: query
          schema: { type: boolean }
          description: |
            B-028 · matched against the same derivation the row reports:
            `true` is `status <> 'INACTIVE'` and therefore **includes
            Prospects**, `false` is `status = 'INACTIVE'`. The two are not
            symmetric because "active" is two of the three statuses and "not
            active" is exactly one.

            Stated because it was wrong. B-026 widened the projection when it
            added `PROSPECT` and left the filter comparing `status = 'ACTIVE'`,
            so a prospect came back from `GET /clients` saying `isActive: true`
            and did not come back from `GET /clients?isActive=true` at all —
            the call §4B.2's ticket-form dropdown makes.

            **B-029 · this is a picker's filter, never a historical view's.**
            Blueprint line 523 says deactivating a client blocks *new* tickets
            but "never hides the historical tickets", so `isActive=true` belongs
            on a list of clients a ticket may be *raised against* and nowhere
            else. Sending it to populate a filter, a report grouping or a name
            lookup over tickets that already exist removes a client from that
            view the moment somebody deactivates them — which is the sentence's
            second half breaking the third. S-15's ticket-list client filter did
            exactly this and no longer does; S-19's create form still sends it
            and must. Same parameter, opposite answers, and the question that
            separates them is "new or historical" — not "active or not".
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - name: supportPlan
          in: query
          schema: { type: string }
          description: 'S-32 filter. Matched case-insensitively against the stored plan.'
        - name: accountManagerId
          in: query
          schema: { type: integer, format: int64 }
          description: 'S-32 filter.'
      description: |
        Ordered by name, then id — a keyset over `name` alone skips rows wherever
        two clients share one, and after a bulk import they do.

        **Reads are open to all six roles, writes are Admin.** The client
        dropdown on the ticket create form (§4B.2) is this operation, and every
        role may raise a ticket; a role that could not list clients could not
        raise one against a client at all.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [clients]
      operationId: createClient
      summary: Create a client (S-33)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      description: |
        B-026 · S-33's four-tab form, creating.

        **A created client has no contacts, and is therefore not yet selectable
        on a ticket** — B-028's rule is "at least one primary contact before the
        client can be chosen". That is not enforced here (there is nothing to
        enforce it against on a create) and the form says so on its Contacts
        tab; the contacts themselves are `POST /clients/{clientId}/contacts`.

        `clientCode` is unique, case-insensitively — `clients.client_code`
        collates `utf8mb4_0900_ai_ci`, so `acme` and `ACME` are one code as far
        as `uq_clients_code` is concerned, and the service refuses the second
        with a field-keyed `409` rather than letting the index refuse it with a
        message naming a MySQL constraint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientWriteRequest' }
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              schema: { type: string }
              description: Send back as `If-Match` on the `PATCH`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # Declared ahead of `/clients/{clientId}` for readability. The literal segment
  # outranks the variable in Spring's PathPatternParser and in React Router
  # regardless of order — the same ranking `/tickets/new` and
  # `/masters/resources/new` already depend on. And `clientId` is an `int64`, so
  # if a router ever did prefer the variable the request fails as a loud 400
  # rather than dispatching somewhere unintended.
  /clients/bulk-status:
    patch:
      tags: [clients]
      operationId: setClientStatusBulk
      summary: Activate or deactivate several clients at once (S-32)
      description: |
        S-32's bulk action. One request rather than one per selected row: fifty
        sequential `PATCH /clients/{clientId}/status` calls have fifty ways to
        half-succeed, and no way to report that they did.

        Applied in one transaction. An id that does not exist fails the whole
        request with 404 rather than being skipped silently — a caller who
        selected fifty rows and changed forty-nine has not been told which one
        got away.

        Deactivating here carries the same rule as the single-client route: new
        tickets are blocked, **historical ones are never hidden**.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientBulkStatusRequest' }
      responses:
        '200':
          description: Changed; every affected client is returned with its refreshed counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientListResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /clients/{clientId}:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    get:
      tags: [clients]
      operationId: getClient
      summary: One client (S-33)
      description: |
        B-026 · the read half of the S-33 form, and **the only place the `ETag`
        that `PATCH` requires can be obtained**. Without it the write below
        declared a precondition with nowhere to satisfy it — the same gap B-011
        closed for `GET /users/{userId}` and B-016 for `GET /projects/{id}`.

        Carries the whole §4B.2 field set, which the list row deliberately does
        not: the grid renders nine columns and inlining twenty-five fields per
        row would be weight on every page of it.

        **All six roles**, like `listClients` beside it — §4B.2's ticket-form
        dropdown is that operation, and a role that can list clients learns
        nothing new from reading one.
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              schema: { type: string }
              description: Send back as `If-Match` on the `PATCH`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [clients]
      operationId: updateClient
      summary: Update a client (S-33)
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      description: |
        B-026 · S-33's four-tab form, saving.

        **The body is the whole representation, not a sparse patch**, and the
        verb stays `PATCH` because that is what the contract has declared since
        D-001 and what the generated client already emits. S-33 submits every
        field on every save, so `ClientWriteRequest` is the shape both verbs
        take — unlike the project master next door, which needed a separate
        `ProjectPatchRequest` because `projectCode` is immutable and requiring
        it on a patch would have made every edit to a live project a `409`.
        **No client field is immutable**, so no such split is needed here.

        `client_code` is editable, with one consequence worth knowing: it is
        B-035's upsert key, so a code changed here means the next Excel import
        carrying the *old* code creates a second client rather than updating
        this one. The form says so at the field.

        `If-Match` is **required**. A write without one is `428`, not a silent
        overwrite — treating a missing precondition as "no conflict" protects
        only the callers that already opted in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientWriteRequest' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag:
              schema: { type: string }
              description: The refreshed tag. Send it back on the next save.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428':
          description: '`If-Match` absent. GET the client and send back its `ETag`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /clients/{clientId}/status:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    patch:
      tags: [clients]
      operationId: setClientStatus
      summary: Activate or deactivate a client
      description: |
        Deactivating a client with open tickets warns and blocks *new* tickets.
        **It never hides historical ones** — the record of work done for a client
        does not disappear because the relationship ended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200':
          description: Changed; `openTicketCount` reported for the warning.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /clients/{clientId}/contacts:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    get:
      tags: [clients]
      operationId: listClientContacts
      summary: List contacts
      description: |
        The S-32 row-expand, S-33's Contacts tab and §4B.2's reporter dropdown —
        pick a client, then pick the individual who reported the issue (C-021).

        **Active contacts only by default.** B-027 removes a contact by
        deactivating it, never by deleting it, so this list would otherwise start
        offering people who have left the client. `includeInactive=true` is the
        B-027 grid's own read: a removed contact still has to be *shown* as
        removed, and a ticket raised by one still has to render their name.
        Same split B-021 made on `listPriorities` and for the same reason — the
        default serves the picker, the flag serves the master screen.

        **All six roles.** `listClients` beside it is §4B.2's client dropdown and
        this is the dependent second dropdown; a role that could not read it
        could not raise a ticket against a client at all.
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Include removed contacts, each carrying `isActive: false`. The B-027
            grid sends it; every picker leaves it off.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [clients]
      operationId: createClientContact
      summary: Add a contact
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      description: |
        B-027 · S-33's Contacts tab, adding.

        Callable inline from the ticket form. Without that, the desk picks the
        wrong existing contact rather than taking the detour to the client master.

        **A client is not selectable on a ticket until it has one primary
        contact.** Setting a new primary demotes the previous one in the same
        transaction — "at most one primary" is a service-layer rule the schema
        cannot assert, because MySQL has no partial unique index.

        **A duplicate email within the same client is refused** (`409`,
        case-insensitively, agreeing with `utf8mb4_0900_ai_ci`). The same address
        under two *different* clients is legitimate and stays allowed — D-039
        disambiguates inbound mail by `website_domain`, and
        `ix_client_contacts_email` is deliberately not unique.

        Writes are **Admin only** (`master.write`), where the read beside them is
        every role — the split B-025 and B-026 already make on this resource.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactWriteRequest' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /clients/{clientId}/contacts/{contactId}:
    parameters:
      - { $ref: '#/components/parameters/ClientId' }
      - { $ref: '#/components/parameters/ContactId' }
    patch:
      tags: [clients]
      operationId: updateClientContact
      summary: Edit a contact (S-33)
      description: |
        B-027 · S-33's Contacts tab, editing.

        **The body is the whole representation, not a sparse patch.** The row
        editor sends every field on every save, so an absent one is a cleared one
        — B-026's call on `ClientWriteRequest`, one screen over, and the reason
        this is a record rather than the POJO B-017's and B-020's patches needed.

        **Without this operation an edit is remove-and-re-add**, which
        deactivates the row a historical ticket points at and issues a new id: a
        corrected phone number rendered as a departure and an arrival.

        **`isPrimary: true` promotes and demotes the previous primary**, exactly
        as the create does. `isPrimary: false` on the *only* primary is
        **allowed** and leaves the client with none — that is a state the client
        is already in the moment it is created, B-028's gate reports it, and
        refusing it here while the `DELETE` below can produce it anyway would be
        one rule with two answers.

        **No `If-Match`**, and it is an exemption with a reason rather than an
        oversight: the tag would have to come from `listClientContacts`, a
        collection carrying no `ETag` of its own. Same call as
        `PATCH /projects/{projectId}/members/{userId}`. The client the contact
        hangs off *does* have a tag, and a contact write moves it — `contactCount`
        and `hasPrimaryContact` are inside it — so the S-33 form must re-read the
        client after any write here or its next Save is a `412`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactWriteRequest' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [clients]
      operationId: removeClientContact
      summary: Remove a contact (S-33)
      description: |
        B-027 · S-33's Contacts tab, removing.

        **This deactivates; it does not delete.** `tickets.client_contact_id` is
        a foreign key with no cascade, so a real `DELETE` either fails as a
        constraint violation naming a MySQL index or — "fixed" with a cascade —
        destroys the record of who reported a historical ticket. The row stays,
        `isActive` goes false, and `listClientContacts?includeInactive=true` is
        where it can still be seen. The same call B-017 made on
        `project_members`, B-018 on cleared SLA overrides and B-020 on a retired
        task type.

        **Removing an already-removed contact is `204`, not `404`.** It is a
        setter, and the second half of a double-click must not be an error about
        something that did happen — B-014's `UNCHANGED` argument. A contact id
        belonging to a *different* client is `404`.

        **Removing the primary is allowed and leaves the client with none.** The
        person left; the alternative is a contact who cannot be removed until
        somebody else is promoted, which is a rule that reads as a broken button.
        B-028's gate reports the consequence on the ticket create path.
      responses:
        '204':
          description: |
            Removed, or already removed — the second is not an error, per B-014's
            `UNCHANGED` argument.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /clients/{clientId}/tickets:
    parameters: [{ $ref: '#/components/parameters/ClientId' }]
    get:
      tags: [clients]
      operationId: getClient360
      summary: Client 360 view (S-32)
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusCode' } }
      responses:
        '200':
          description: Tickets plus rolled-up client metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client360Response' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────────────────────────────────── imports ─────────
  /imports/{schema}/template:
    parameters: [{ $ref: '#/components/parameters/ImportSchema' }]
    get:
      tags: [imports]
      operationId: downloadImportTemplate
      summary: Download the .xlsx template for a schema
      description: |
        Generated with Apache POI SXSSF, carrying data-validation dropdowns on
        Status and Support Plan plus one filled example row. A template with a
        worked example produces far fewer rejected rows than one with only headers.

        The header row is **exactly** the column names the import matches on —
        no asterisk on the required ones, no type hints. Decorating them would
        make the file this API just produced fail to auto-match on `POST
        /imports/{schema}/upload`. Which columns are required, what the natural
        key is and what each dropdown accepts are on a second **Instructions**
        sheet; the data sheet is first, so a caller taking the default sheet
        gets the one that is filled in.

        `master.write`, like the three operations beside it — B-031.
      responses:
        '200':
          description: The workbook.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No schema is registered under that key. `schema` is a path segment,
            so an unregistered value makes the resource absent rather than the
            request malformed. `users` was that case until B-038 registered it;
            both values the enum declares now resolve, so this answers a key the
            enum does not carry at all.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /imports/{schema}/upload:
    parameters: [{ $ref: '#/components/parameters/ImportSchema' }]
    post:
      tags: [imports]
      operationId: uploadImportFile
      summary: Step 2 — upload and parse headers
      description: |
        Max 5 MB and 5,000 rows. Parsed with the **event-driven SAX reader**, not
        the DOM reader — the DOM reader loads the entire workbook into memory per
        concurrent import and will not survive two users at once. The row cap
        aborts the parse rather than trimming afterwards, so a million-row sheet
        is refused after 5,001 rows instead of after all of them.

        Accepts `.xlsx` and `.csv`. **`.xls` is refused with a 415** naming the
        fix: the Excel 97–2003 format is a binary OLE container with no XML to
        stream, so the only reader for it is the whole-workbook one this
        operation exists to avoid.

        Returns detected sheets and headers for the mapping step, plus the
        auto-match B-033 presents as its starting point. `master.write`, like the
        three operations beside it. **Nothing is written** — the upload is staged,
        and no row of the target table is touched before `/commit`.
      parameters:
        - name: sheet
          in: query
          schema: { type: string }
          description: |
            Which sheet to read. Omitted means the first one, which is what the
            initial upload sends.

            This is how the multi-sheet selector works: the response lists every
            sheet in the workbook, and choosing a different one re-posts the same
            file naming it. Re-posting rather than re-reading a staged copy is
            deliberate — the alternative is holding the raw bytes of every open
            upload for the staging TTL, and the browser already has the file in
            hand.
        - name: replaces
          in: query
          schema: { type: string, format: uuid }
          description: |
            The `uploadId` this upload supersedes, released as this one is staged.

            Sent by the sheet selector so that flipping between sheets does not
            consume a staging slot per attempt. Unknown or already-expired ids
            are ignored; this is a courtesy, not a precondition.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Parsed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportUploadResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No schema is registered under that key — the same case as the
            template route.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Over the size or row limit.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: |
            Not a file type this endpoint reads — `.xls`, or anything that is
            neither `.xlsx` nor `.csv`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The right extension over the wrong bytes, an empty sheet, a sheet
            with no header row, or a `sheet` the workbook does not contain.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            Every staging slot is taken — too many imports in progress at once.
            Temporary and nothing the caller did wrong, so it carries
            `Retry-After`. Reachable only because staging is currently
            in-process and capped; it goes away when import artefacts move to
            object storage (PLAN.md §2.2).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /imports/{schema}/fields:
    parameters: [{ $ref: '#/components/parameters/ImportSchema' }]
    get:
      tags: [imports]
      operationId: describeImportSchema
      summary: The columns a schema accepts (S-34 step 3)
      description: |
        The registration's own field declarations, so step 3 can render one row
        per target field and decide which of them block Next.

        **This exists so the field list is declared once.** Every other step
        reads `ImportSchemaDefinition.fields()` server-side; without this
        operation the mapping screen would have to carry its own copy of the
        same list in TypeScript, and B-038's second registration would have to
        add a second copy. `required` in particular is not derivable from
        anything the upload response returns.

        Constant for the life of a deployment — a schema is a class, not data —
        so a client may cache it for the session. It is not folded into
        `/upload`'s response because it is a property of the schema rather than
        of the file, and the sheet selector re-posts that request.

        `master.write`, like every operation on this path.
      responses:
        '200':
          description: The schema's columns, in template order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportSchemaFieldsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No schema is registered under that key — the same case as the
            template and upload routes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /imports/{schema}/mapping-presets:
    parameters: [{ $ref: '#/components/parameters/ImportSchema' }]
    get:
      tags: [imports]
      operationId: listImportMappingPresets
      summary: Saved column mappings for a schema (S-34 step 3)
      description: |
        §4B.3: "Mapping presets can be saved and reused for the next import."

        Presets are **organisation-wide, not per user.** A preset records how a
        particular export — a CRM's, a finance system's — lines up with our
        columns, and that is knowledge the next person to run the import needs
        whether or not they are the person who saved it. Held per user it would
        be lost to a change of laptop or of staff, which is the case the feature
        exists for.

        Ordered by name, so the list reads the same on every visit.
      responses:
        '200':
          description: Every preset saved for this schema.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportMappingPresetsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No schema is registered under that key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [imports]
      operationId: saveImportMappingPreset
      summary: Save a column mapping under a name
      description: |
        **An upsert on `(schema, name)`, so this answers 200 and not 201** — and
        therefore takes no `Idempotency-Key`. Saving again under a name that
        exists replaces that preset, because that is what "Save" means to
        somebody who has just corrected one column: the alternative is five
        presets called *CRM export* and no way to tell which is current.

        The mapping's keys must be fields this schema declares. A preset is
        applied weeks after it is saved, against a file nobody is looking at
        today, so a key that matches nothing is refused here rather than
        silently dropped when it is next used.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportMappingPresetRequest' }
      responses:
        '200':
          description: Saved — created, or the existing preset of that name replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportMappingPresetResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No schema is registered under that key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The mapping names a target field this schema does not declare —
            usually a preset built against an older version of the registration.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /imports/{schema}/mapping-presets/{presetId}:
    parameters:
      - { $ref: '#/components/parameters/ImportSchema' }
      - name: presetId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [imports]
      operationId: deleteImportMappingPreset
      summary: Delete a saved column mapping
      description: |
        A hard delete. A preset is a convenience with no history attached to it
        and nothing referencing it — an import records the mapping it actually
        used, never the preset it came from — so a tombstone would preserve
        nothing anybody could use.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No such preset under this schema. A preset id belonging to a
            *different* schema is also absent — the nesting is real, not
            decorative.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /imports/{schema}/validate:
    parameters: [{ $ref: '#/components/parameters/ImportSchema' }]
    post:
      tags: [imports]
      operationId: validateImport
      summary: Step 4 — dry run
      description: |
        **Nothing is written.** Returns a per-row verdict — will create, will
        update, duplicate within the file, or rejected with a reason — plus
        summary counts. This is the step that makes a bulk import safe to run.

        Idempotent and repeatable: the user may go back to step 3, change one
        column and run it again, so this takes the mapping in its own body
        rather than reading a parked server-side copy. It is a `POST` because
        the body is the mapping, not because anything changes.

        `master.write`, like every operation on this path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportValidateRequest' }
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreviewResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No schema is registered under that key — the same case as the
            template, upload and fields routes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The request is well-formed but refers to something absent, and each
            `type` carries a different remedy the screen states in its own
            words:

            - `import-upload-unavailable` — the `uploadId` has expired or is
              unknown, or `sheet` names a sheet other than the one staged under
              it. Both mean the wizard's state and the server's disagree, and
              both are fixed by re-uploading. The staged sheet is on the body as
              `sheet`.
            - `import-incomplete-mapping` — a required column is unmapped. Step
              3 blocks Next on exactly this, and it is enforced here too:
              unmapped, every row would be rejected for "Name required" and the
              preview would point at the rows rather than at the mapping. The
              missing fields are on the body as `missingFields`, with their
              headers as `missingHeaders`.
            - `import-unknown-column` — the mapping names a heading this sheet
              does not have, which is the ordinary outcome of applying a preset
              saved from a different export. Silently dropping it would import
              the file with that column unread and nothing said. The offending
              columns are on the body as `unknownColumns`, the sheet's own
              headings as `headers`.
            - `import-unknown-field` — the mapping names a target field the
              schema does not declare, the same refusal preset saving makes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /imports/{schema}/commit:
    parameters: [{ $ref: '#/components/parameters/ImportSchema' }]
    post:
      tags: [imports]
      operationId: commitImport
      summary: Step 5 — commit as a background job
      description: |
        **Upsert on the schema's natural key — update, never duplicate.** For
        clients that is the client code. Re-uploading a corrected file must not
        create a second copy of every row.

        **The dry run is re-run server-side, and the client's preview is not
        sent.** This request carries an upload id and a mapping — the same two
        things `/validate` takes — never a list of verdicts. The same file and
        the same mapping reach the same judgements, so re-deriving them costs one
        pass over rows already in memory and is what makes "only the rows step 4
        showed you" true rather than asserted by the caller.

        **The staged upload is consumed.** The rows are read and mapped before
        the response is sent and the staging entry is released, because the job
        outlives the staging TTL and must not hold an id that can expire beneath
        it. Committing the same `uploadId` twice therefore answers
        `import-upload-unavailable`, which is the honest refusal: the second
        request cannot be served, and it is also the request that would have
        written the file twice.

        Answers **202 with the batch**, not the finished counts — a 5,000-row
        commit is not a request-scoped operation. Poll
        `GET /import-batches/{batchId}` for progress.

        `master.write`, like every operation on this path.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCommitRequest' }
      responses:
        '202':
          description: |
            Job accepted. `status` is `QUEUED` or `RUNNING` and every counter is
            at its starting value — `total` is every row of the file and
            `rejected` is what the dry run already refused, so a progress bar
            starts partly filled on a file with bad rows rather than jumping.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No schema is registered under that key — the same case as the
            template, upload, fields and validate routes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            **The four refusals `/validate` declares, in the same order and with
            the same `type`s** — an incomplete mapping is not a different
            condition because it arrived one step later, and a screen that
            handled it at step 4 should not need a second branch for step 5.
            `import-upload-unavailable`, `import-incomplete-mapping`,
            `import-unknown-column` and `import-unknown-field`; see
            `validateImport` for what each carries on its body.

            One is reachable only here: `import-nothing-to-commit`, when no row
            of the file is writable. A batch that would write nothing is refused
            rather than accepted and completed instantly, because a run in the
            history claiming to have imported a file it did not touch is worse
            than a refusal naming the reason.

            And one is `skipRejected`'s: `import-rejected-rows-present`, when it
            was sent `false` and the dry run rejected something. Carries
            `rejected` and `duplicates` counts.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            Every commit slot is taken — the same temporary, caller-blameless
            condition `import-staging-full` answers on upload, with the same
            `Retry-After`. `type` is `import-commit-queue-full`.

            Deliberately **not** run on the request thread instead. A caller-runs
            fallback would hold an HTTP connection open for five thousand
            upserts, and the client polling for progress is the one that would
            time out.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /import-batches:
    get:
      tags: [imports]
      operationId: listImportBatches
      summary: Recent import runs, newest first (S-34)
      description: |
        B-037 — the import history. Blueprint §4B.3's closing validation rule:
        *"every import writes an `import_batch` row so a bad import can be
        identified and reversed as a set."* This route is what makes
        **identified** true of something a person can reach.

        Until it existed a batch id was known only to the browser tab that
        started the run. `import_batches` recorded every import faithfully and
        nothing could list one, so an Admin who closed the wizard had no way back
        to the run that had just filled the client master from the wrong
        spreadsheet.

        **Filtered by `entity`, the stored discriminator — not by the URL segment
        a schema is mounted at.** `CLIENT`, not `clients`. The two names are kept
        apart deliberately (see `ImportSchema` and `ImportBatch.entity`), and
        translating one into the other on a read is the collapse that separation
        prevents.

        Capped, and the cap is on the response as `limit`. **No `ETag`**, unlike
        `getImportBatch` beside it: that one is polled every two seconds through a
        run, this one is opened by hand and changes when somebody runs an import.

        `master.write`, like everything else on this path. **403 rather than
        404**: a list is not a row, and the refusal is decided before any row is
        read.
      parameters:
        - name: entity
          in: query
          required: false
          schema: { type: string, default: CLIENT }
          description: |
            Which registration's runs. Defaults to `CLIENT` because S-34 was the
            only screen with this panel when the parameter was added. B-038's
            resource wizard passes `RESOURCE` and needed no change here, which
            is what the default being a default rather than the only value was
            for.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /import-batches/{batchId}:
    parameters: [{ $ref: '#/components/parameters/BatchId' }]
    get:
      tags: [imports]
      operationId: getImportBatch
      summary: Batch progress and error report
      description: |
        `errorReportUrl` points at `downloadImportErrorReport`, an `.xlsx` of only
        the rejected rows with an appended Reason column, so the user fixes and
        re-uploads those rows rather than the whole file. Every import is
        identified, which makes a bad one reversible as a set.

        Polled while a job runs, so it returns an `ETag` — a client checking every
        two seconds should transfer a body only when something actually changed.
        The tag is over the counters, the status **and `errorReportUrl`**, so it
        changes exactly when anything the screen renders would.

        `master.write`, like the wizard that starts the job. **403 rather than
        404** for a caller without it: the capability is decided before the id is
        looked up, so a Developer cannot tell a real batch id from an invented
        one either way, and there is no existence for a 404 to protect.
      parameters: [{ $ref: '#/components/parameters/IfNoneMatch' }]
      responses:
        '200':
          description: OK.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchResponse' }
        '304': { description: Not modified. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /import-batches/{batchId}/reverse:
    parameters: [{ $ref: '#/components/parameters/BatchId' }]
    post:
      tags: [imports]
      operationId: reverseImportBatch
      summary: Reverse one import as a set (S-34)
      description: |
        B-037 — blueprint §4B.3's closing validation rule and §17's named
        mitigation for *"Client Excel import silently corrupts the master"*:
        **a bad import can be identified and reversed as a set.**

        Deletes the rows the run **created**. Rows it *updated* are not touched
        and could not be restored — `clients.import_batch_id` is stamped on
        insert only, and there is no before image anywhere — so the response
        carries `updatedRowsNotReverted` rather than letting a count that does
        not add up imply otherwise. A client that has since been named on a
        ticket comes back in `retained` with a reason, because failing the whole
        reversal over one used client is unhelpful and deleting the ticket's
        client is worse.

        **`POST`, not `DELETE`.** The resource at this path is the batch, and the
        batch is emphatically *not* deleted: it is the audit trail, and it
        survives the reversal with four more columns filled in.

        **Not idempotent, and refused rather than made so.** A second call
        answers `import-batch-already-reversed`. Succeeding quietly would be
        tempting — the rows are already gone, so it would delete nothing — and
        would overwrite `reversedAt` and both counters with the second attempt's
        zeroes: a false entry in the one table that exists to make bad imports
        traceable.

        `master.write`. **This is the only route in the product that deletes rows
        from the client master** — `updateClientStatus` deactivates and everything
        else preserves — and it does not get a capability of its own: the
        capability that lets somebody write 412 clients in one action is the
        capability that lets them take those same 412 back, and splitting them
        would mean an Admin who can cause the damage cannot undo it. **403 rather
        than 404** for the reason the poll gives: decided before the id is looked
        up.
      responses:
        '200':
          description: |
            Reversed. `retained` may be non-empty — that is an outcome, not a
            failure, and the batch's own `retainedRows` records it permanently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReversalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Three types, and they are three because the remedies differ.

            `import-batch-not-finished` — the job is still walking the file, and
            reversing under it would have two threads deleting and inserting the
            same rows. Clears itself in a moment; the screen should wait. Carries
            `status`.

            `import-batch-already-reversed` — done once already. Never clears; the
            screen should stop offering the button. Carries `reversedAt`, because
            a caller who reaches this has almost always got a stale panel open in
            another tab.

            `import-schema-unavailable` — the registration that wrote this run is
            not installed in this build, so nothing here knows what to delete.
            Not the caller's mistake and not fixable by them. Reads still work:
            an error report already written is a file, and reading a file needs no
            registration.

            One shared "cannot reverse" type would put a Try again on two cases
            that will refuse forever.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /import-batches/{batchId}/error-report:
    parameters: [{ $ref: '#/components/parameters/BatchId' }]
    get:
      tags: [imports]
      operationId: downloadImportErrorReport
      summary: Step 5 — the rejected rows as .xlsx, with a Reason column
      description: |
        §4B.3's closing promise: "a downloadable error report (.xlsx with a Reason
        column appended) is produced for every rejected row so the user can fix
        and re-upload just those." B-036.

        **Written in the template's shape, not the upload's.** The columns are
        the schema's own headers in template order, plus a leading `Row` and a
        trailing `Reason`. That is what makes "fix and re-upload just those rows"
        literal rather than aspirational: `uploadImportFile` auto-matches every
        column of this file on the way back in, so the corrected rows need no
        remapping and cannot be remapped wrongly. `Row` and `Reason` match no
        declared field, so they are ignored on that re-upload.

        The cost, stated because it is real: **columns the caller did not map are
        not in the report**, because they were never read. `Row` is what bridges
        it — it names the row in the sheet they still have.

        **Every row the run did not write**, in file order: what the dry run
        rejected, what it found duplicated within the file, and anything that
        broke a database constraint at write time. All three are rows the file
        contained and the master did not receive, which is the only distinction
        that matters to somebody fixing a spreadsheet.

        Generated during the run and stored, never generated here — the rows it
        describes are released with the staging entry before the job starts, so
        there is no later moment they exist. Reach it through the batch's
        `errorReportUrl` rather than by composing the path.

        `master.write`, like the poll it hangs off. **Served through the API
        rather than as a presigned object-store URL**, unlike §4B.4's
        attachments: this is a verbatim extract of the client master, and a
        signed URL is a bearer credential that outlives the screen it was minted
        for.
      responses:
        '200':
          description: |
            The workbook. `Content-Disposition` names it
            `{schema}-import-errors-{batchId}.xlsx` — identified by run, unlike
            the template, because two error reports are genuinely two different
            files and a Downloads folder should say which import each came from.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No such batch, **or** a batch with no report — the run is still
            going, nothing was rejected, or the report could not be stored. One
            status and one `type` for both, because neither offers the caller
            anything to press; the batch's own `status` and counters, one route
            away, are what tell them apart, and `status` is on the problem body
            so they do not have to ask.

            A client reaching this with a null `errorReportUrl` has ignored the
            field that says whether there is one.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ───────────────────────────────────────────────────────── masters ─────────
  /masters/task-types:
    get:
      tags: [masters]
      operationId: listTaskTypes
      summary: Task types (S-11)
      description: |
        The Task Type Master grid, and the type picker on the create-ticket
        form. Eleven rows seeded by B-002; an Admin may add more.

        **Deactivated rows are returned too**, carrying `isActive: false`, the
        same way modules and roles are. A ticket raised last year against a type
        since retired still has to render its name; filtering them out here
        would leave that cell blank. Offer only the active ones in a picker.

        Returned in `seq` order — the order the master defines — so no client
        sorts it a twelfth way.

        `ticketCount` is how many tickets currently carry the type. It is on the
        row rather than only in a confirmation, because deactivating is the
        consequential act on this screen: a retired type drops out of every
        project's SLA matrix (which is built from the active types) and out of
        the create form, and an admin should see the size of that before
        clicking rather than after.
      responses:
        '200':
          description: OK. A bounded list — no `meta`, the set is complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTypeListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [masters]
      operationId: createTaskType
      summary: Create a task type (S-11)
      description: |
        Admin only — `master.write`, which blueprint §2 states as "Master data
        (task types, SLA, workflow, holidays)".

        `code` is upper-cased and must be unique. It is the stable identifier:
        `TaskTypeRepository.findByCode` is what the Excel import matches on, and
        it is what any client should key behaviour off rather than `name` —
        which this very screen makes editable. It **cannot be changed
        afterwards**; see `PATCH /masters/task-types/{taskTypeId}`.

        `name` must also be unique, case-insensitively, and that is a service
        rule rather than an index. Two types rendering the same label are
        indistinguishable in every picker in the product.

        `defaultLevel` is checked against the **priority master**, not against a
        hardcoded list — B-021 exists precisely so an Admin can add a level, and
        a hardcoded set is what B-015 removed from the resource grid. It must
        also be one of the four values `Level` can carry; a fifth priority needs
        that enum opened, which is B-021's call and touches three streams.

        `seq` is the display order in the picker. Omit it and the new type sorts
        to the end.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskTypeWriteRequest' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTypeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /masters/task-types/{taskTypeId}:
    parameters: [{ $ref: '#/components/parameters/TaskTypeId' }]
    get:
      tags: [masters]
      operationId: getTaskType
      summary: One task type (S-11)
      description: |
        **This exists to carry the `ETag` the `PATCH` requires as `If-Match`**,
        per CONVENTIONS.md §5 — the gap B-011 closed for `GET /users/{userId}`
        and B-016 for `GET /projects/{projectId}`. A write whose precondition
        has no read to come from is not a strict endpoint, it is a broken one.

        The tag is taken over the content, `ticketCount` included. A ticket
        raised against the type while the edit dialog is open therefore costs a
        reload — correct, since that count is what the deactivate decision was
        made against.
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              schema: { type: string }
              description: Send back as `If-Match` on the `PATCH`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTypeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [masters]
      operationId: updateTaskType
      summary: Edit a task type, or retire it (S-11)
      description: |
        Admin only. A partial update — an omitted field keeps its stored value.

        **`code` is present in the body only so that sending a different one can
        be refused with `409`.** Leaving it off the schema entirely would mean a
        caller who believed they had renamed the code is told the save
        succeeded. Resending the *same* code is always a no-op, because this
        screen submits the whole form on every save.

        **`isActive: false` is how a task type is retired, and there is no
        delete.** `tickets.task_type_id`, `sla_policies.task_type_id` and
        B-019's `project_task_types.task_type_id` are all foreign keys without
        cascades: a delete would fail on a constraint naming a MySQL index, and
        "fixing" that with a cascade would silently rewrite what historical
        tickets say they were raised against. Deactivating removes the type from
        the create form and from every project's SLA matrix while leaving every
        ticket that carries it able to render its own name.

        `If-Match` is required, not optional; a write without one is refused
        with `428`. Read the current tag from
        `GET /masters/task-types/{taskTypeId}`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskTypePatchRequest' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTypeResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428':
          description: '`If-Match` absent. The precondition is required, not opt-in.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /masters/modules:
    get:
      tags: [masters]
      operationId: listModules
      summary: Product modules a concern can be raised against (§7.5)
      description: |
        The Module field on the ticket. Eight seeded rows — Student, Admission,
        Fees, Examination, Attendance, Library, Inventory, Parent App — held as a
        master rather than an enum so that the ninth is a row somebody adds, not
        a migration and a deployment.

        **Deactivated rows are returned too**, carrying `isActive: false`, the
        same way task types are. A ticket raised last year against a module since
        retired still has to render its name; filtering them out here would leave
        that cell blank. Offer only the active ones in a picker.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /masters/priorities:
    get:
      tags: [masters]
      operationId: listPriorities
      summary: Priority levels (S-12)
      description: |
        The Priority / Level Master, and the level picker on the create-ticket
        form (§4B.1). Four rows seeded by B-002 — Low, Medium, High, Critical.

        Returned in `seq` order. **`seq` is the severity rank, never the id**:
        the SLA tab's column axis is built from this list in this order
        (`SlaMatrixService.activeLevels`), so reordering here reorders every
        project's SLA matrix.

        **Active rows only, unless `includeInactive` is set — and this is a
        deliberate departure from `listTaskTypes` and `listModules`**, which
        return retired rows to every caller. Those two are safe to widen because
        their consumers already filter: `CreateTicketPage` drops
        `isActive === false` task types before building its picker. Nothing
        filters this list, because until B-021 it could not contain a retired
        row — so returning one by default would put a retired level straight
        into the create form's `LevelPicker` and the ticket list's level filter,
        both of them Stream C's. The default is what those two screens already
        assume; the master grid asks for the rest.
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            `true` returns retired levels as well, carrying `isActive: false`.
            The S-12 grid sets it; a picker should not.
      responses:
        '200':
          description: OK. A bounded list — no `meta`, the set is complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriorityListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [masters]
      operationId: createPriority
      summary: Create a priority level (S-12)
      description: |
        Admin only — `master.write`, blueprint §2's "Master data (task types,
        SLA, workflow, holidays)".

        **S-12 says "Admin can add further levels without a release", and this
        operation cannot yet deliver it.** `Level` is a closed four-value enum,
        and it types `Ticket.level`, `Ticket.originalLevel`,
        `TaskType.defaultLevel`, `SlaPolicyWrite.level`, `SlaPolicyCell.level`,
        `ChangeTicketPriorityBody.level` and two query parameters. A fifth code
        stored here would serialise into a response the generated TypeScript
        client's own zod schema rejects, and Stream C's `LevelPicker` and
        `columns.tsx` key their chip variants off `Record<Level, …>` maps that
        a fifth key would leave `undefined`.

        So a code outside the four is refused with `400` and a message naming
        exactly what has to change and who owns it, rather than accepted and
        discovered later as a rendering failure — the same refusal
        `TaskTypeService.normaliseLevel` already makes for `defaultLevel`, and
        for the same reason. **Opening the enum is a coordinated change across
        Streams A, C and D, not a change this screen can make alone.**

        What this operation *is* for meanwhile: re-creating a level that was
        retired is done through `PATCH` (`isActive: true`), not here.

        `code` is upper-cased and must be unique; `name` must be unique
        case-insensitively. Neither is what `tickets.level` stores by
        accident — the column holds `code`, deliberately not a foreign key, so
        that retiring a level leaves history intact.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriorityWriteRequest' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriorityResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /masters/priorities/{priorityId}:
    parameters: [{ $ref: '#/components/parameters/PriorityId' }]
    get:
      tags: [masters]
      operationId: getPriority
      summary: One priority level (S-12)
      description: |
        **Exists to carry the `ETag` the `PATCH` requires as `If-Match`**, per
        CONVENTIONS.md §5 — the same gap B-011, B-016 and B-020 closed for
        users, projects and task types. A write whose precondition has no read
        to come from is not a strict endpoint, it is an uncallable one.

        The tag is taken over the content, the three usage counts included. A
        ticket raised at this level while the edit dialog is open therefore
        costs a reload, which is correct: those counts are what the retire
        decision was made against.
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              schema: { type: string }
              description: Send back as `If-Match` on the `PATCH`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriorityResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [masters]
      operationId: updatePriority
      summary: Edit a priority level, or retire it (S-12)
      description: |
        Admin only. A partial update — an omitted field keeps its stored value.

        **`code` is in the body only so that sending a different one can be
        refused with `409`**, exactly as on `PATCH /masters/task-types/{id}`.
        `tickets.level` stores the code and is not a foreign key, so a rename
        here would not cascade — it would orphan every ticket ever raised at
        this level. Resending the stored value is a no-op; this screen submits
        the whole form on every save.

        **`isActive: false` retires the level, and there is no delete.** A
        retire is not local, and the grid states its three consequences before
        the click:

        - the level leaves the create form's picker and the ticket list filter;
        - **a whole column leaves every project's SLA matrix** —
          `SlaMatrixService` builds its column axis from the active levels — so
          any `sla_policies` row at this level stops resolving;
        - `defaultSlaHrs` stops answering rung 4 (`PRIORITY_DEFAULT`) of the §6
          ladder for tickets at this level.

        Tickets and SLA rows never block a retire; the counts inform it.
        **Task types do block it**, with `409`: `TaskTypeService` refuses a
        retired level as a `defaultLevel`, so retiring a level three task types
        default to would leave those types unsaveable on their own screen.
        Repoint them first.

        **The escalation flag is single-writer and cannot be left unset.**
        Setting `autoEscalates: true` on one level clears it from the others,
        and clearing the last one is refused with `409` — §6 auto-promotes a
        ticket crossing its Planned Close Date *to* the flagged level, so zero
        flags silently switches that engine off and two make its target
        ambiguous. The column is a bare `TINYINT DEFAULT 0` with no constraint;
        this is where the invariant lives.

        `If-Match` is required, not optional; a write without one is refused
        with `428`. Read the current tag from
        `GET /masters/priorities/{priorityId}`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriorityPatchRequest' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriorityResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428':
          description: '`If-Match` absent. The precondition is required, not opt-in.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /masters/notification-templates:
    get:
      tags: [masters]
      operationId: listNotificationTemplates
      summary: Notification templates (S-15)
      description: |
        The Notification Template Master — the wording of every notification
        this system sends, one row per (event, channel) pair.

        **Admin only, reads included, and that is where this master differs from
        the four beside it.** Task types, levels, roles and the calendar are open
        to all six roles by an argument from §2 row 3: every role may raise a
        ticket, a ticket must carry a level and a type, so a role that could not
        read those could not raise a ticket at all. Nothing on any screen a
        non-Admin sees is built from this route. And the content is not neutral —
        the seeded rows include the mail sent to a **client contact**, the
        escalation naming the Reporting Manager, and A-044's chain-verification
        alarm. §2 gives the audit log to Admin alone on that reasoning; a
        catalogue of who gets told what, when something goes wrong, belongs on
        the same side of the line.

        Ordered by `eventCode` then `channel`, so the screen renders its event
        groups without sorting and an event's channels are always adjacent.

        **Switched-off templates are returned too**, and there is no
        `includeInactive` parameter — unlike `listPriorities`, which has one.
        That route needed a narrow default because two shipped Stream C screens
        read it unfiltered into a picker. Nothing outside S-15 reads this one,
        and the renderer will look up a single pair rather than the list.

        `channel` is `IN_APP | EMAIL | PUSH` — **not** the `POPUP | BELL | EMAIL`
        A-007's column comment predicted. Everything that runs keys on
        `NotificationChannel`, and the bell is not a channel: it renders the same
        wording as the toast, from the `IN_APP` template. `V20260815_1100`
        carries the full argument.
      responses:
        '200':
          description: OK. A bounded list — no `meta`, the set is complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplateListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [masters]
      operationId: createNotificationTemplate
      summary: Add a template for an event and channel that has none (S-15)
      description: |
        Admin only — `master.write`.

        `V20260815_1100` seeds one template per (event, channel) pair blueprint
        §11 ticks, so in practice this operation adds a `PUSH` template: §11 has
        no push column and the migration seeded none, on the grounds that D-045
        sends a push from the notification it has already written rather than
        from separate wording.

        A second template for a pair that already has one is refused with `409` —
        `uq_notification_templates` is over the pair, and the renderer resolves
        by it. Edit the existing one, or switch it back on.

        `subjectTemplate` is required when `channel` is `EMAIL` and optional
        otherwise. A mail with no subject line is unsendable; an in-app entry has
        a title rather than a subject, which is why the column is nullable. It is
        **permitted** on the other two channels rather than refused — a browser
        push genuinely has a title, and refusing the field would make this master
        unable to express something the channel has.

        Every `{{tag}}` in the subject and body is checked against the catalogue
        at `GET /masters/notification-templates/vocabulary`, and an unknown one
        is `400`. Without that check `{{ticketId}}` for `{{ticket_id}}` saves
        cleanly and prints literal braces in a client-facing mail, and the first
        person who could notice is the client.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateWriteRequest' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplateResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /masters/notification-templates/vocabulary:
    get:
      tags: [masters]
      operationId: getNotificationTemplateVocabulary
      summary: Events, channels, recipients and merge tags (S-15)
      description: |
        The four closed vocabularies a template is composed from, read off the
        enums rather than restated.

        **Reference data, not master data** — the same footing as
        `GET /masters/permissions`, and for the same reason: there is no create,
        edit or delete because every value exists only because code resolves it.
        A merge tag an Admin could add would substitute nothing, and a recipient
        they could delete would silently stop a mail reaching somebody.

        Serving it beats letting the screen hold its own copy. The copy is what
        drifts, and it drifts in the direction where S-15 offers a merge tag the
        renderer does not substitute.

        Declared before `/{templateId}` for readability; the literal segment
        outranks the path variable regardless of order, so `vocabulary` cannot be
        read as an id.

        **`recipients` are positions relative to a ticket, not roles.** §4B.6
        asks for a "per-role recipient list" and taking that literally produces
        the wrong table: of the ten things §11's "To" column names, two look like
        role codes and eight — assignee, stage owner, previous assignee,
        reporter, watchers, mentioned user, client contact, support desk — are
        resolved per send from the ticket. Even the two that share a spelling
        with a role are joins: `PROJECT_MANAGER` means the PM *of this ticket's
        project*, not everybody holding the PM role.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplateVocabularyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /masters/notification-templates/{templateId}:
    parameters: [{ $ref: '#/components/parameters/TemplateId' }]
    get:
      tags: [masters]
      operationId: getNotificationTemplate
      summary: One notification template (S-15)
      description: |
        **Exists to carry the `ETag` the `PATCH` requires as `If-Match`**, per
        CONVENTIONS.md §5 — the same gap B-011, B-016, B-020 and B-021 closed for
        users, projects, task types and levels. A write whose precondition has no
        read to come from is not a strict endpoint, it is an uncallable one.
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              schema: { type: string }
              description: Send back as `If-Match` on the `PATCH`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [masters]
      operationId: updateNotificationTemplate
      summary: Reword a template, re-target it, or switch it off (S-15)
      description: |
        Admin only. A partial update — an omitted field keeps its stored value.

        **`eventCode` and `channel` are in the body only so that sending a
        different one can be refused with `409`.** Together they are the row's
        identity: the unique key is over the pair, the renderer resolves by it,
        and `email_log.template_id` rows already sent point at this id — so
        re-pointing a template at another event would change what those
        historical records claim to have been rendered from, undetectably.
        Resending the stored values is a no-op; this screen submits the whole
        form on every save.

        **`isActive: false` switches the template off, and there is no delete.**
        Deleting would not orphan a reference the way deleting a level does — it
        would remove the *wording* for an event that goes on firing, and the
        failure appears as a mail that never arrives rather than as an error
        anybody sees.

        **A mandatory mail cannot be switched off at all, and this is refused
        with `409`.** Blueprint §4B.6 marks assignment, handoff, escalation and
        status-request mail **❌ never** optional, and D-036 already stops an
        individual user muting it — so an `EMAIL` template whose event has
        `mandatoryMail: true` is permanent. Switching it off here would silence
        it for everybody at once, by a route nobody would think to check. The
        `IN_APP` template for the same event *can* be switched off: §7.7 gives
        the guarantee to mail, not to a toast that only reaches somebody who is
        already logged in.

        **What is deliberately not guarded is the recipient list.** Removing
        `ASSIGNEE` from a mandatory mail would silence it as effectively as the
        toggle, and is still permitted — §11's "To" column is a sensible default
        rather than a law, and an organisation routing assignment mail through a
        shared desk address is doing something legitimate. The list must be
        non-empty; what it contains is the Admin's call.

        `If-Match` is required, not optional; a write without one is refused with
        `428`. Read the current tag from
        `GET /masters/notification-templates/{templateId}`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplatePatchRequest' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplateResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428':
          description: '`If-Match` absent. The precondition is required, not opt-in.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /masters/permissions:
    get:
      tags: [masters]
      operationId: listPermissions
      summary: The permission catalogue (S-09)
      description: |
        Every capability the system knows about — the row axis of the Role &
        Permission Master's matrix. Eighteen rows seeded from blueprint §2,
        grouped by `category`, returned in `(category, code)` order so the
        screen renders its sections without sorting.

        **Permissions are reference data, not master data.** There is no create,
        edit or delete: a capability exists because code checks for it, so a row
        an admin could add would grant nothing and a row they could delete would
        silently un-guard a route. New capabilities arrive by migration
        alongside the code that enforces them.

        Readable by every role. Knowing that `ticket.force_move` exists is
        blueprint documentation, and `GET /me` already returns the caller's own
        grants.
      responses:
        '200':
          description: OK. A bounded list — no `meta`, the set is complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /masters/roles:
    get:
      tags: [masters]
      operationId: listRoles
      summary: Roles (S-09)
      description: |
        The Role Master grid, and the role picker on the S-08 resource form.

        Inactive roles are returned too, carrying `isActive: false`, for the same
        reason task types and modules are: a resource still holding a since-
        retired role has to render its name. Offer only the active ones in a
        picker.

        `userCount` is how many resources currently hold the role — the number
        the delete refusal quotes, shown up front so an admin does not discover
        it only by being refused. Readable by every role.
      parameters:
        - name: isActive
          in: query
          schema: { type: boolean }
          description: Omit for all roles; `true` for the picker.
      responses:
        '200':
          description: OK. A bounded list — no `meta`, the set is complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [masters]
      operationId: createRole
      summary: Create a role
      description: |
        Admin only. Creates a non-system role — `isSystem` is not writable, so
        nothing created here can ever masquerade as one of the six that scope
        resolution and the §2 matrix are built on.

        `code` is upper-cased and must be unique. It is the identifier that
        appears in the JWT `role` claim, in `@PreAuthorize` expressions and in
        `workflow_transitions.role_code`, which is why it **cannot be changed
        afterwards** — see `PATCH /masters/roles/{roleId}`.

        A new role starts with no grants. Give it some through
        `PUT /masters/roles/{roleId}/permissions`.

        > **A custom role cannot yet be assigned to a resource.** `RoleCode` is
        > a closed six-value enum here, so the S-08 role picker and every
        > `UserRef` in this contract reject anything else. Opening it touches
        > Streams A, C and D and is not B-015's to make; until then a custom
        > role is definable and grantable but not yet selectable.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWriteRequest' }
      responses:
        '201':
          description: Created, with no permissions granted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /masters/roles/{roleId}:
    parameters: [{ $ref: '#/components/parameters/RoleId' }]
    get:
      tags: [masters]
      operationId: getRole
      summary: One role, with its grants (S-09)
      description: |
        The matrix's read: the role, plus `permissionCodes` — every capability
        it currently holds.

        **This carries the `ETag` that both writes on this role require as
        `If-Match`**, per CONVENTIONS.md §5. The tag covers the grants as well
        as the fields, so a concurrent matrix save and a concurrent rename
        conflict with each other, which is correct — they are edits to the same
        screen.
      responses:
        '200':
          description: OK.
          headers:
            ETag:
              schema: { type: string }
              description: Send back as `If-Match` on the `PATCH` or the `PUT`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [masters]
      operationId: updateRole
      summary: Rename a role or change its status
      description: |
        Admin only. A partial update — an omitted field keeps its stored value.

        **`code` is absent from the request body on purpose, and sending one is
        a `409`.** It is the ticket-ID-prefix problem in a different table: the
        code is denormalised into every issued JWT, into `@PreAuthorize`
        expressions compiled at startup and into `workflow_transitions.
        role_code`, and changing it would orphan all three at once while leaving
        every one of them looking healthy. Deactivate and create a replacement.

        A **system role may be renamed and deactivated but not deleted** —
        `name` and `description` are display text, `isSystem` is the guarantee.
        Deactivating one is allowed and deliberately not blocked: it removes the
        role from pickers without breaking the resources that hold it.

        `If-Match` is required, not optional; a write without one is refused with
        `428`. Read the current tag from `GET /masters/roles/{roleId}`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePatchRequest' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428':
          description: '`If-Match` absent. The precondition is required, not opt-in.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [masters]
      operationId: deleteRole
      summary: Delete a role
      description: |
        Admin only, and refused in two cases that are reported separately
        because the remedy differs.

        **A system role is never deletable** — `type` is
        `system-role-undeletable`. The six seeded roles are the input to every
        scope decision and to the whole §2 matrix; deleting one would leave
        existing users pointing at nothing. Deactivate instead.

        **A role still held by resources is refused** — `type` is
        `role-in-use`, and `userCount` on the problem says how many. Reassign
        them first. `users.role_id` is a foreign key without a cascade, so
        without this check the database would refuse it anyway, as a raw
        constraint violation that names a MySQL index rather than a way forward.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: System role, or still held by resources.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RoleInUseProblem' }

  /masters/roles/{roleId}/permissions:
    parameters: [{ $ref: '#/components/parameters/RoleId' }]
    put:
      tags: [masters]
      operationId: replaceRolePermissions
      summary: Save the permission matrix for a role (S-09)
      description: |
        Admin only. **Replace-all**: `permissionCodes` is the complete set the
        role should hold afterwards, not a delta. Codes absent from the body are
        revoked. `PUT` rather than `PATCH` because the screen submits every
        checkbox's state at once, and a partial save of a permission matrix is
        an ambiguous thing to have to reason about later.

        Delete is legitimate here, unlike everywhere else in this contract:
        `role_permissions` is *current state*, not the append-only audit. The
        change itself is recorded in the audit log.

        **`history.edit_delete` is refused with `422`.** Blueprint §2: "Edit /
        delete history or ribbon — ❌ (nobody can)". It is seeded with zero
        grants and `isGrantable: false` so the matrix can render it, disabled,
        rather than silently omitting it — hiding a permission nobody holds
        would leave an admin unsure whether the guarantee exists. Granting it
        through this route is the one way the append-only rule CLAUDE.md calls
        "the guarantee that erodes first" could be unlocked from a UI, so the
        refusal is server-side and not merely a disabled checkbox.

        Unknown codes are a `400` naming each one, not a silent skip: a typo
        that quietly grants nothing is a permission bug discovered in
        production.

        `If-Match` is required — this is the wholesale replace that
        CONVENTIONS.md §5 calls the worst case for a lost update, the same
        reasoning as `PUT /projects/{projectId}/sla-policies`.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePermissionsRequest' }
      responses:
        '200':
          description: Saved. Returns the role with its new grants.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422':
          description: A permission that cannot be granted to anybody.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '428':
          description: '`If-Match` absent. The precondition is required, not opt-in.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /masters/holidays:
    get:
      tags: [masters]
      operationId: getWorkingCalendar
      summary: Working calendar — org holidays and weekly-off pattern
      description: |
        Consumed by the working-hours service that **every** SLA, duration and
        utilisation figure routes through. A Friday-18:00 ticket with a four-hour
        SLA must not breach on Saturday morning, and four private implementations
        of "working hours" produce four different answers to the same question.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [masters]
      operationId: createHoliday
      summary: Add an org or project holiday (S-14)
      description: |
        A recurring holiday is stored **once**, not once per year — the
        working-hours service expands it. That is why `date` on a recurring row
        is a template rather than the only occurrence, and why re-adding "the
        same" holiday next year is a duplicate, answered `409`.

        `projectId` omitted means org-wide. A project holiday does not replace
        the org one for the same date: either makes the day non-working, so the
        two union rather than override.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayWriteRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /masters/holidays/{holidayId}:
    parameters: [{ $ref: '#/components/parameters/HolidayId' }]
    patch:
      tags: [masters]
      operationId: updateHoliday
      summary: Edit a holiday
      description: |
        A partial update — send only the fields that change. Every field is
        optional here, unlike on create: an omitted field keeps its stored
        value rather than being cleared.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayPatchRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [masters]
      operationId: deleteHoliday
      summary: Remove a holiday
      description: |
        A hard delete, unlike a workflow stage. Nothing references a holiday by
        id — the working-hours service reads the set of dates for a window, so a
        removed row simply makes that day workable again from the next
        calculation. Historic SLA figures already recorded are unaffected;
        they are stored, not recomputed.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /masters/working-calendar:
    get:
      tags: [masters]
      operationId: getWorkingWeek
      summary: The org working week — weekly-off pattern and working-day bounds
      description: |
        The settings half of S-14, separate from the holiday list because they
        change on entirely different cadences: holidays are edited every year,
        the working week almost never.

        Returns an `ETag`. `PUT` requires it back as `If-Match` — two admins
        editing the working week from different tabs is exactly the lost update
        that would otherwise silently reset somebody's change.
      responses:
        '200':
          description: OK.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingWeekResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [masters]
      operationId: updateWorkingWeek
      summary: Replace the org working week
      description: |
        A whole-resource replace, not a patch: a partial weekend is meaningless,
        and the working day's two bounds are only valid relative to each other.

        **Every SLA, duration and utilisation figure in the system is computed
        against this.** Changing it does not rewrite figures already recorded —
        stored values stay as they were — but every calculation from here on
        uses the new week.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkingWeekUpdateRequest' }
      responses:
        '200':
          description: Updated.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingWeekResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /masters/leaves:
    get:
      tags: [masters]
      operationId: listResourceLeaves
      summary: Resource leave, the per-person half of the working calendar
      description: |
        Overlap, not containment: a fortnight's leave that brackets the window
        entirely has neither endpoint inside it, and a containment filter would
        report the resource at their desk all week.
      parameters:
        - { name: userId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LeaveStatus' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceLeaveListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [masters]
      operationId: createResourceLeave
      summary: Record leave for a resource
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceLeaveWriteRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceLeaveResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /masters/leaves/{leaveId}:
    parameters: [{ $ref: '#/components/parameters/LeaveId' }]
    patch:
      tags: [masters]
      operationId: updateResourceLeave
      summary: Edit or approve a leave record
      description: |
        Only `APPROVED` leave stops the SLA clock. A pending or rejected request
        must not, or the target a manager sees depends on paperwork nobody has
        signed yet.

        A partial update — approving is `{"status": "APPROVED"}` and nothing
        else. Omitted fields keep their stored value.
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceLeavePatchRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceLeaveResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [masters]
      operationId: deleteResourceLeave
      summary: Remove a leave record
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /masters/workflow-templates:
    get:
      tags: [masters]
      operationId: listWorkflowTemplates
      summary: Workflow templates with their stages
      parameters:
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: taskTypeId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTemplateListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [masters]
      operationId: createWorkflowTemplate
      summary: Create or version a workflow template (S-30)
      description: |
        **Stages in use are deprecated, never deleted** — deleting one breaks every
        historical ribbon that referenced it. Live tickets keep the template
        version they started on, so editing a template never rewrites a journey
        already in flight.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowTemplateWriteRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTemplateResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────────────────────────────────────── dashboard ─────────
  /dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      summary: KPI cards (S-05)
      description: |
        Served from the pre-aggregated summary tables, refreshed every five
        minutes. **Never a live `COUNT(*)`** — at 50,000 tickets that is the
        difference between a dashboard and a timeout.
      parameters:
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: assigneeId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dashboard/widget/{widgetKey}:
    parameters:
      - name: widgetKey
        in: path
        required: true
        schema:
          type: string
          enum:
            [type-donut, daily-stacked, velocity, resource-load, priority-bar,
             aging-buckets, calendar-heatmap, sla-gauge, project-treemap,
             stage-funnel, rework, stage-duration, handoff-latency, client-volume]
    get:
      tags: [dashboard]
      operationId: getDashboardWidget
      summary: One widget's series
      description: |
        Every series point carries a `drillDown` query string. **Every card and
        chart segment deep-links to a pre-filtered list** — a number nobody can
        click is a number nobody trusts.

        Returns an `ETag`. The summary tables refresh every five minutes, so a
        dashboard polling faster than that gets `304` and costs nothing.
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetResponse' }
        '304': { description: Not modified. }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports:
    get:
      tags: [reports]
      operationId: listReports
      summary: The report catalogue (S-27)
      description: |
        A-063 · what reports exist, so the hub's card grid does not have to
        know. Every descriptor carries its own title, category, chart type and
        **which filters apply to it** — the viewer renders the filter bar from
        this rather than showing all five everywhere, because a resource filter
        on the email-delivery-log is a control that cannot do anything.

        **The catalogue is served rather than hardcoded** for the reason
        `/me/notification-preferences` gives for returning the whole event
        catalogue: a client that had to know all eighteen keys would be a second
        copy of the server's vocabulary, and a nineteenth report would silently
        fail to appear.

        **Unbuilt reports are listed, not hidden**, with `available: false` and a
        reason. This is A-056's answer to the same shape one screen over: a
        dashboard widget with no table to answer it returns `unavailableReason`
        rather than an empty series, because an empty result is a claim about
        the data and a 404 on a legitimate route reads as a bug. A hub that
        showed only what works would make the other seventeen reports
        indistinguishable from reports that do not exist. The unavailable set
        shrinks as A-066–A-068 land, and it is visible in the meantime.

        Scoped like every other read: the catalogue itself is the same for
        everybody, but a delivery role sees `scopeNote` explaining that its rows
        will cover its own work only (§2 — "Own perf.").
      responses:
        '200':
          description: Every report this deployment knows about, built or not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportCatalogueResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reports/{reportKey}:
    parameters:
      - { name: reportKey, in: path, required: true, schema: { type: string, examples: [resource-scorecard] } }
    get:
      tags: [reports]
      operationId: runReport
      summary: Run a report (S-27)
      description: |
        Eighteen reports share one parameterised runner. `?export=` streams the
        file instead of returning JSON.

        Returns an `ETag`. Reports are expensive to compute and are re-run every
        time somebody changes a filter and changes it back.

        **Row scope is applied server-side and the request cannot widen it**
        (§2, blueprint line 50): Admin sees everything, PM and Support their own
        projects, and Developer/QA/Deployment their own work only. For those
        three, `?resourceId=` is **ignored rather than honoured** — answering it
        would let a Developer read a colleague's scorecard by guessing a user
        id, and `403` would wrongly imply a grant exists that could be given.

        **`404` for a report key that does not exist, and for one that is not
        built yet.** The catalogue is where "exists but unbuilt" is expressed,
        with a reason a person can read; by the time a caller is running a key,
        an unbuilt report has no rows to describe and no columns to name, so
        there is nothing honest to return with a `200`.
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { name: export, in: query, schema: { type: string, enum: [xlsx, csv, pdf] } }
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: clientId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        # A-063 · §7.8 names five filters — "date range, project, resource, type,
        # level" — and D-001 carried only the first two plus client. The three
        # below close that gap. Which of them a given report honours is declared
        # per descriptor in the catalogue, not guessed from whether it was sent.
        - name: resourceId
          in: query
          schema: { type: integer, format: int64 }
          description: >
            Ignored for Developer/QA/Deployment, who are always their own
            subject. Silently, not with a 400 — the client is usually posting
            back a filter bar it rendered, and the response states the scope
            that was applied in `meta.appliedScope`.
        - { name: taskTypeId, in: query, schema: { type: integer, format: int64 } }
        - { name: level, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
      responses:
        '200':
          description: Rows and columns, or the exported file.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResponse' }
            application/octet-stream:
              schema: { type: string, format: binary }
        '304': { description: Not modified. }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports/schedule:
    post:
      tags: [reports]
      operationId: scheduleReport
      summary: Schedule a recurring report email
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportScheduleRequest' }
      responses:
        '201': { description: Scheduled. }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  # ─────────────────────────────────────────────────── notifications ─────────
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Notification centre (S-26)
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [all, mentions, assignments, escalations, status-requests], default: all }
        - { name: unreadOnly, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: >
            OK. `meta.unreadCount` is the caller's total unread, never the count
            within the current tab — it drives the bell badge, which must not
            change as you click between tabs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
        '400':
          description: >
            Unknown `tab`, or a `cursor` that did not come from `meta.nextCursor`.
            An unrecognised tab is rejected rather than treated as `all`, which
            would show a caller who mistyped it everything and look correct.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/awaiting-response:
    get:
      tags: [chat]
      operationId: listAwaitingResponse
      summary: Status requests you are still waiting on (S-25)
      description: |
        D-056's "Awaiting response" list — every status request *you* asked that
        nobody has answered yet, **longest wait first**. The opposite order to
        every other list in chat, and deliberately: this list exists to be
        cleared, and the thing most in need of clearing is the question that has
        been ignored longest.

        Under `/me` rather than `/users/{id}/…` for the reason
        `/me/notification-preferences` is: a path taking a user id is one an
        Admin would reasonably expect to work, and "who is ignoring whom" is not
        a report to hand out as a side effect of a URL shape nobody decided to
        build.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusRequestListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notification-preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: The per-user notification matrix (S-26)
      description: >
        The whole event catalogue with your answers applied, not just your
        overrides — a client that had to know every event code to render the
        grid would be a second copy of the server's vocabulary, and a newly
        added event would silently fail to appear.

        `emailLocked` is D-036: assignment, handoff, escalation and breach mails
        ignore preferences and always send (§4B.6). A locked row always reports
        `email: true`, whatever is stored, so the screen cannot show a switch as
        off that the send path ignores.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferenceMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [notifications]
      operationId: updateNotificationPreferences
      summary: Change which events reach you, on which channel
      description: >
        Partial by field: an omitted `inApp` or `email` leaves that channel
        alone, so saving one row does not require restating the grid.

        An attempt to disable a locked mail is **discarded, not rejected** — the
        client is usually posting back the row it was showing, and failing the
        whole save over a switch the user could not move would punish the caller
        for our own UI. The response is the resulting matrix, so what actually
        took effect is visible.

        An unknown `eventKey` **is** rejected: there is nothing to honour, and
        accepting it silently would leave someone believing they had switched
        something off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferenceUpdateRequest' }
      responses:
        '200':
          description: Saved. Returns the matrix as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferenceMatrix' }
        '400':
          description: An `eventKey` that is not a notification event.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push/public-key:
    get:
      tags: [notifications]
      operationId: getPushPublicKey
      summary: The VAPID application server key (D-045)
      description: >
        The browser needs this *before* it can subscribe — it is the
        `applicationServerKey` passed to `pushManager.subscribe()`, and it binds
        the subscription to this deployment so no other server can push to it.


        Public by design: it is the public half of the VAPID pair, and shipping
        it to every browser is what it is for. The private half never leaves the
        server.


        Served rather than baked into the frontend build, so rotating the pair
        is a config change and a redeploy of one service rather than a
        rebuild — and so a browser that subscribed under the old key can be told
        the key changed.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushPublicKeyResponse' }
        '404':
          description: Push is not configured on this deployment.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/push-subscriptions:
    post:
      tags: [notifications]
      operationId: subscribeToPush
      summary: Register this browser for push (D-045)
      description: >
        Idempotent by design, which is why it answers 204 rather than 201 and
        takes no idempotency key: the endpoint identifies the browser, so
        posting the same one twice is the same subscription, not a second.


        **Re-posting an endpoint that belongs to somebody else moves it.** The
        endpoint is a property of the browser, not of the account — on a shared
        machine, leaving the previous user's row in place would push their
        ticket alerts onto this user's screen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionRequest' }
      responses:
        '204': { description: Subscribed. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [notifications]
      operationId: unsubscribeFromPush
      summary: Forget this browser
      description: >
        Answers 204 whether or not the endpoint was registered. Unsubscribing is
        a statement about the desired state, and a browser that has already been
        forgotten — because the push service expired it and the server dropped
        it — has nothing to report as an error.
      parameters:
        - name: endpoint
          in: query
          required: true
          schema: { type: string, maxLength: 500 }
          description: The endpoint returned by `pushManager.subscribe()`.
      responses:
        '204': { description: 'Gone, or never here.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/pending:
    get:
      tags: [notifications]
      operationId: listPendingNotifications
      summary: Queued popups not yet shown to this user (D-046)
      description: >
        Blueprint §11: a notification raised while the user was offline is
        queued and pops the moment they log in. Oldest first — this is a queue
        being drained, not a list being browsed — and capped, because somebody
        back from leave has a hundred queued and popping all of them is
        indistinguishable from popping none. `hasMore` says the cap hid some.

        Independent of `isRead`: a notification can be read without ever having
        been popped, and popped without being read.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingNotificationsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/delivered:
    post:
      tags: [notifications]
      operationId: markNotificationsDelivered
      summary: Acknowledge notifications shown to the user (D-046)
      description: >
        The client reports what it actually put on screen. Deliberately
        client-driven: realtime delivery is fire-and-forget, so a server that
        stamped on publish would be recording that it *sent* a toast — the
        claim §17 says must not be taken on trust. Delivery is therefore
        at-least-once; a browser that dies between receiving and rendering
        re-pops on next login.

        Ids that are already delivered, or not the caller's, are ignored rather
        than rejected — two tabs racing to drain one queue is normal, and a 404
        here would let the ack probe which ids exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationsDeliveredRequest' }
      responses:
        '204': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{notificationId}/read:
    parameters:
      - { name: notificationId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one as read
      responses:
        '204': { description: Marked. }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/read-all:
    patch:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark all as read
      responses:
        '204': { description: Marked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ──────────────────────────────────────────────────────────── chat ─────────
  /chat/threads:
    get:
      tags: [chat]
      operationId: listChatThreads
      summary: Threads — ticket, direct message and project channel (S-25)
      description: Three surfaces, one engine.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [TICKET, DIRECT, PROJECT] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThreadListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /chat/ticket-cards:
    get:
      tags: [chat]
      operationId: resolveTicketCards
      summary: Ticket cards for codes named in a live message (S-25)
      description: |
        D-054. A page of messages already carries its cards in `ticketRefs`; this
        exists for the one case that cannot.

        A live message arrives as a **single frame delivered to a whole room**,
        so it cannot carry cards — whose cards would they be? Each client
        resolves for itself and gets exactly what its own scope allows.

        Passing codes in is not a way to ask what exists. Every code is scoped,
        and one the caller may not see is simply absent from the answer,
        indistinguishable from one that was never issued. Anything that is not a
        well-formed ticket code is dropped by the same parser the server runs
        over a message body, so this endpoint cannot be handed a pattern the read
        path would not have matched either.
      parameters:
        - name: codes
          in: query
          required: true
          schema: { type: string }
          description: >
            Comma- or space-separated ticket codes, e.g.
            `CRM-26-00347,WEB-26-00012`. Capped server-side; the surplus is
            dropped rather than rejected, since the client's fallback for a
            missing card is the plain text it already has.
          example: CRM-26-00347,WEB-26-00012
      responses:
        '200':
          description: The cards this caller may see. Never reports what it withheld.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketCardListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /chat/messages/search:
    get:
      tags: [chat]
      operationId: searchChatMessages
      summary: Search your own conversations (S-25)
      description: >
        Scoped to threads the caller participates in — search is the one chat
        surface with no thread id in the request, so nothing else narrows it.
        Deleted messages never match: their body survives in the row and is
        withheld on read, and a search that returned it would be the one path
        around the tombstone.


        Results are ordered by recency, not relevance. Chat search is "find the
        thing we said", and a relevance order would need an offset cursor since
        a score is not monotonic in id.


        Words shorter than the server's `innodb_ft_min_token_size` (3 by
        default) are not indexed and are ignored. A query with nothing longer
        than that returns an empty page rather than an error.
      parameters:
        - name: q
          in: query
          schema: { type: string, examples: [deployment rollback] }
          description: >
            Free text. Every word must appear and a partial word matches;
            boolean-mode operators are stripped rather than honoured.
        - name: threadId
          in: query
          schema: { type: integer, format: int64 }
          description: Restrict to one conversation. Omit to search all of yours.
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK. Empty when nothing usable was typed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSearchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /chat/threads/{threadId}/messages:
    parameters:
      - { name: threadId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [chat]
      operationId: listChatMessages
      summary: Messages, newest first
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessageListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [chat]
      operationId: postChatMessage
      summary: Post a message
      description: |
        Editable for five minutes, then locked; deletions leave a tombstone.
        **This is what keeps chat admissible as project evidence** — a thread
        anybody can quietly rewrite proves nothing.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000 }
                attachmentIds:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        '201':
          description: Posted; broadcast on the thread's STOMP topic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/threads/{threadId}/messages/{messageId}:
    parameters:
      - { name: threadId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: messageId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [chat]
      operationId: editChatMessage
      summary: Edit a message, inside the five-minute window
      description: |
        Author only, and only for five minutes after posting. After that the
        message is immutable and this returns `409`.

        **This is what keeps chat admissible as project evidence.** A thread
        anybody can quietly rewrite proves nothing, so the window is a hard
        limit rather than a UI affordance — the client hides the control after
        `editableUntil`, and the server refuses regardless.

        No `If-Match`: the author is the only person who can edit, so there is
        no second writer to lose an update to.

        Not the author, not a participant, or no such message all return `404`.
        A `403` would confirm the message exists and who wrote it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        '200':
          description: Edited. `isEdited` is now true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [chat]
      operationId: deleteChatMessage
      summary: Delete a message, leaving a tombstone
      description: |
        The row survives and the body is withheld — `isDeleted` becomes true and
        `body` becomes null. A conversation that silently loses a message reads
        as though it never happened, which is exactly what §7.6 guards against.

        Returns the tombstone rather than `204`, so the caller can render the
        new state without a refetch.

        Unlike editing, this is **not** limited to five minutes: the point of
        the window is that nobody can rewrite history, and a tombstone adds to
        the record rather than altering it.
      responses:
        '200':
          description: Deleted. The tombstone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────────────────── webhooks ─────────
  /webhooks/email/inbound:
    post:
      tags: [webhooks]
      operationId: inboundEmailWebhook
      summary: Inbound mail — reply becomes a comment
      description: |
        Unauthenticated but **signature-verified**; an unverified signature is a
        `401`, never a silently-accepted comment. Quoted text is stripped before
        the body becomes a comment. Email-to-ticket creation is phase 6.
      security: []
      parameters:
        - { name: X-Webhook-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: Accepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhooks/email/bounce:
    post:
      tags: [webhooks]
      operationId: bounceEmailWebhook
      summary: Bounce and complaint notifications
      description: Marks the address invalid and alerts Admin.
      security: []
      parameters:
        - { name: X-Webhook-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: Accepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────────────────────────────────────── audit ─────────
  /audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: Audit log viewer — Admin only (S-16)
      description: |
        Every login, permission change, master change and ticket action.
        **Export only; there is no edit or delete route, and there never will be.**
      parameters:
        - { name: actorId, in: query, schema: { type: integer, format: int64 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: export, in: query, schema: { type: string, enum: [xlsx, csv] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ══════════════════════════════════════════════════════════ components ═══════
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        15-minute access token. Claims: `sub`, `role`, `permissions[]`,
        `projects[]`, `reportees[]`, `iat`, `exp`, `jti`. The refresh token is a
        separate opaque value in an HttpOnly cookie and is never sent here.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from `meta.nextCursor`. Never an offset.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TicketId' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: |
        A `client_contacts` id. Nested under the client on purpose: a contact
        belonging to a *different* client is `404`, not `403` — the id is a row
        this caller has no business knowing exists under that client.
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: integer, format: int32 }
      description: |
        `roles.id` is an `INT`, not a `BIGINT` like every other identifier here:
        blueprint §8.2 declares `users.role_id INT` and A-003 kept it, so the key
        type follows the column rather than the house convention.
    PriorityId:
      name: priorityId
      in: path
      required: true
      schema: { type: integer, format: int32 }
      description: |
        `priorities.id` is an `INT`, for the same reason `RoleId` is: A-007
        declared the column that way. Note that nothing points at it —
        `tickets.level` stores the *code*, deliberately not this key, which is
        what lets a level be retired without orphaning history.
    TaskTypeId:
      name: taskTypeId
      in: path
      required: true
      schema: { type: integer, format: int32 }
      description: |
        `task_types.id` is an `INT`, for the same reason `RoleId` is: A-007
        declared the column that way and `tickets.task_type_id` follows it.
        `SlaPolicyCell.taskTypeId` has always said `int32`; `TaskType.id` said
        `int64` until B-020 and was the odd one out.
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: |
        `notification_templates.id` — a `BIGINT`, unlike `PriorityId` and
        `RoleId`, because A-007 declared this one that way. `email_log.template_id`
        is the foreign key that points at it, which is why the value is stable and
        the (event, channel) pair behind it is immutable.
    HolidayId:
      name: holidayId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LeaveId:
      name: leaveId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: |
        `import_batches.id` — a `BIGINT AUTO_INCREMENT`, like every other
        identifier in this schema. Described as a UUID until B-030, which is
        when the engine first had to resolve one against the table.
    ImportSchema:
      name: schema
      in: path
      required: true
      schema: { type: string, enum: [clients, users] }
      description: |
        Which registered schema to import. **One engine, registered twice** —
        `users` is a registration, not a second implementation (B-030, B-038).
        Bolting `import` under `/clients/…` instead would collide with
        `/clients/{clientId}/…` on any three-segment path.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, format: uuid }
      description: |
        Replaying a key within 24 hours returns the original response instead of
        creating a second row. Send one on every create — a retried request after
        a network timeout is the normal case, not the exception.
    IfMatch:
      name: If-Match
      in: header
      schema: { type: string }
      description: The `ETag` from the last read. Prevents a lost update; `412` if stale.
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing, expired or revoked token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Authenticated but not permitted **for a reason that does not leak row
        existence** — an Admin-only screen, for example. Row-level scope failures
        return `404`, never this.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Not found — **or out of the caller's scope**. The two are deliberately
        indistinguishable. Returning `403` here would confirm the row exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Unique constraint or an immutable field.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Bean Validation failure; `errors` is field-keyed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    PreconditionFailed:
      description: '`If-Match` did not match — the row changed since you read it.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableTransition:
      description: |
        The workflow forbids this move. Most often: the caller is not the current
        stage owner, the target stage is not reachable from here, or mandatory
        effort confirmation is missing.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── envelope ──────────────────────────────────────────────────────────
    Meta:
      type: object
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        totalCount:
          type: [integer, 'null']
          description: Present only where a count is cheap. Never computed live over tickets.
    Problem:
      type: object
      description: RFC 9457. `type` is stable and switchable; `detail` is for humans.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, examples: ['https://edutrack/errors/invalid-credentials'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string, description: Correlates with server logs and Sentry. }
    ValidationProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            errors:
              type: object
              additionalProperties: { type: array, items: { type: string } }
              examples: [{ title: ['must not be blank'] }]
    OpenTicketsProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            openTicketCount: { type: integer }
            reassignUrl: { type: string, examples: ['/api/v1/tickets/bulk-reassign'] }

    # ── primitives ────────────────────────────────────────────────────────
    TicketId:
      type: string
      pattern: '^[A-Z][A-Z0-9]{1,9}-\d{2}-\d{5,}$'
      examples: ['CRM-26-00347']
      description: |
        `{PROJECT_CODE}-{YY}-{NNNNN}`. Issued server-side; never guessable by count.

        **Five digits is a minimum width, not a maximum** (`\d{5,}`, not `\d{5}`).
        `projects.ticket_seq` is a per-project counter that does not reset at year
        rollover (PLAN.md §3.2, deviation D-8), so a long-lived project eventually
        issues `CRM-30-100000`. Because this schema also types the `ticketId`
        **path parameter**, an exact `\d{5}` would have made every attachment,
        comment and history call for that ticket fail client-side in the generated
        Zod — the ticket would be created and stored correctly and then be
        unreachable. Narrowing this back is a breaking change, not a tidy-up.
    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: Upper, lower, digit and symbol required; the last three are not reusable.
    RoleCode:
      type: string
      enum: [ADMIN, PM, DEVELOPER, QA, DEPLOYMENT, SUPPORT]
    Level:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    StatusCode:
      type: string
      enum: [NEW, IN_PROGRESS, ON_HOLD, AWAITING_INFO, REWORK, RESOLVED, CLOSED, REOPENED]
    SegmentState:
      type: string
      enum: [COMPLETED, CURRENT, PENDING, REWORKED, SKIPPED, BLOCKED]
    TransitionAction:
      type: string
      enum: [FORWARD, REWORK, DEPLOY_FAILED, VERIFY_FAILED, SIGNOFF_REJECTED, CLARIFICATION, SKIP, OVERRIDE, STAGE_REASSIGNED]
    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: integer, format: int64 }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/RoleCode' }
        # Kept to one line: UserRef is inlined into every schema that references
        # it, so a paragraph here is a paragraph in ten generated zod files.
        handle:
          type: [string, 'null']
          description: >
            `@mention` handle (`users.username`). Populated only where a mention
            is composed or resolved — see `ChatMessage.mentions`.
          examples: [ravi.kumar]

    # ── auth ──────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        # A-020 fix, Stream A change to a Stream D file — flagged for Debashis.
        # S-01 (blueprint §7.1) specifies one "Username / Email" field, so this
        # carries either form. maxLength follows users.email (VARCHAR(150)), not
        # users.username (VARCHAR(50)): at 100 any address longer than that was
        # refused by Bean Validation before the lookup ran, which read to the
        # caller as a wrong password.
        username: { type: string, minLength: 1, maxLength: 150 }
        password: { type: string, minLength: 1 }
        totpCode: { type: string, pattern: '^\d{6}$', description: Required when 2FA is enabled. }
        # A-029, Stream A addition — flagged for Debashis with the /me/2fa paths.
        # A separate field rather than relaxing totpCode's pattern: a recovery
        # code is not six digits, and widening a reviewed constraint to carry a
        # different kind of credential is the worse of the two changes.
        recoveryCode:
          type: string
          maxLength: 32
          description: >-
            A single-use recovery code, in place of totpCode when the
            authenticator is unavailable. Hyphens, spaces and lower case are
            all accepted.
    Session:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, examples: [900] }
        mustChangePassword: { type: boolean }
        landingRoute:
          type: string
          description: |
            Role-based post-login destination, decided server-side — Admin and PM
            to the dashboard, Developer to My Tasks, Support to the ticket queue,
            QA and Deployment to the stage queue.
        user: { $ref: '#/components/schemas/Me' }
    SessionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Session' }

    # ── A-029 · two-factor enrolment ──────────────────────────────────────
    #
    # A 2xx body must be a $ref to a named schema, never an inline object.
    # check-conventions.py resolves response schemas with
    #
    #     schemas.get(ref.get("$ref", "").split("/")[-1], {})
    #
    # which yields an empty dict for anything inline — so an inline body fails
    # the "wrapped in { data }" rule no matter how it is written, because the
    # checker never sees its properties. Every 2xx in this file is a $ref.
    TwoFactorSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32 shared secret, for typing in when a QR cannot be scanned.
        otpauthUri:
          type: string
          description: >-
            The otpauth:// URI to render client-side as a QR code. Carries the
            same secret, so it is never turned into a cacheable image.
    TwoFactorSetupResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TwoFactorSetup' }

    TwoFactorRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
          description: >-
            Single-use. Each substitutes for the 6-digit code at login, and is
            the only way back in if the authenticator is lost. Shown once.
    TwoFactorRecoveryCodesResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TwoFactorRecoveryCodes' }
    Me:
      allOf:
        - { $ref: '#/components/schemas/UserRef' }
        - type: object
          properties:
            username: { type: string }
            email: { type: string, format: email }
            permissions: { type: array, items: { type: string } }
            projectIds: { type: array, items: { type: integer, format: int64 } }
            reporteeIds: { type: array, items: { type: integer, format: int64 } }
            timezone: { type: string, examples: ['Asia/Kolkata'] }
    MeResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Me' }

    # ── users ─────────────────────────────────────────────────────────────
    User:
      allOf:
        - { $ref: '#/components/schemas/UserRef' }
        - type: object
          properties:
            username: { type: string }
            email: { type: string, format: email }
            employeeCode: { type: string }
            department: { type: [string, 'null'] }
            designation: { type: [string, 'null'] }
            reportingManager: { $ref: '#/components/schemas/UserRef' }
            projectIds:
              type: array
              items: { type: integer, format: int64 }
              description: |
                Retained for callers that only need membership. Prefer
                `projects` — an id cannot be rendered without a second lookup.
            projects:
              type: array
              items: { $ref: '#/components/schemas/ProjectRef' }
              description: |
                Resolved server-side so the S-07 grid can print project names
                without a second request per row.
            isActive: { type: boolean }
            openTicketCount: { type: integer }
            lastLoginAt:
              type: [string, 'null']
              format: date-time
              description: UTC, like every stored instant. Null until the first login.
            createdAt: { type: string, format: date-time }
    ProjectRoleCode:
      type: string
      enum: [PM, DEVELOPER, SUPPORT, QA, DEPLOYMENT, VIEWER]
      description: |
        A resource's role **on one project**, which may differ from their global
        `RoleCode`: a Developer globally can be mapped as QA on one project.

        **Deliberately not `RoleCode`**, and it differs in both directions.
        `VIEWER` exists here and not there — read-only access to one project is a
        per-project grant, and a global viewer role would mean read-only access to
        everything, which is the opposite thing. `ADMIN` exists there and not here
        — an Admin already sees every project through `ScopeResolver`, so an
        `ADMIN` membership would be a grant that changes nothing, and a grant that
        changes nothing is one somebody later assumes does something.

        Blueprint §7.4 S-10 names these six as "PM / Dev / Support / QA / Deploy /
        Viewer". `ck_project_members_role` holds the same set in the database.
    ProjectAssignment:
      type: object
      required: [projectId]
      description: |
        One `project_members` row, as the S-08 Projects section reads and writes
        it. Ids only — the names are already in `User.projects`, and repeating
        them here would make the two disagree the moment a project is renamed.
      properties:
        projectId: { type: integer, format: int64 }
        roleInProject:
          $ref: '#/components/schemas/ProjectRoleCode'
    UserWriteRequest:
      type: object
      required: [displayName, username, email, employeeCode, role]
      description: |
        The S-08 form, as one body. Used by both `POST /users` and
        `PATCH /users/{userId}`.

        **The five required fields are required on the `PATCH` too**, and are the
        five S-08 marks with an asterisk that map to `NOT NULL` columns. They have
        no "absent" state to model: the form always holds a value for each, and a
        `PATCH` that could omit `username` would need a rule for what an empty
        username means, which is a rule with no correct answer.

        **Every other key is absent-means-leave-alone**, and where the column is
        nullable an explicit `null` means "clear it". The distinction is
        load-bearing for `reportingManagerId`: "I am not editing their manager"
        and "detach them from their manager, who has left" are different
        intentions, and one sentinel cannot carry both.

        **No password field, on either verb.** S-08 specifies the temporary
        password as auto-generated, and there is no route by which an admin sets
        somebody else's password directly — a password only its holder has ever
        typed is the property that makes `mustChangePassword` mean anything.
      properties:
        # ── Personal ──────────────────────────────────────────────────────
        displayName: { type: string, minLength: 1, maxLength: 120 }
        employeeCode: { type: string, minLength: 1, maxLength: 20 }
        email: { type: string, format: email, maxLength: 150 }
        mobile:
          type: [string, 'null']
          maxLength: 20
          pattern: '^[0-9+][0-9 ()-]{5,19}$'
        avatarUrl:
          type: [string, 'null']
          maxLength: 500
          description: Profile photo. A URL into attachment storage, not a blob.
        dateOfJoining:
          type: [string, 'null']
          format: date
          description: A calendar date with no instant attached — never a `date-time`.

        # ── Access ────────────────────────────────────────────────────────
        username: { type: string, minLength: 3, maxLength: 50 }
        role: { $ref: '#/components/schemas/RoleCode' }
        isActive:
          type: boolean
          description: |
            Defaults to `true` on create. On update, **setting this `false` for
            somebody holding open tickets is refused with `409`**, exactly as
            `PATCH /users/{userId}/status` is — the form must not be a way around
            the guard the status route enforces.

        # ── Org ───────────────────────────────────────────────────────────
        department: { type: [string, 'null'], maxLength: 80 }
        designation: { type: [string, 'null'], maxLength: 80 }
        reportingManagerId:
          type: [integer, 'null']
          format: int64
          description: |
            Rejected with `409` (`type: manager-cycle`) if it would create a
            cycle at any depth — self-reference included, which is the one case
            the database trigger also catches. B-012.
        location: { type: [string, 'null'], maxLength: 120 }
        timezone:
          type: string
          maxLength: 50
          examples: ['Asia/Kolkata']
          description: Display only. Storage is UTC everywhere (PLAN.md §3.1).

        # ── Work ──────────────────────────────────────────────────────────
        dailyCapacityHrs:
          type: number
          format: double
          minimum: 0.5
          maximum: 24
          default: 8
          description: Feeds every utilisation figure, through B-024.
        weeklyOff:
          type: [array, 'null']
          items: { type: integer, minimum: 1, maximum: 7 }
          maxItems: 6
          uniqueItems: true
          description: |
            ISO-8601 day numbers, **1=Mon … 7=Sun**. `0` is not a day — see the
            note on `GET /masters/working-calendar` for what a second numbering
            cost once already.

            `null` means "inherit the org working week", which is the default for
            everybody. `[]` is a different answer — this person has no weekly off,
            which a support rota is a real reason to want.
          examples: [[6, 7]]
        skills:
          type: [array, 'null']
          items: { type: string, minLength: 1, maxLength: 60 }
          maxItems: 30
          uniqueItems: true

        # ── Projects ──────────────────────────────────────────────────────
        projects:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ProjectAssignment' }
          description: |
            The complete membership set — **sent whole, not as a delta.** An
            absent key leaves memberships untouched; a present one replaces them,
            and a project dropped from the list is deactivated rather than
            deleted, so the historical assignment survives.

            Replaced `projectIds: int64[]` in B-011. That shape could not carry
            the per-project role S-08 requires and `project_members.role_in_project`
            has always had a column for. Breaking, and safe to break: no shipped
            client sent it.
    # `UserResponse` (`{ data: User }`) was here and is gone. Both writes now
    # answer with `UserDetail`, and it had no other reference — a schema kept
    # "in case" is one the next reader has to work out the status of.
    UserDetail:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          description: |
            Everything `User` has, plus the S-08 fields only the form reads.

            Kept off `User` rather than added to it with a note that the list
            leaves them null. `listUsers` returns up to 200 of these; carrying a
            skills array and a membership list on every grid row would be paid on
            every page of a screen that shows none of it — and a field that is
            "usually absent" is one every consumer has to defend against.
          properties:
            mobile: { type: [string, 'null'] }
            avatarUrl: { type: [string, 'null'] }
            dateOfJoining: { type: [string, 'null'], format: date }
            location: { type: [string, 'null'] }
            timezone: { type: string }
            dailyCapacityHrs: { type: number, format: double }
            weeklyOff:
              type: [array, 'null']
              items: { type: integer, minimum: 1, maximum: 7 }
              description: '`null` means the org working week applies.'
            skills: { type: array, items: { type: string } }
            projectAssignments:
              type: array
              items: { $ref: '#/components/schemas/ProjectAssignment' }
              description: |
                The per-project roles behind `projects`. Same rows, carrying the
                one field `ProjectRef` deliberately does not.
            mustChangePassword:
              type: boolean
              description: |
                Still holding the temporary password. Shown on the form so an
                admin can tell "never logged in" from "logged in and has not been
                active", which `lastLoginAt` alone cannot distinguish from a
                reactivated account.
    UserDetailResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/UserDetail' } }
    UserCreatedResponse:
      type: object
      required: [data, meta]
      description: |
        `POST /users` only. Its own schema so that `temporaryPassword` lives on a
        type no read operation returns — the strongest available guarantee that a
        credential cannot appear in a list.
      properties:
        data: { $ref: '#/components/schemas/UserDetail' }
        meta:
          type: object
          required: [temporaryPassword]
          properties:
            temporaryPassword:
              type: string
              description: |
                Readable exactly once, here. Stored as an Argon2id hash, so no
                later request can recover it; an admin who loses it issues a
                reset. The account is created with `mustChangePassword` set, so
                this password survives precisely one login.
    UserListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        meta: { $ref: '#/components/schemas/Meta' }
    BulkUserStatusRequest:
      type: object
      required: [userIds, isActive]
      properties:
        userIds:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 200
          description: |
            Capped at the pagination maximum: a selection is made on a page, so
            a larger one did not come from the grid.
        isActive: { type: boolean }
        reason: { type: string, maxLength: 500 }
    BulkUserStatusOutcome:
      type: object
      required: [userId, outcome]
      properties:
        userId: { type: integer, format: int64 }
        displayName: { type: [string, 'null'] }
        outcome:
          type: string
          enum: [CHANGED, UNCHANGED, BLOCKED_OPEN_TICKETS, NOT_FOUND]
          description: |
            `UNCHANGED` means the resource was already in the requested state —
            reported rather than counted as a change, so the summary line does
            not overstate what happened.
        openTicketCount:
          type: [integer, 'null']
          description: Present only on `BLOCKED_OPEN_TICKETS`.
    BulkUserStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [results, changed, unchanged, blocked, notFound]
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/BulkUserStatusOutcome' } }
            changed: { type: integer }
            unchanged: { type: integer }
            blocked: { type: integer }
            notFound: { type: integer }
            reassignUrl: { type: string, examples: ['/api/v1/tickets/bulk-reassign'] }
    Profile360Response:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [person, from, to, openNow, closedInWindow]
          properties:
            person: { $ref: '#/components/schemas/Profile360Person' }
            from:
              type: string
              format: date
              description: >
                A-069 · the window every figure below covers, except openNow.
                Stated because the original shape named its fields "thisMonth"
                and carried no range, which left the screen captioning a period
                the server had chosen and the client could not name.
            to: { type: string, format: date }
            openNow:
              type: integer
              description: Open right now — the one current figure, not measured over the window.
            closedInWindow: { type: integer }
            effortHours: { type: [number, 'null'], format: double }
            slaCompliancePct:
              type: [number, 'null']
              format: double
              description: >
                Against tickets that carried a planned close date, never against
                everything closed — a ticket with no commitment can neither meet
                nor breach one. Null when none did, rather than 0, which would
                read as "nothing was on time".
            reworkRatePct:
              type: [number, 'null']
              format: double
              description: Closed tickets that had been reopened at least once, over closed. Null when nothing closed.
            currentStages:
              type: array
              description: >
                How much open work sits at each ribbon stage, busiest first. A
                count rather than the original list of stage codes: a manager
                opening this needs to see that eleven of fourteen are stuck in
                one stage, which a list of names does not say.
              items: { $ref: '#/components/schemas/Profile360StageLoad' }
    Profile360Person:
      type: object
      required: [id, fullName, role]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        username: { type: string }
        email: { type: string }
        role: { type: string }
        department: { type: [string, 'null'] }
        designation: { type: [string, 'null'] }
        active: { type: boolean }
        joinedOn: { type: [string, 'null'], format: date }
        managerName:
          type: [string, 'null']
          description: >
            By name, never by id. The screen shows it and does not link to it —
            a link would be a second profile the viewer may not be entitled to,
            and resolving that is a permission check a header should not make.
    Profile360StageLoad:
      type: object
      required: [stage, openCount]
      properties:
        stage: { type: string }
        openCount: { type: integer }

    # ── projects ──────────────────────────────────────────────────────────
    ProjectRef:
      type: object
      required: [id, projectCode, name]
      description: |
        The label half of `Project`, for embedding. Kept to four fields for the
        reason `UserRef` gives — it is inlined wherever a project is named, so
        anything more becomes weight in every schema that references it.
      properties:
        id: { type: integer, format: int64 }
        projectCode: { type: string }
        name: { type: string }
        colourTag: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
    ProjectStatus:
      type: string
      enum: [ACTIVE, ON_HOLD, CLOSED]
      description: |
        Blueprint S-10's three states, and the whole vocabulary — the column has
        a `CHECK` to that effect since B-016.

        There is no delete. A project that issued ticket IDs cannot be removed
        without orphaning them, so `CLOSED` is the retirement path, exactly as
        deactivation is for a resource.
    Project:
      type: object
      # `status` and `isActive` are populated by every projects operation and are
      # deliberately **not** in `required`. `Ticket.project` embeds this whole
      # schema rather than `ProjectRef` — Stream C's call, and not one to relitigate
      # from here — so a new required property would land as a new obligation on
      # every ticket payload the tickets feature serves, for a field no ticket
      # consumer reads. Optional here, always present in practice, and pinned by
      # `ProjectMasterIT` on the operations that owe it.
      required: [id, projectCode, name]
      properties:
        id: { type: integer, format: int64 }
        projectCode:
          type: string
          description: Ticket-ID prefix. Immutable once the project has issued one.
        name: { type: string }
        clientName:
          type: [string, 'null']
          description: |
            The denormalised label from blueprint §8.2 — free text, and the
            fallback for a project with no row in `clients`. The real client link
            arrives with B-026; this column is not it.
        projectManager: { $ref: '#/components/schemas/UserRef' }
        colourTag: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        isActive:
          type: boolean
          description: |
            `status <> 'CLOSED'`, derived. Kept because five screens have always
            filtered on it; see `listProjects` for why it is not
            `status = 'ACTIVE'`.
        autoAssignRule: { $ref: '#/components/schemas/AutoAssignRule' }
    ProjectDetail:
      allOf:
        - { $ref: '#/components/schemas/Project' }
        - type: object
          required: [ticketsIssued]
          properties:
            description: { type: [string, 'null'] }
            ticketsIssued:
              type: integer
              format: int64
              description: |
                `projects.ticket_seq` — how many ticket IDs this prefix has
                issued. **Non-zero is what makes `projectCode` immutable**, so
                the form reads it to disable the field rather than letting the
                refusal arrive on save.
    AutoAssignRule:
      type: string
      enum: [ROUND_ROBIN, LEAST_LOADED, MANUAL]
      default: MANUAL
      description: |
        Who a new ticket goes to when nobody is named. **The Settings tab that
        edits this is B-019**; B-016 stores and returns it so that the field is
        answered honestly in the meantime — the alternative was returning a
        constant no client could tell from a stored value.
    ProjectWriteRequest:
      type: object
      required: [projectCode, name, projectManagerId]
      description: |
        `projectManagerId` is required, per S-10's asterisk. A project with no
        manager has nobody for the SLA engine to escalate to — Stream D's
        scanners already log a warning and give up when they cannot find one.

        **`allowedTaskTypeIds` is deliberately not here.** It was, and nothing
        ever sent it: it is a join table rather than a project column, and it
        belongs to B-019's Settings tab alongside mandatory fields, where it
        will arrive as its own sub-resource. Accepting it on this shape would
        have meant taking a list and storing nothing, which is how a save looks
        like it worked and did not.
      properties:
        projectCode:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
          description: Upper-cased server-side. Unique; ten characters, because it prefixes every ticket ID.
        name: { type: string, minLength: 1, maxLength: 150 }
        clientName: { type: [string, 'null'], maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 1000 }
        projectManagerId: { type: integer, format: int64 }
        colourTag: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        startDate: { type: [string, 'null'], format: date }
        endDate:
          type: [string, 'null']
          format: date
          description: Target end date. Rejected with `400` if it precedes `startDate`.
        status: { $ref: '#/components/schemas/ProjectStatus' }
        autoAssignRule: { $ref: '#/components/schemas/AutoAssignRule' }
    ProjectPatchRequest:
      type: object
      description: |
        Every field optional; an omitted one keeps its stored value, an explicit
        `null` clears a nullable one.

        **`projectCode` is here and `RolePatchRequest`'s `code` is not**, which
        is not an inconsistency: a role code is immutable from creation, while a
        project code is editable right up until the project issues its first
        ticket ID. So it has to be sendable — and once the project is live,
        sending a *different* one is the `409` the operation describes while
        sending the *same* one stays a no-op, because S-10 submits the whole form
        on every save.
      properties:
        projectCode: { type: string, pattern: '^[A-Z][A-Z0-9]{1,9}$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        clientName: { type: [string, 'null'], maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 1000 }
        projectManagerId: { type: integer, format: int64 }
        colourTag: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        autoAssignRule: { $ref: '#/components/schemas/AutoAssignRule' }
    ProjectDetailResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/ProjectDetail' } }
    ProjectListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Project' } }
        meta: { $ref: '#/components/schemas/Meta' }
    ProjectMember:
      type: object
      required: [userId, displayName, role, isActive, addedAt]
      description: |
        One active `project_members` row, as the S-10 Team tab renders it.

        Carries the person's name and **global** role as well as their project
        role, because the tab's whole job is showing where the two differ — a
        Developer mapped as QA on this project is the case the column exists
        for, and a roster showing only one of the two cannot express it.
      properties:
        userId: { type: integer, format: int64 }
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        role:
          $ref: '#/components/schemas/RoleCode'
          description: Their **global** role, from `users.role_id`.
        projectRole:
          oneOf:
            - { $ref: '#/components/schemas/ProjectRoleCode' }
            - { type: 'null' }
          description: |
            Their role **on this project**. `null` means "same as their global
            role", which is the common case — a required value here would make
            every membership restate the person's role, and the first time
            somebody's global role changed, every restatement would be a stale
            override nobody knew was there.
        allocationPct:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: |
            Percent of this resource's capacity committed to this project.

            **`null` means not stated, and is not 100.** Every row written
            before B-017 — B-011's resource form, B-007's fixture corpus — has
            no allocation because no screen had an input for one, and
            backfilling those to a full allocation would tell B-061's capacity
            report that a resource on three projects is committed at 300%.
        isActive:
          type: boolean
          description: |
            The **resource's** status, not the membership's — a deactivated
            membership is not returned at all. A leaver still on the team is
            what the tab needs to show, since that is what B-014's reassignment
            flow exists to clear up.
        openTicketCount:
          type: integer
          description: |
            Open tickets this member holds **on this project**. It is what makes
            the removal refusal predictable: the number is on screen before the
            click, the way B-014 put it on the resource grid.
        addedAt: { type: string, format: date-time }
    ProjectMemberResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/ProjectMember' } }
    ProjectMemberListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } }
    ProjectMemberWrite:
      type: object
      required: [userId]
      description: |
        Add one resource to the team.

        **`projectRole` is optional**, unlike the first draft of this operation,
        which required it and typed it as `RoleCode`. That enum was wrong in
        both directions: it contains `ADMIN`, which `ck_project_members_role`
        refuses — so the contract permitted a value that could only arrive as a
        500 — and it lacks `VIEWER`, which S-10 names and this screen has to
        offer. `ProjectRoleCode` exists for exactly this and B-011 already
        writes the column through it.
      properties:
        userId: { type: integer, format: int64 }
        projectRole:
          oneOf:
            - { $ref: '#/components/schemas/ProjectRoleCode' }
            - { type: 'null' }
        allocationPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
    ProjectMemberPatch:
      type: object
      description: |
        Both fields optional and both nullable, and the difference matters:
        omitted keeps the stored value, explicit `null` clears it. Clearing is
        the only way back to "same as their global role" and to "not stated",
        and a shape that could not express it would make both states
        write-once.
      properties:
        projectRole:
          oneOf:
            - { $ref: '#/components/schemas/ProjectRoleCode' }
            - { type: 'null' }
        allocationPct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
    SlaPolicyWrite:
      type: object
      description: |
        One project-level override — a `sla_policies` row with this project's id
        and a task type. `PUT` takes an array of these.

        **`escalateToL1` / `escalateToL2` are flags, not recipients.** An earlier
        draft of this schema carried `l1EscalationUserId` / `l2EscalationUserId`,
        which the table cannot store and the escalation scanner does not want:
        the columns are `escalate_to_l1` / `escalate_to_l2`, and who each level
        *means* is fixed — L1 the assignee's reporting manager, L2 that
        manager's manager (§6's 48-hour rule). The matrix only says whether the
        level applies to this kind of ticket on this project, so a project can
        decide a Low change request wakes nobody without also having to decide
        who that nobody would have been. Naming a recipient here would store the
        reporting chain twice, in two places that can disagree.
      required: [taskTypeId, level, resolutionHrs]
      properties:
        taskTypeId:
          type: integer
          format: int32
          description: '`task_types.id` — an `INT`, not a `BIGINT`.'
        level: { $ref: '#/components/schemas/Level' }
        responseHrs:
          type: [number, 'null']
          format: double
          exclusiveMinimum: 0
          maximum: 9999.99
          description: |
            Working hours to first response. Nullable — the column is, and a
            policy that only targets resolution is a real one. Must not exceed
            `resolutionHrs`.
        resolutionHrs:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 9999.99
          description: |
            Working hours to resolution. **Exclusive minimum**, not `0`:
            `SlaResolution.hasTarget()` treats a non-positive figure as no
            target at all, so a stored zero is a policy that reads as configured
            on this screen and behaves as absent everywhere else.
        escalateToL1: { type: boolean, default: true }
        escalateToL2: { type: boolean, default: false }
    SlaPolicyCell:
      type: object
      description: |
        One cell of the resolved matrix. `GET` returns the full task type ×
        level grid — every cell, whether or not this project has a row for it —
        because the screen has to show what a ticket would actually get, and a
        response carrying only the overrides would render as a mostly empty grid
        that is indistinguishable from an unconfigured product.

        `taskTypeName` rides along so the grid can label its rows. There is no
        mounted `/masters/task-types` yet (B-020), and a matrix that renders
        "task type 7" is not a screen.
      required: [taskTypeId, taskTypeName, level, source, isOverride]
      properties:
        taskTypeId: { type: integer, format: int32 }
        taskTypeCode: { type: string }
        taskTypeName: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        responseHrs: { type: [number, 'null'], format: double }
        resolutionHrs:
          type: [number, 'null']
          format: double
          description: 'Null only when `source` is `NONE` — nothing in the product has a figure for this cell.'
        escalateToL1: { type: boolean }
        escalateToL2: { type: boolean }
        # C-012's enum, reused rather than restated. The matrix and the
        # planned-close-date preview are two views of one resolution, and a
        # second six-value enum saying the same thing is how they end up
        # describing it differently. Its own description already anticipates
        # this screen: "the only way someone editing the SLA matrix can see
        # which row is being applied".
        #
        # Only `PROJECT_TASK_TYPE` is a cell this screen wrote. Everything else
        # is inherited, and re-sending an inherited cell as an override is what
        # would silently detach the project from the rung it inherits from —
        # see `isOverride` and the `PUT` description.
        source: { $ref: '#/components/schemas/SlaSource' }
        isOverride:
          type: boolean
          description: |
            `source == PROJECT_TASK_TYPE` — this project has its own row for the
            cell. Derived, and on the wire anyway: it is the one thing every
            client branches on, and re-deriving an enum comparison in each of
            them is how a seventh source value later reads as an override in one
            place and not another.
    SlaPolicyListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SlaPolicyCell' } }

    TicketFieldCode:
      type: string
      enum:
        - DESCRIPTION
        - MODULE
        - SCREEN_NAME
        - FEATURE
        - STEPS_TO_GENERATE
        - CLIENT
        - CLIENT_CONTACT
        - ASSIGNEE
        - ESTIMATED_HRS
        - PLANNED_CLOSE_DATE
      description: |
        A ticket field a project may require, and **the list is exactly the
        fields `TicketCreateRequest` leaves optional**. `projectId`, `title`,
        `taskTypeId` and `level` are required of every ticket regardless, so
        they are absent here — a checkbox that cannot change the outcome is a
        control that lies about what it does.

        `MODULE` is worth naming: §7.5 already calls it "mandatory on the form
        for bug-type task types", so a project that requires it for *every* task
        type is tightening a rule that already exists rather than inventing one.

        The vocabulary is enforced by the server and by this enum, not by a
        database `CHECK`. `projects.mandatory_fields` constrains shape — a
        unique array of uppercase codes — deliberately: the list tracks Stream
        C's create form, and pinning the values in the schema would mean C
        cannot add a form field without a masters migration.
    ProjectSettingsTaskType:
      type: object
      required: [taskTypeId, name, isAllowed, isActive]
      description: |
        One row of the allow-list, as the checkbox grid renders it.

        **Every active task type, plus any inactive one this project still
        allows.** The second half is not tidiness: the `PUT` is a wholesale
        replace assembled from these rows, so a retired task type that was
        allowed and is not rendered would be dropped by the next save through a
        screen that never showed it. That is the failure
        `replaceSlaPolicies` guards against for project-level defaults, one
        master over. An inactive row carries `isActive: false` so the screen can
        label it rather than silently offering a type no new ticket can use.
      properties:
        taskTypeId: { type: integer, format: int32 }
        code: { type: string }
        name: { type: string }
        isAllowed:
          type: boolean
          description: |
            True for every row when `restrictsTaskTypes` is false. That is not
            padding — an unrestricted project really does allow all of them, and
            a client rendering checkboxes needs the same answer either way.
        isActive:
          type: boolean
          description: |
            `task_types.is_active`. False only on a retired type this project
            still has a row for; an unrestricted project never shows one,
            because "all active types" is what it means.
    ProjectSettings:
      type: object
      required: [projectId, autoAssignRule, mandatoryFields, restrictsTaskTypes, taskTypes]
      description: S-10's Settings tab as one document — see `getProjectSettings`.
      properties:
        projectId: { type: integer, format: int64 }
        autoAssignRule: { $ref: '#/components/schemas/AutoAssignRule' }
        mandatoryFields:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/TicketFieldCode' }
        restrictsTaskTypes:
          type: boolean
          description: |
            Whether this project has an allow-list at all. False means every
            active task type may be raised, which is the state every project
            created before this screen is in — **not** "no task type may be
            raised". Derived from `project_task_types` being empty, and on the
            wire because a client cannot tell an unrestricted project from one
            that ticked every box otherwise, and the two differ the moment an
            Admin adds a twelfth task type.
        taskTypes:
          type: array
          items: { $ref: '#/components/schemas/ProjectSettingsTaskType' }
    ProjectSettingsResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/ProjectSettings' } }
    ProjectSettingsWrite:
      type: object
      required: [autoAssignRule, mandatoryFields, allowedTaskTypeIds]
      description: |
        All three settings, always. Every field is required even though the
        screen may have changed one of them: this is a wholesale replace behind
        one `If-Match`, and an optional field on a replace is ambiguous between
        "leave it alone" and "clear it" in exactly the way that loses somebody's
        setting quietly.
      properties:
        autoAssignRule: { $ref: '#/components/schemas/AutoAssignRule' }
        mandatoryFields:
          type: array
          uniqueItems: true
          maxItems: 20
          items: { $ref: '#/components/schemas/TicketFieldCode' }
          description: 'Empty is normal — a project requiring nothing beyond the always-required fields.'
        allowedTaskTypeIds:
          type: array
          uniqueItems: true
          maxItems: 200
          items: { type: integer, format: int32 }
          description: |
            **Empty means unrestricted, not empty.** See the `PUT` description:
            a project that allowed no task type could raise no ticket, so the
            state does not exist and the request that would express it is the
            one that removes the restriction instead.

            Ids are checked for existence, not for activity. A deactivated task
            type already on the list stays sendable — refusing it would make the
            row uneditable through the only screen that can see it, which is the
            call `replaceSlaPolicies` makes about the same master.

    # ── tickets ───────────────────────────────────────────────────────────
    Ticket:
      type: object
      required: [ticketId, title, level, status, cycleNo]
      properties:
        ticketId: { $ref: '#/components/schemas/TicketId' }
        title: { type: string }
        description: { type: string }
        project: { $ref: '#/components/schemas/Project' }
        client: { $ref: '#/components/schemas/ClientRef' }
        clientContactId: { type: [integer, 'null'], format: int64 }
        isClientRaised: { type: boolean }
        taskTypeId: { type: integer, format: int64 }
        moduleId:
          type: [integer, 'null']
          format: int64
          description: |
            The product module the concern was raised against (§7.5). Resolve the
            name through `GET /masters/modules` rather than expecting it inline —
            the master is small, cached, and includes deactivated rows precisely
            so an old ticket's module still has a name.
        screenName: { type: [string, 'null'], maxLength: 120 }
        feature: { type: [string, 'null'], maxLength: 120 }
        stepsToGenerate:
          type: [string, 'null']
          maxLength: 20000
          description: |
            **Sanitised HTML**, per PLAN.md §3.9 — render it through a sanitiser
            client-side as well. The server sanitises on write, but a row written
            before the allow-list was last tightened is only protected if the
            renderer applies today's list too.
        level: { $ref: '#/components/schemas/Level' }
        originalLevel:
          $ref: '#/components/schemas/Level'
          description: Set once at creation and never overwritten — see `PATCH .../priority`.
        status: { $ref: '#/components/schemas/StatusCode' }
        currentStageCode: { type: [string, 'null'] }
        assignee: { $ref: '#/components/schemas/UserRef' }
        reportedBy: { $ref: '#/components/schemas/UserRef' }
        cycleNo:
          type: integer
          minimum: 1
          description: Increments on reopen after closure. Independent of `iterationNo`.
        iterationNo:
          type: integer
          minimum: 1
          description: Increments on a backward move within the current cycle. Independent of `cycleNo`.
        reopenCount: { type: integer }
        plannedCloseDate: { type: [string, 'null'], format: date-time }
        actualCloseDate: { type: [string, 'null'], format: date-time }
        isDelayed: { type: boolean }
        delayedSince: { type: [string, 'null'], format: date-time }
        totalEffortHrs: { type: number, format: double }
        estimatedHrs: { type: [number, 'null'], format: double }
        pctComplete: { type: integer, minimum: 0, maximum: 100 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TicketCreateRequest:
      type: object
      required: [projectId, title, taskTypeId, level]
      properties:
        projectId: { type: integer, format: int64 }
        title: { type: string, minLength: 3, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        taskTypeId: { type: integer, format: int64 }
        moduleId:
          type: [integer, 'null']
          format: int64
          description: |
            Optional here, and **mandatory on the form for bug-type task types**
            (§7.5). The rule lives in the form rather than the contract because a
            change request may genuinely span three modules, and a draft is saved
            precisely because the answer is not known yet.
        screenName: { type: [string, 'null'], maxLength: 120 }
        feature: { type: [string, 'null'], maxLength: 120 }
        stepsToGenerate: { type: [string, 'null'], maxLength: 20000, description: 'Sanitised HTML — PLAN.md §3.9.' }
        level: { $ref: '#/components/schemas/Level' }
        clientId: { type: [integer, 'null'], format: int64 }
        clientContactId: { type: [integer, 'null'], format: int64 }
        isClientRaised: { type: boolean, default: false }
        assigneeId: { type: [integer, 'null'], format: int64 }
        watcherIds: { type: array, items: { type: integer, format: int64 } }
        estimatedHrs: { type: [number, 'null'], format: double }
        plannedCloseDate:
          type: [string, 'null']
          format: date-time
          description: |
            Omit to have it computed from the SLA policy against the working
            calendar. Supplying it requires PM or Admin.
        saveAsDraft: { type: boolean, default: false }
    TicketPatchRequest:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        moduleId: { type: [integer, 'null'], format: int64 }
        screenName: { type: [string, 'null'], maxLength: 120 }
        feature: { type: [string, 'null'], maxLength: 120 }
        stepsToGenerate: { type: [string, 'null'], maxLength: 20000, description: 'Sanitised HTML — PLAN.md §3.9.' }
        estimatedHrs: { type: [number, 'null'], format: double }
        pctComplete: { type: integer, minimum: 0, maximum: 100 }
        watcherIds: { type: array, items: { type: integer, format: int64 } }
        plannedCloseDate: { type: [string, 'null'], format: date-time }
        plannedCloseDateReason:
          type: string
          description: Mandatory when moving the date after assignment; PM and Admin only.
    QuickUpdateRequest:
      type: object
      description: |
        Deliberately narrow. It must **not** expose ticket ID, reported by,
        assigned by, date reported, cycle history, the ribbon, prior effort logs,
        project, or level unless the caller is a PM — the whole point is two
        clicks, not a second detail page.
      properties:
        status: { $ref: '#/components/schemas/StatusCode' }
        effortHours: { type: number, format: double, minimum: 0, maximum: 24 }
        effortDate: { type: string, format: date }
        workNote: { type: string, maxLength: 4000 }
        pctComplete: { type: integer, minimum: 0, maximum: 100 }
        revisedEta: { type: [string, 'null'], format: date-time }
        revisedEtaReason: { type: string, maxLength: 500 }
        attachmentIds: { type: array, items: { type: integer, format: int64 } }
    CloseRequest:
      type: object
      required: [resolutionSummary]
      properties:
        resolutionSummary: { type: string, minLength: 3, maxLength: 4000 }
        rootCauseCategory: { type: string, maxLength: 100 }
        actualCloseDate: { type: [string, 'null'], format: date-time }
        finalEffortHours: { type: [number, 'null'], format: double }
        requestClientVerification: { type: boolean, default: false }
    ReopenRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
        restartStageCode: { type: string, default: TRIAGE }
        assigneeId: { type: [integer, 'null'], format: int64 }
        plannedCloseDate: { type: [string, 'null'], format: date-time }
        estimatedHrs: { type: [number, 'null'], format: double }
    SlaSource:
      type: string
      description: |
        Which rung of the resolution ladder answered — see
        `previewPlannedCloseDate`. Carried onto the wire so a planned close date
        is explicable: "16 working hours, this project's Production Bug × High
        policy" is checkable where a bare date is not, and it is the only way
        someone editing the SLA matrix can see which row is being applied.
      enum: [PROJECT_TASK_TYPE, PROJECT_LEVEL, ORG_DEFAULT, PRIORITY_DEFAULT, TASK_TYPE_DEFAULT, NONE]
    PlannedCloseDatePreview:
      type: object
      required: [from, source]
      properties:
        from:
          type: string
          format: date-time
          description: |
            The instant the clock started. Echoed back because the caller may
            have omitted it, and "computed from now" needs a *which* now to be
            checkable.
        plannedCloseDate:
          type: [string, 'null']
          format: date-time
          description: |
            Null when `source` is `NONE`. The ticket genuinely has no planned
            close date, and the form must say so rather than showing a blank.
        firstResponseDue:
          type: [string, 'null']
          format: date-time
          description: |
            Null unless the rung that answered carries a response target. The two
            master defaults hold one figure each, and deriving a response target
            from a resolution one would put a commitment on screen that no
            administrator typed.
        responseHrs: { type: [number, 'null'], format: double, description: '**Working** hours, not elapsed.' }
        resolutionHrs: { type: [number, 'null'], format: double, description: '**Working** hours, not elapsed.' }
        source: { $ref: '#/components/schemas/SlaSource' }
        slaPolicyId:
          type: [integer, 'null']
          format: int64
          description: The `sla_policies` row, or null where a master default answered instead.
    PlannedCloseDateResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/PlannedCloseDatePreview' } }
    TicketResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Ticket' } }
    TicketSummary:
      type: object
      description: |
        D-061 · one **row** of S-17, not one ticket.

        `GET /tickets` returns this rather than `Ticket`, and the difference is
        deliberate: the list renders 25 rows at a time, and `description` plus
        `stepsToGenerate` are sanitised HTML that can run to kilobytes each. A
        list that shipped them would be slower than the request waterfall A-052
        exists to remove, and no column on S-17 displays either. The detail page
        reads `GET /tickets/{ticketId}/full`, which carries everything.

        **Every name here is `Ticket`'s name for the same thing.** This is a
        strict subset, never a rename — `ticketId` is the ticket code, exactly
        as it is on the path and in the other ~30 operations that take it. A row
        shape with its own vocabulary is what produced the blank ID column on
        S-17: the server answered `ticketCode`/`assignedTo`, the generated
        client bound `ticketId`/`assignee`, and both were internally consistent
        while the grid rendered empty cells against a green build. D-062 now
        fails the build on exactly that.

        Embedded refs rather than bare ids, again matching `Ticket`: the grid
        prints "CRM — Client CRM Platform" and an assignee's name and avatar, so
        ids would push a second lookup into every consumer — the list, the S-06
        drill-down and the CSV export — to save four joins on a 25-row page.
      required: [ticketId, title, level, status, cycleNo, isDelayed, createdAt]
      properties:
        ticketId: { $ref: '#/components/schemas/TicketId' }
        title: { type: string }
        project: { $ref: '#/components/schemas/Project' }
        client: { $ref: '#/components/schemas/ClientRef' }
        clientContactId: { type: [integer, 'null'], format: int64 }
        isClientRaised: { type: boolean }
        taskTypeId: { type: integer, format: int64 }
        moduleId: { type: [integer, 'null'], format: int64 }
        level: { $ref: '#/components/schemas/Level' }
        originalLevel: { $ref: '#/components/schemas/Level' }
        status: { $ref: '#/components/schemas/StatusCode' }
        currentStageCode: { type: [string, 'null'] }
        assignee: { $ref: '#/components/schemas/UserRef' }
        reportedBy: { $ref: '#/components/schemas/UserRef' }
        cycleNo: { type: integer }
        iterationNo: { type: integer }
        reopenCount: { type: integer }
        isReopened: { type: boolean }
        dateReported: { type: string, format: date-time }
        plannedCloseDate: { type: [string, 'null'], format: date-time }
        actualCloseDate: { type: [string, 'null'], format: date-time }
        isDelayed: { type: boolean }
        delayedSince: { type: [string, 'null'], format: date-time }
        estimatedHrs: { type: [number, 'null'], format: double }
        totalEffortHrs: { type: number, format: double }
        commentCount: { type: integer }
        attachmentCount: { type: integer }
        createdAt: { type: string, format: date-time }
    TicketListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TicketSummary' } }
        meta: { $ref: '#/components/schemas/Meta' }
    TicketDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [ticket]
          properties:
            ticket: { $ref: '#/components/schemas/Ticket' }
            cycles: { type: array, items: { $ref: '#/components/schemas/Cycle' } }
            ribbon: { $ref: '#/components/schemas/Ribbon' }
            history: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
            effortLogs: { type: array, items: { $ref: '#/components/schemas/EffortLog' } }
            comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
            attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
            watchers: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
            availableActions:
              type: array
              items: { type: string }
              description: |
                What this caller may do right now, decided server-side. The client
                renders buttons from this rather than re-deriving permissions —
                two implementations of the same rule always diverge.
    Cycle:
      type: object
      properties:
        cycleNo: { type: integer }
        isSealed: { type: boolean }
        startedAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }
        totalEffortHrs: { type: number, format: double }
    BulkResultResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            succeeded: { type: integer }
            failed: { type: integer }
            results:
              type: array
              items:
                type: object
                properties:
                  ticketId: { $ref: '#/components/schemas/TicketId' }
                  ok: { type: boolean }
                  reason: { type: [string, 'null'] }

    # ── history & effort ──────────────────────────────────────────────────
    HistoryEntry:
      type: object
      description: Append-only. Hash-chained per ticket; never updated or deleted.
      properties:
        id: { type: integer, format: int64 }
        action: { type: string, examples: [FIELD_CHANGED] }
        actor: { $ref: '#/components/schemas/UserRef' }
        actorType: { type: string, enum: [USER, SYSTEM], description: '`SYSTEM` for auto-escalation.' }
        fieldName: { type: [string, 'null'] }
        oldValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        # C-034 · only meaningful on a COMMENTED row (`include=comments`) — null
        # for every other action. Mirrors Comment.isClientVisible so a reader of
        # the merged stream sees the same internal/client-visible fact the
        # Comments tab shows, without having to cross-reference the other list.
        isClientVisible: { type: [boolean, 'null'] }
        stageCode: { type: [string, 'null'] }
        cycleNo: { type: integer }
        iterationNo: { type: integer }
        isCorrection: { type: boolean }
        correctsEntryId: { type: [integer, 'null'], format: int64 }
        entryHash: { type: string, description: Chained to the previous entry for this ticket. }
        createdAt: { type: string, format: date-time }
    HistoryListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        meta: { $ref: '#/components/schemas/Meta' }
    EffortLog:
      type: object
      description: Append-only. Corrections are new rows, never edits.
      properties:
        id: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/UserRef' }
        hours: { type: number, format: double }
        workDate: { type: string, format: date }
        note: { type: [string, 'null'] }
        stageCode: { type: [string, 'null'], description: Stamped server-side. }
        cycleNo: { type: integer }
        iterationNo: { type: integer }
        isCorrection: { type: boolean }
        correctsEntryId: { type: [integer, 'null'], format: int64 }
        createdAt: { type: string, format: date-time }
    EffortLogRequest:
      type: object
      required: [hours, workDate]
      properties:
        hours: { type: number, format: double, minimum: 0.25, maximum: 24 }
        workDate:
          type: string
          format: date
          description: |
            Backdating is allowed within the configured window (default 7 days);
            beyond that it needs manager approval.
        note: { type: string, maxLength: 2000 }
        isCorrection: { type: boolean, default: false }
        correctsEntryId: { type: [integer, 'null'], format: int64 }
    EffortLogResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/EffortLog' } }
    EffortLogListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/EffortLog' } }
        meta:
          allOf:
            - { $ref: '#/components/schemas/Meta' }
            - type: object
              properties:
                cycleTotalHrs: { type: number, format: double }
                grandTotalHrs: { type: number, format: double }

    # ── ribbon & journey ──────────────────────────────────────────────────
    RibbonSegment:
      type: object
      properties:
        stageCode: { type: string }
        displayName: { type: string }
        icon: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/SegmentState' }
        sequence: { type: integer }
        owner: { $ref: '#/components/schemas/UserRef' }
        ownerRole: { $ref: '#/components/schemas/RoleCode' }
        enteredAt: { type: [string, 'null'], format: date-time }
        exitedAt: { type: [string, 'null'], format: date-time }
        durationMins:
          type: [integer, 'null']
          description: Working minutes, not wall-clock. Weekends and holidays excluded.
        effortHrs: { type: number, format: double }
        idleMins:
          type: [integer, 'null']
          description: '`durationMins − effort`. High idle against low effort is a queue problem.'
        iterationNo: { type: integer }
        loopBackCount: { type: integer, description: Drives the loop-back badge. }
        skipReason: { type: [string, 'null'] }
        handoffNote: { type: [string, 'null'] }
    Ribbon:
      type: object
      properties:
        cycleNo: { type: integer }
        iterationNo: { type: integer }
        isSealed: { type: boolean, description: True for a past cycle — renders read-only. }
        currentStageCode: { type: [string, 'null'] }
        canAdvance:
          type: boolean
          description: |
            Whether **this caller** may advance the ticket — the golden rule,
            resolved server-side. The contextual action button is hidden for
            everyone else.
        segments: { type: array, items: { $ref: '#/components/schemas/RibbonSegment' } }
    RibbonResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Ribbon' } }
    HandoffRequest:
      type: object
      required: [toStageCode, toUserId]
      properties:
        toStageCode: { type: string, description: Pre-filled from the workflow template. }
        toUserId:
          type: integer
          format: int64
          description: |
            Must hold the receiving stage's owner role on this project. The picker
            shows each candidate's current open load, so work is not handed to
            whoever is already drowning.
        note: { type: string, maxLength: 4000 }
        effortHours:
          type: [number, 'null']
          format: double
          minimum: 0
          description: Effort for the stage being left. Mandatory unless the project allows warn-only.
        attachmentIds: { type: array, items: { type: integer, format: int64 } }
    ReworkRequest:
      type: object
      required: [toStageCode, reason]
      properties:
        toStageCode: { type: string, description: Must be in the current stage's allowed return targets. }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        action: { $ref: '#/components/schemas/TransitionAction' }
        defects:
          type: array
          items: { type: string }
          description: Expected on a QA failure.
        toUserId: { type: [integer, 'null'], format: int64 }
        effortHours: { type: [number, 'null'], format: double }
    JourneyRow:
      type: object
      properties:
        iterationNo: { type: integer }
        cycleNo: { type: integer }
        stageCode: { type: string }
        resource: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/RoleCode' }
        enteredAt: { type: string, format: date-time }
        exitedAt: { type: [string, 'null'], format: date-time }
        durationMins: { type: [integer, 'null'] }
        effortHrs: { type: number, format: double }
        idleMins: { type: [integer, 'null'] }
    JourneyResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            rows: { type: array, items: { $ref: '#/components/schemas/JourneyRow' } }
            perResource:
              type: array
              items:
                type: object
                properties:
                  resource: { $ref: '#/components/schemas/UserRef' }
                  effortHrs: { type: number, format: double }
            cycleTotalHrs: { type: number, format: double }
            allCyclesTotalHrs: { type: number, format: double }
    StageQueueResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              ticket: { $ref: '#/components/schemas/Ticket' }
              enteredStageAt: { type: string, format: date-time }
              timeInStageMins: { type: integer, description: Working minutes. }
              stageSlaBreached: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }

    # ── comments & attachments ────────────────────────────────────────────
    Comment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        body: { type: string }
        originalBody: { type: [string, 'null'], description: Preserved when edited. }
        author: { $ref: '#/components/schemas/UserRef' }
        authorRole: { $ref: '#/components/schemas/RoleCode' }
        isClientVisible: { type: boolean }
        isEdited: { type: boolean }
        isDeleted: { type: boolean, description: Tombstone; the row survives. }
        # C-033 · when it was last rewritten, null if never.
        #
        # Load-bearing since D-14. While the window was five minutes, "edited"
        # implied "moments after posting" and this was noise; with no limit a
        # reader cannot otherwise tell a typo fixed a minute later from a claim
        # rewritten three months on, and those are very different facts about a
        # record colleagues have already acted on.
        #
        # NOT cleared on a tombstone, unlike `body` and `originalBody`. That it
        # was edited before it was removed is part of the record rather than part
        # of the content, and it carries no text — which is the whole reason the
        # bodies go.
        editedAt: { type: [string, 'null'], format: date-time }
        # C-033 · when the author's edit expires.
        #
        # **Null means there is no deadline** — the default since D-14 lifted
        # §4B.5's five minutes — and null on a tombstone, where there is nothing
        # left to edit.
        #
        # NEVER read a null here as "cannot edit". That is the one dangerous
        # reading of this field: with no limit configured, a client applying it
        # would hide the Edit affordance on every comment in the product. Whether
        # the caller may edit is decided by authorship and `isDeleted`; this only
        # ever adds a deadline on top, and only when one is configured.
        #
        # Derived from `createdAt` plus the server's configured window rather
        # than stored, so restoring the five minutes at deploy moves every
        # client's countdown with it and cannot leave a stored deadline
        # disagreeing with the rule the server applies.
        editableUntil: { type: [string, 'null'], format: date-time }
        # C-033 · the two halves of "removed by X on date", mirroring
        # `Attachment.deletedBy` / `deletedAt` exactly. Both null unless
        # `isDeleted`; `deletedBy` is additionally null when the account that
        # removed it no longer exists, and the client renders the tombstone
        # without an actor rather than inventing a name.
        #
        # A tombstone carries `body: ""` AND `originalBody: null`. Clearing only
        # the first would leave a comment that was edited before it was deleted
        # serving its first wording through the one field designed to preserve
        # wording — which is usually the exact text the deletion was for.
        deletedBy: { $ref: '#/components/schemas/UserRef' }
        deletedAt: { type: [string, 'null'], format: date-time }
        stageCode: { type: [string, 'null'], description: Stage at time of writing. }
        cycleNo: { type: integer }
        iterationNo: { type: integer }
        mentions: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        createdAt: { type: string, format: date-time }
    CommentWriteRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
        isClientVisible: { type: boolean, default: false }
        mentionUserIds: { type: array, items: { type: integer, format: int64 } }
        attachmentIds: { type: array, items: { type: integer, format: int64 } }
    CommentResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Comment' } }
    CommentListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        meta: { $ref: '#/components/schemas/Meta' }
    Attachment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        scanStatus:
          type: string
          enum: [PENDING, CLEAN, INFECTED]
          description: Not downloadable until `CLEAN`.
        downloadUrl: { type: [string, 'null'], description: Short-lived signed URL. Never a public bucket path. }
        thumbnailUrl: { type: [string, 'null'] }
        isClientVisible: { type: boolean }
        # C-028 · true on a tombstone. A listing returns a deleted row ONLY when
        # the removal is one §4B.4 wants recorded — see `deleteAttachment`. A
        # tombstone never carries `downloadUrl` or `thumbnailUrl`; the bytes are
        # gone, not merely hidden.
        isDeleted: { type: boolean }
        uploadedBy: { $ref: '#/components/schemas/UserRef' }
        # C-028 · the two halves of "file removed by X on date". Both null unless
        # `isDeleted`; `deletedBy` is additionally null when the account that
        # removed it no longer exists, and the client renders the tombstone
        # without an actor rather than inventing a name.
        deletedBy: { $ref: '#/components/schemas/UserRef' }
        deletedAt: { type: [string, 'null'], format: date-time }
        stageCode: { type: [string, 'null'] }
        cycleNo: { type: integer }
        createdAt: { type: string, format: date-time }
    AttachmentResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Attachment' } }
    AttachmentListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        meta: { $ref: '#/components/schemas/Meta' }
    AttachmentLimits:
      type: object
      required: [maxFileBytes, maxTicketBytes, maxFiles, ceilingBytes]
      properties:
        maxFileBytes: { type: integer, format: int64, examples: [10485760] }
        maxTicketBytes: { type: integer, format: int64, examples: [52428800] }
        maxFiles: { type: integer, examples: [20] }
        ceilingBytes:
          type: integer
          format: int64
          description: |
            Read-only. The most this server accepts in one upload whatever
            `maxFileBytes` says — the servlet container's multipart limit,
            which refuses a body before any application code runs. Reported so
            a settings form can show the bound rather than discover it through
            a 422, and so a client can say "up to X" without a second request.
          examples: [10485760]
    AttachmentLimitsResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/AttachmentLimits' } }
    AttachmentLimitsWrite:
      type: object
      required: [maxFileBytes, maxTicketBytes, maxFiles]
      description: |
        `ceilingBytes` is deliberately absent — it is the server's own
        configuration reported back, and accepting it would let a client appear
        to raise a bound it does not control.
      properties:
        maxFileBytes: { type: integer, format: int64, minimum: 1, maximum: 104857600 }
        maxTicketBytes: { type: integer, format: int64, minimum: 1 }
        maxFiles: { type: integer, minimum: 1, maximum: 200 }

    # ── clients ───────────────────────────────────────────────────────────
    ClientRef:
      type: object
      properties:
        id: { type: integer, format: int64 }
        clientCode: { type: string }
        name: { type: string }
    Client:
      allOf:
        - { $ref: '#/components/schemas/ClientRef' }
        - type: object
          properties:
            domain: { type: [string, 'null'] }
            accountManager: { $ref: '#/components/schemas/UserRef' }
            supportPlan: { type: [string, 'null'] }
            slaPolicyId: { type: [integer, 'null'], format: int64 }
            timezone: { type: [string, 'null'] }
            isActive: { type: boolean }
            # B-026 · additive, and not `required` — B-016's call on
            # `Project.status`, for the same reason: `Client` is inlined by
            # `Client360Response` and by the ticket form's dropdown, and a new
            # obligation on every consumer that builds one buys nothing for a
            # field they do not read.
            status:
              $ref: '#/components/schemas/ClientStatus'
              description: |
                Populated everywhere. On the **list** row and not only on the
                detail because `isActive` alone cannot render S-32's status
                chip once Prospect exists — a prospect and a contracted client
                are both `isActive: true` and the grid would label them
                identically.
            openTicketCount: { type: integer }
            primaryContact: { $ref: '#/components/schemas/Contact' }
            # B-025 · the two S-32 columns the schema could not render.
            # Additive: no existing consumer's fields move.
            projects:
              type: array
              items: { $ref: '#/components/schemas/ProjectRef' }
              description: |
                The projects this client is mapped to, from `client_projects` —
                S-32's Projects column and the source of its project filter.
                Empty rather than absent for a client mapped to none.
            lastTicketDate:
              type: [string, 'null']
              format: date-time
              description: |
                When this client last had a ticket raised. Null for a client
                with none — a new one, or one whose relationship never started.
                Read from the ticket rollup, never a per-row `COUNT(*)`.
            # B-028 · additive, and not `required`, for the reason `status`
            # above gives.
            hasPrimaryContact:
              type: boolean
              description: |
                B-028 · **whether this client may be selected on a ticket.**
                Blueprint line 948: "at least one primary contact before the
                client can be selected on a ticket".

                True when the client has a `client_contacts` row that is both
                `is_primary` and **active**. The active half is the part worth
                stating: a contact is removed by deactivation (B-027 — the
                `tickets.client_contact_id` foreign key has no cascade), so a
                client whose only primary has left reads `false`, which is the
                true and useful answer.

                On the **list** row, not only on `ClientDetail`, because the
                list row is what §4B.2's ticket-form dropdown renders. Deriving
                it from `primaryContact` instead would be a second statement of
                the rule, and a fragile one: `primaryContact` is omitted rather
                than nulled when there is none, so a picker reading it gets
                `undefined`.

                **`false` is ordinary, not an error state.** It is the state
                every client is created in — `POST /clients` cannot carry a
                contact, because there is no client id to hang one off until it
                returns — and the state a client returns to when somebody
                leaves. S-33's Contacts tab says so on screen; the ticket form
                shows such a client and refuses the selection with the reason,
                rather than filtering it out, because a client silently missing
                from a dropdown is indistinguishable from a dropdown that has
                lost its data.
    ClientStatus:
      type: string
      enum: [ACTIVE, INACTIVE, PROSPECT]
      description: |
        B-026 · blueprint §4B.2's Identity group, held by `ck_clients_status`.

        **`isActive` derives as `status <> 'INACTIVE'`, not `status =
        'ACTIVE'`.** §4B.2 puts a client dropdown on the ticket create form
        filtered on that boolean, so the narrower reading would have made every
        Prospect vanish from the form the moment this field shipped, with
        nothing on screen saying why — the call B-016 made on `Project.isActive`
        for the same reason, one master over.

        The consequence for `PATCH /clients/{clientId}/status`: `isActive: true`
        against a Prospect is a **no-op**, because a Prospect is already active
        by that projection. Silently rewriting it to `ACTIVE` would let the
        grid's bulk Activate promote a prospect to a contracted client, which
        is a commercial fact and not a checkbox. Setting `ACTIVE` explicitly
        through this field is how a prospect is converted.
    ClientSupportPlan:
      type: string
      enum: [BASIC, STANDARD, PREMIUM, ENTERPRISE]
      description: |
        B-026 · uppercase codes, which is what `ReferenceDataFixture` and the
        server have always stored. Blueprint §4B.2's Commercial group names
        Standard / Premium / Enterprise and A-006's column comment names
        `BASIC|STANDARD|PREMIUM|…`; the union is the vocabulary, because Basic
        is a plan eight seeded clients are already on and dropping it would
        orphan them.

        **No `CHECK` backs this**, deliberately, and it is not an oversight:
        B-035's import is a second writer, and B-011 established that a MySQL
        `CHECK` violation arrives as `UncategorizedSQLException` — a 500, not a
        field-keyed 400. A rejected import row must say which cell was wrong.
        The service validates it; `ck_clients_status` exists because the status
        vocabulary is closed by the product and this one is closed by us.
    ClientWriteRequest:
      type: object
      required: [clientCode, name]
      description: |
        B-026 · S-33's four tabs, in one body. The same shape serves `POST` and
        `PATCH` because the form submits every field on every save and **no
        client field is immutable** — unlike the project master, which needed a
        separate patch schema to keep an immutable `projectCode` off it.

        `maxLength` on `clientCode` and `name` was `50` and `200` and the
        columns are `VARCHAR(20)` and `VARCHAR(150)`. The contract was
        accepting values MySQL would refuse, which nothing had discovered
        because no server implemented the operation. Corrected to the columns.
      properties:
        # ── Identity ──────────────────────────────────────────────────────
        clientCode:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: |
            Unique, case-insensitively — the column collates
            `utf8mb4_0900_ai_ci`. Normalised to upper case on the way in, so
            `acme` and `ACME` are one client and not a 409 an admin has to
            interpret.

            **This is B-035's upsert key.** Changing it means the next import
            carrying the old code creates a second client rather than updating
            this one. Editable anyway — a code typed wrong on day one has to be
            fixable — with the consequence stated on the form at the field.
        name: { type: string, minLength: 1, maxLength: 150 }
        shortName: { type: [string, 'null'], maxLength: 60 }
        logoUrl:
          type: [string, 'null']
          maxLength: 500
          description: A URL. The row is read on every grid page; image bytes are not.
        industry: { type: [string, 'null'], maxLength: 80 }
        status: { $ref: '#/components/schemas/ClientStatus' }
        domain:
          type: [string, 'null']
          maxLength: 120
          description: |
            Website domain. D-039 matches inbound mail against it, which is why
            a scheme or a `www.` prefix is stripped rather than stored — a
            client saved as `https://acme.example/` would match no sender
            address at all.
        primaryEmail: { type: [string, 'null'], format: email, maxLength: 150 }
        supportEmail:
          type: [string, 'null']
          format: email
          maxLength: 150
          description: Used for email-to-ticket matching (§4B.2, D-039).
        phone: { type: [string, 'null'], maxLength: 30 }
        # ── Address ───────────────────────────────────────────────────────
        addressLine1: { type: [string, 'null'], maxLength: 150 }
        addressLine2: { type: [string, 'null'], maxLength: 150 }
        city: { type: [string, 'null'], maxLength: 80 }
        state: { type: [string, 'null'], maxLength: 80 }
        country: { type: [string, 'null'], maxLength: 80 }
        postalCode: { type: [string, 'null'], maxLength: 20 }
        timezone:
          type: [string, 'null']
          maxLength: 50
          description: |
            An IANA zone id, validated against `ZoneId`. Presentation only —
            every instant in the schema is UTC (PLAN.md §3.1). Defaults to
            `Asia/Kolkata`, which is the column default and not a guess made
            here.
        # ── Commercial ────────────────────────────────────────────────────
        accountManagerId:
          type: [integer, 'null']
          format: int64
          description: |
            Must name an **active** resource. The role is deliberately not
            checked — B-016 made the same call for a project manager, and a
            hardcoded role set is what B-015 removed from `ResourceController`.
        contractStart: { type: [string, 'null'], format: date }
        contractEnd:
          type: [string, 'null']
          format: date
          description: Must not precede `contractStart`.
        supportPlan:
          oneOf:
            - { $ref: '#/components/schemas/ClientSupportPlan' }
            - { type: 'null' }
        billingReference: { type: [string, 'null'], maxLength: 60 }
        billingEmail:
          type: [string, 'null']
          format: email
          maxLength: 150
          description: |
            Distinct from `primaryEmail` and `supportEmail`. Collapsing the
            three sends a support auto-reply to accounts payable.
        # ── Notes ─────────────────────────────────────────────────────────
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 40 }
          maxItems: 20
          description: |
            Free vocabulary. `ck_clients_tags` constrains the shape — an array
            of strings — and not the values, which is the point of the field.
        # ── Projects & SLA ────────────────────────────────────────────────
        projectIds:
          type: array
          items: { type: integer, format: int64 }
          description: |
            Replaces the whole `client_projects` mapping. Sending it empty
            unmaps the client from every project, which is a real thing to
            want and is why an *absent* array and an *empty* one have to mean
            different things — absent leaves the mapping alone.
        defaultProjectId:
          type: [integer, 'null']
          format: int64
          description: |
            `client_projects.is_default`. Must be one of `projectIds`; a default
            the client is not mapped to is a row the ticket form can never
            offer.
        slaPolicyId:
          type: [integer, 'null']
          format: int64
          description: |
            Stored, and **read by nothing today**. C-012's `PlannedCloseDate`
            ladder resolves org → project → task type and never consults
            `clients.sla_policy_id`; B-018's matrix is where a project's SLA is
            actually configured. Kept on the wire because the column exists and
            B-035's import writes it, and rendered read-only on the form rather
            than as a picker — a control whose only effect is to write a number
            nothing reads is worse than no control. **Flagged**: making it
            resolve is a C-012 change, not a masters one.
    ClientBulkStatusRequest:
      type: object
      required: [clientIds, isActive]
      properties:
        clientIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: integer, format: int64 }
          description: |
            Bounded at 200 — the same ceiling `Limit` puts on a page, so the
            selection cannot exceed what one page could have offered. An
            unbounded id list is an unbounded `IN (…)`.
        isActive: { type: boolean }
    Contact:
      type: object
      description: |
        A person at the client — blueprint §4B.2, the table B-027's child grid
        edits and C-021's reporter dropdown reads.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        designation:
          type: [string, 'null']
          description: |
            B-027 · their job title at the client. The column has been there
            since the baseline and no schema carried it, so the one field that
            tells a desk whether they are talking to the IT Director or a
            helpdesk operator was unreadable.
        email:
          type: [string, 'null']
          format: email
          description: |
            **Nullable on the read and required on the write**, and that is not
            an inconsistency. `client_contacts.email` is `NULL`-able and B-035's
            import will write rows from spreadsheets that omit it, so a
            non-nullable read schema would make the generated client's own zod
            reject a row the database permits. New contacts entered through S-33
            must have one — a contact with `notificationOptIn` and no address is
            a mail D-036 can never deliver.
        phone: { type: [string, 'null'] }
        isPrimary: { type: boolean }
        notificationOptIn: { type: boolean }
        portalAccess: { type: boolean }
        isActive:
          type: boolean
          description: |
            B-027 · false for a removed contact. Removal deactivates rather than
            deletes, because `tickets.client_contact_id` points here; only
            `listClientContacts?includeInactive=true` returns these.
    ContactWriteRequest:
      type: object
      required: [name, email]
      description: |
        B-027 · the whole representation, for both `POST` and `PATCH`. An absent
        field is a cleared field — the row editor sends every input on every
        save, so "the form did not send a designation" and "the admin emptied the
        designation box" are the same event. B-026's argument on
        `ClientWriteRequest`, one screen over.

        `isActive` is deliberately **not** here: removal is the `DELETE`, and a
        boolean that could also do it would be two controls for one outcome —
        which is how they end up disagreeing.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            120, not 150. `client_contacts.name` is a `VARCHAR(120)` and the
            contract was accepting values MySQL would refuse — the same defect
            B-026 fixed on `clientCode` and `name`, found the same way: by
            implementing the operation.
        designation: { type: [string, 'null'], maxLength: 80 }
        email:
          type: string
          format: email
          maxLength: 150
          description: |
            Unique **within this client**, case-insensitively. The same address
            under two different clients is legitimate and stays allowed —
            `ix_client_contacts_email` is deliberately not unique and D-039
            disambiguates inbound mail by `website_domain`.
        phone: { type: [string, 'null'], maxLength: 30 }
        isPrimary:
          type: boolean
          default: false
          description: |
            Promoting demotes the previous primary in the same transaction.
            Clearing it on the only primary is allowed and leaves the client with
            none, which B-028 reports on the ticket create path.
        notificationOptIn:
          type: boolean
          default: true
          description: |
            `client_contacts.receives_mail` — the D-036 recipient list. Named for
            what it means to an administrator rather than for the column.
        portalAccess:
          type: boolean
          default: false
          description: The forward hook for client portal login; unused in phase 1.
    ClientDetail:
      allOf:
        - { $ref: '#/components/schemas/Client' }
        - type: object
          description: |
            B-026 · the S-33 form's read. Everything on `Client` plus the
            §4B.2 groups the grid has no column for.

            **A separate schema rather than more fields on `Client`.** The list
            inlines a row per client per page; twenty-five more fields on it
            would be paid for by the grid, the ticket form's client dropdown
            and every other `listClients` caller, none of which render them.
            The same split `UserDetail`/`User` and `ProjectDetail`/`Project`
            already make.
          properties:
            status: { $ref: '#/components/schemas/ClientStatus' }
            shortName: { type: [string, 'null'] }
            logoUrl: { type: [string, 'null'] }
            industry: { type: [string, 'null'] }
            primaryEmail: { type: [string, 'null'] }
            supportEmail: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            addressLine1: { type: [string, 'null'] }
            addressLine2: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
            state: { type: [string, 'null'] }
            country: { type: [string, 'null'] }
            postalCode: { type: [string, 'null'] }
            contractStart: { type: [string, 'null'], format: date }
            contractEnd: { type: [string, 'null'], format: date }
            billingReference: { type: [string, 'null'] }
            billingEmail: { type: [string, 'null'] }
            notes: { type: [string, 'null'] }
            tags: { type: array, items: { type: string } }
            defaultProjectId:
              type: [integer, 'null']
              format: int64
              description: |
                The `client_projects` row flagged `is_default`. Null when the
                client is mapped to projects but none is marked, which is the
                state every imported client starts in.
            contactCount:
              type: integer
              description: |
                How many contacts this client has. On the detail so the form's
                Contacts tab can say what it is showing before the tab is
                opened, and so B-028's "at least one primary contact" rule has
                a number to state rather than an abstraction.
            hasPrimaryContact:
              type: boolean
              description: |
                B-028's gate, reported rather than enforced here: a client
                without one is **not selectable on a ticket**. The form says so
                on the Contacts tab. Enforcing it on the ticket create path is
                B-028's, the way B-029's block on new tickets is B-029's.
    ClientResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Client' } }
    ClientDetailResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/ClientDetail' } }
    ClientListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Client' } }
        meta: { $ref: '#/components/schemas/Meta' }
    ContactResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Contact' } }
    ContactListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Contact' } }
    Client360Response:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            client: { $ref: '#/components/schemas/Client' }
            tickets: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
            openCount: { type: integer }
            closedCount: { type: integer }
            slaCompliancePct: { type: number, format: double }
            avgResolutionHrs: { type: number, format: double }
        meta: { $ref: '#/components/schemas/Meta' }

    # ── imports ───────────────────────────────────────────────────────────
    ImportUploadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            uploadId: { type: string, format: uuid }
            fileName:
              type: string
              description: |
                As the browser sent it, stripped of any path. Echoed back so the
                screen can name the file it is about to import in the words the
                user recognises, across the four requests the wizard spans.
            sheets: { type: array, items: { type: string } }
            sheet:
              type: string
              description: |
                Which of `sheets` these `headers` and this `rowCount` describe.
                Stated rather than assumed to be the first: re-posting with
                `?sheet=` is how the selector works, and a client that inferred
                "the first one" would mislabel every subsequent read.
            headers:
              type: array
              items: { type: string }
              description: |
                The heading row, in sheet order. A heading repeated in the same
                sheet is suffixed — `Email`, `Email (2)` — because rows are keyed
                by heading and the alternative is one of the two columns silently
                disappearing before the user ever sees it.
            rowCount: { type: integer }
            suggestedMapping:
              type: object
              additionalProperties: { type: string }
              description: Auto-matched by header; every column stays manually overridable.
    ImportSchemaField:
      type: object
      required: [name, header, required, type, naturalKey]
      properties:
        name:
          type: string
          description: |
            The target field — the key used in every `mapping` object the wizard
            sends. Stable; the header is the changeable half.
        header:
          type: string
          description: |
            The human column heading, exactly as the template writes it and
            exactly what the auto-match compares against. Shown on the mapping
            screen so the user is matching the words they saw in the template.
        required:
          type: boolean
          description: |
            A blank cell rejects the row, and an unmapped column of this kind
            blocks step 3's Next button. Not derivable from anything else the
            wizard returns, which is most of why this operation exists.
        naturalKey:
          type: boolean
          description: |
            True for the one field that decides create-versus-update — the
            client code. Always `required` as well, but worth naming separately:
            the mapping screen says what mapping it wrong would *do*, and "rows
            will be matched on this column" is a different warning from "this
            column cannot be blank".
        type:
          type: string
          enum: [TEXT, EMAIL, DATE, ENUM, INTEGER]
          description: |
            `ImportFieldType`, and deliberately a small closed set rather than a
            type system — it answers what format the template gives the column,
            what "well-formed" means in the dry run, and how the string becomes a
            field at commit. Anything more specific is a per-field validator and
            is not visible here.
        maxLength:
          type: integer
          description: Column width, or 0 for unbounded.
        allowedValues:
          type: array
          items: { type: string }
          description: |
            The `ENUM` domain, empty otherwise. The same list the template's
            data-validation dropdown is built from — one declaration, so the
            template cannot offer a value the import rejects.
        example:
          type: [string, 'null']
          description: The value the template's worked example row carries.
    ImportSchemaFieldsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [schema, entity, naturalKey, fields]
          properties:
            schema: { type: string }
            entity:
              type: string
              description: '`import_batches.entity` — `CLIENT` or `RESOURCE`.'
            naturalKey:
              type: string
              description: The `name` of the field rows are matched on.
            fields:
              type: array
              items: { $ref: '#/components/schemas/ImportSchemaField' }
    ImportMappingPreset:
      type: object
      required: [presetId, name, mapping]
      properties:
        presetId: { type: integer, format: int64 }
        name: { type: string }
        mapping:
          type: object
          additionalProperties: { type: string }
          description: Target field → source column, the same shape `/validate` takes.
        updatedAt: { type: string, format: date-time }
    ImportMappingPresetsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ImportMappingPreset' }
    ImportMappingPresetResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ImportMappingPreset' }
    ImportMappingPresetRequest:
      type: object
      required: [name, mapping]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            What the user will pick it out of a list by. Unique per schema, and
            saving under a name that exists replaces it.
        mapping:
          type: object
          additionalProperties: { type: string }
          minProperties: 1
          description: |
            Target field → source column. Keys must be fields the schema
            declares; a key that matches nothing is a 422 rather than a silent
            drop at the point of use.
    ImportValidateRequest:
      type: object
      required: [uploadId, mapping]
      properties:
        uploadId: { type: string, format: uuid }
        sheet:
          type: string
          description: |
            Which sheet the caller believes it is validating. Optional, and a
            cross-check rather than a selector — the sheet was chosen at step 2
            and one `uploadId` stages exactly one sheet. Sent, it must agree with
            what is staged; a disagreement is `import-upload-unavailable` rather
            than a silent preview of the other sheet.
        mapping:
          type: object
          additionalProperties: { type: string }
          minProperties: 1
          description: |
            Target field → source column, the same shape and direction step 3's
            presets are stored in. Entries with a blank column are ignored, so
            an untouched `<select>` does not count as a mapping.
    ImportRowVerdict:
      type: object
      required: [rowNumber, verdict, values]
      properties:
        rowNumber:
          type: integer
          description: |
            The 1-based row in the source sheet, header included, so the first
            data row is 2 — what Excel's own gutter shows. Carried from the
            parse rather than computed from position, because blank rows are
            dropped and a number the user cannot find in their file is worse
            than no number.
        verdict: { type: string, enum: [WILL_CREATE, WILL_UPDATE, DUPLICATE_IN_FILE, REJECTED] }
        reason:
          type: [string, 'null']
          description: |
            §4B.3's Message column, and it says a different kind of thing per
            verdict. `REJECTED` — the first rule the row broke, in the user's
            words. `DUPLICATE_IN_FILE` — which earlier row won. `WILL_UPDATE` —
            **the fields this row would change**, comma-separated in template
            order, or `No change`; that is what makes "38 will update"
            reviewable rather than alarming. `WILL_CREATE` — null, the em dash
            in the blueprint's mock-up.

            Null is also what a `WILL_UPDATE` carries when the registration
            cannot cheaply supply current values, so a client must render the
            absence rather than assume nothing changes.
        values:
          type: object
          additionalProperties: { type: string }
          description: |
            The row as mapped, keyed by target field name — blank cells absent
            rather than empty. Enough to render the row the user is being asked
            about without re-reading the file, and enough for B-036's error
            report to re-emit it with a Reason column appended.
    ImportPreviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [willCreate, willUpdate, duplicates, rejected, rows]
          properties:
            willCreate: { type: integer }
            willUpdate: { type: integer }
            duplicates: { type: integer }
            rejected: { type: integer }
            rows:
              type: array
              items: { $ref: '#/components/schemas/ImportRowVerdict' }
              description: |
                Every row, in the file's own order — the user reads this against
                their spreadsheet. The counts are derived from this list rather
                than accumulated beside it, so a summary that disagrees with the
                table below it is not expressible.
    ImportCommitRequest:
      type: object
      required: [uploadId, mapping]
      description: |
        The same two things `/validate` takes, for the reason B-033 recorded: the
        mapping is never parked server-side, so both steps carry it. Sending them
        again is also what lets the server re-derive the verdicts rather than
        trust a preview the caller assembled.
      properties:
        uploadId: { type: string, format: uuid }
        sheet:
          type: string
          description: |
            A cross-check, not a selector — one upload stages one sheet. Sent and
            disagreeing means the wizard's state and the server's have diverged,
            and is refused as `import-upload-unavailable`.
        mapping: { type: object, additionalProperties: { type: string } }
        skipRejected:
          type: boolean
          default: true
          description: |
            `true` — the default and the wizard's own behaviour — writes the rows
            the dry run judged `WILL_CREATE` or `WILL_UPDATE` and skips the rest,
            which is §4B.3's "import valid rows only".

            `false` is **all-or-nothing**: a file with any rejected row or any
            in-file duplicate is refused whole, `import-rejected-rows-present`,
            and nothing is written. It is not "write them anyway" — a row the
            engine rejected has no valid value to write.
    ImportBatchResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ImportBatch' }

    ImportBatch:
      type: object
      required:
        [batchId, entity, status, processed, total, created, updated, rejected,
         reversedRows, retainedRows, reversible]
      description: |
        One import run — the progress bar's poll, a row of B-037's history panel
        and the body of a reversal's response, all the same object.

        **Named rather than inlined since B-037**, which is when it acquired a
        second and third reader. Three copies of a seventeen-field shape would be
        three places to keep in step, and the panel needs every field the poll
        has: it shows the counters, the status, the error-report link and the one
        operation the run offers.

        `required` is spelled out so the generated TypeScript stops making every
        counter optional — a progress bar reading `processed ?? 0` renders 0% for
        a run that is nearly finished, and the fallback hides it. `fileName`,
        `errorReportUrl`, `importedBy`, `importedByName` and `reversedAt` are the
        ones that genuinely may be absent.
      properties:
        batchId:
          type: integer
          format: int64
          description: |
            `import_batches.id`. An integer, not a UUID — the contract said
            UUID until B-030 read the baseline DDL.
        entity:
          type: string
          examples: [CLIENT]
          description: |
            `CLIENT` or `RESOURCE` — which registration this run was
            validated against, and what B-037's reversal query keys on.
            Deliberately the stored discriminator rather than the URL segment
            (`clients`): collapsing them would mean renaming a live URL to
            fix a column.
        fileName: { type: [string, 'null'], maxLength: 255 }
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED]
          description: |
            The commit job's lifecycle, and the only vocabulary
            `import_batches.status` uses. There is no state for the step-4
            dry run because the dry run writes nothing — no batch row
            exists until commit, and it is born `QUEUED`.

            `COMPLETED` is **not** a synonym for "no rejections": a run that
            refused half the file and wrote the rest completed, and its error
            report is how the user recovers the other half. `FAILED` means
            the job itself died.
        processed:
          type: integer
          description: |
            `created + updated + rejected` — derived, not a stored column, so
            it cannot disagree with the three numbers beside it. Reaches
            `total` exactly when the run is over.
        total:
          type: integer
          description: Every data row of the sheet, rejected ones included.
        created: { type: integer }
        updated: { type: integer }
        rejected:
          type: integer
          description: |
            What the dry run refused, plus anything that failed at write
            time — a row the preview judged writable can still break a
            constraint no validator declared, and losing the other 499 to it
            would be the wrong trade.
        errorReportUrl:
          type: [string, 'null']
          examples: ['/import-batches/412/error-report']
          description: |
            `.xlsx` of rejected rows with an appended Reason column — B-036.

            **A path relative to the API base** — no `/api/v1` prefix, because
            the file needs the caller's `Authorization` header and so is
            composed onto a base by whatever fetches it, exactly as the
            template path is. **Not an object-store URL.** The
            file is a verbatim extract of the client master, so it is served
            through `downloadImportErrorReport` with `master.write` re-checked
            at the moment of reading, rather than as a presigned URL the way
            §4B.4 serves attachments. A signed URL is a bearer credential that
            outlives the screen that minted it, in a browser history and a
            proxy log.

            **Null exactly when there is nothing to download**: the run has
            not finished, no row was rejected, or the report could not be
            stored. A client renders the button disabled rather than hiding
            it — hiding leaves a user with no account of the rows that did
            not land.

            It appears on the **same write that makes the status terminal**,
            never a later one: a client stops polling when it reads
            `COMPLETED`, so a report stamped afterwards is one nobody is
            still asking for. The `ETag` covers this field for the same
            reason.
        startedAt:
          type: string
          format: date-time
          description: |
            `import_batches.created_at` — when the run was committed, not when it
            finished. UTC, like everything else in storage; the user's timezone is
            applied when it is rendered.

            The history panel's first column, and half of what "a bad import can
            be identified" means in practice: an Admin knows roughly when they
            uploaded the wrong file long before they know its batch id.
        importedBy:
          type: [integer, 'null']
          format: int64
          description: |
            Who committed the run. Nullable because it is recorded best-effort —
            a caller the `dev-noauth` profile cannot identify starts a run with no
            actor rather than being refused one.
        importedByName:
          type: [string, 'null']
          description: |
            `importedBy` resolved to a display name — `full_name`, falling back to
            the username.

            **Present on `listImportBatches`, null on `getImportBatch`.** The poll
            deliberately does not resolve it: the screen watching a progress bar
            knows perfectly well who started the run, because they just pressed
            the button, and a user lookup every two seconds for the length of an
            import is a query per poll for a string that cannot change.

            Null also when the account has since been deleted. The panel then
            renders the run unattributed, which is the truth, rather than an
            "Unknown user" placeholder that looks like a person.
        reversedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When this run was reversed as a set — B-037. Null means never, and it
            is the whole state machine: there is no `REVERSED` status, because
            `status` records how the *run* ended and a reversal is a later fact
            about a run that already ended. Collapsing them would lose "completed
            with 6 rejections" the moment somebody reversed it.
        reversedRows:
          type: integer
          description: |
            Rows this run **created** that the reversal deleted.

            Never rows it merely updated. `clients.import_batch_id` is stamped on
            insert only, so a row the run edited is not attributed to it — and
            there is no before image anywhere, so an update is not something a
            reversal could undo. `reverseImportBatch` returns
            `updatedRowsNotReverted` so that limit is stated rather than inferred.
        retainedRows:
          type: integer
          description: |
            Rows this run created that the reversal could **not** delete, because
            something else now references them — a client that has since been
            named on a ticket.

            Kept rather than destroyed: the two ways to force the count to zero
            are failing the whole reversal because one client got used, or
            deleting a ticket's client. Stored on the row because it is not
            derivable afterwards — once the others are gone, an unreversed batch
            and a fully reversed one both count zero.
        reversible:
          type: boolean
          description: |
            Whether `reverseImportBatch` would be accepted right now — **the
            button's enabled state, decided by the server**.

            A client could compute it from `status` and `reversedAt`, and that is
            exactly why it is here instead: those are the server's two refusals,
            and a copy in TypeScript is a second statement of them that agrees on
            the day it is written. A rule added on one side afterwards becomes a
            button offering an operation the server refuses, on a screen whose job
            is deleting rows.

            True for a finished, un-reversed run — `COMPLETED` **or** `FAILED`. A
            failed run is the one most likely to need reversing: it left rows in
            the master that nobody approved the presence of.

    ImportBatchListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [entity, batches, limit]
          description: |
            B-037 — the import history panel. Blueprint §4B.3: *"every import
            writes an `import_batch` row so a bad import can be identified and
            reversed as a set."* This is the identification half.
          properties:
            entity:
              type: string
              examples: [CLIENT]
              description: The registration these runs belong to — what was asked for.
            batches:
              type: array
              items: { $ref: '#/components/schemas/ImportBatch' }
              description: |
                Newest first. The same object `getImportBatch` returns, not a
                slimmer summary: the panel shows every counter, the status, the
                error-report link and `reversible`, which is all of them.
            limit:
              type: integer
              examples: [50]
              description: |
                How many runs this route returns at most — **stated rather than
                applied silently**. `import_batches` only grows, and a bounded
                answer that looks unbounded reads as "these are all of them" when
                it is not.

    ImportReversalResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [batch, deleted, retained, updatedRowsNotReverted]
          properties:
            batch:
              $ref: '#/components/schemas/ImportBatch'
              description: |
                The run, re-read — `reversedAt` now set and `reversible` now
                false. Returned whole so the panel renders the updated row from
                this response rather than re-listing.
            deleted:
              type: array
              items: { type: string }
              examples: [[ACME, NORTHWIND]]
              description: |
                Natural keys removed — client codes, not database ids, because
                the user is going to look them up in the spreadsheet they
                uploaded. Named rather than only counted: the count is on
                `batch.reversedRows`, and what an operator asks next is *which
                ones*.
            retained:
              type: array
              description: |
                Rows this run created that the reversal refused to remove. **An
                empty array is the ordinary outcome and a non-empty one is not a
                failure** — keeping a client that has since been named on a
                ticket is the correct result, and the two ways to avoid it are
                failing the whole reversal or destroying the ticket's client.
              items:
                type: object
                required: [naturalKey, reason]
                properties:
                  naturalKey: { type: string, examples: [ZENITH] }
                  reason:
                    type: string
                    examples: ['Kept — 3 tickets have been raised against this client since the import.']
                    description: |
                      Plain language, for the person reading the screen. Never a
                      constraint name or a database message — the same call B-036
                      made about the error report's Reason column, and for the
                      same reason: this text gets pasted into email.
            updatedRowsNotReverted:
              type: integer
              description: |
                **The honest half of the promise.** Rows this run *updated*
                rather than created, which a reversal does not touch and could
                not restore: `clients.import_batch_id` is stamped on insert only,
                and there is no before image anywhere.

                Carried explicitly, and never folded into `retained`, because it
                is not a row the reversal declined to delete — it is a row the
                reversal was never about. Somebody who imported 412 rows and sees
                "12 deleted" is owed the sentence that accounts for the other 400.

    # ── masters ───────────────────────────────────────────────────────────
    Permission:
      type: object
      required: [id, code, name, category, isGrantable]
      properties:
        id: { type: integer, format: int32 }
        code:
          type: string
          maxLength: 60
          examples: ['ticket.force_move']
          description: |
            A dotted capability string — `{module}.{action}`. This is what
            `@PreAuthorize` checks and what the JWT `permissions[]` claim
            carries, so it is stable: renaming one revokes it everywhere at once.
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 255 }
        category:
          type: string
          maxLength: 40
          examples: [ticket]
          description: |
            The matrix's module grouping — `admin`, `ticket`, `history`,
            `reports`, `master`, `audit`.

            > **Not the same "module" as `/masters/modules`.** That one is the
            > product area a ticket is raised against (Fees, Admissions); this
            > one is an area of the application. Blueprint §7 overloads the word
            > and the two must not be joined.
        isGrantable:
          type: boolean
          description: |
            `false` means no role may hold it and the matrix renders the
            checkbox disabled. Today that is exactly `history.edit_delete`,
            which exists so S-09 can *show* the append-only guarantee rather
            than omit the row and leave an admin wondering.

            This is a property of the code, not a column an admin can flip — it
            is computed server-side and read-only here.
    PermissionListResponse:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Permission' } } }
    Role:
      type: object
      required: [id, code, name, isSystem, isActive, userCount, permissionCount]
      properties:
        id: { type: integer, format: int32 }
        code: { type: string, maxLength: 30, examples: [DEVELOPER] }
        name: { type: string, maxLength: 80, examples: [Developer] }
        description: { type: [string, 'null'], maxLength: 255 }
        isSystem:
          type: boolean
          description: |
            One of the six seeded roles of blueprint §2. Renameable and
            deactivatable; never deletable. Read-only — nothing this API accepts
            can set it.
        isActive: { type: boolean }
        userCount:
          type: integer
          description: Resources currently holding this role. Non-zero blocks the delete.
        permissionCount: { type: integer }
    RoleListResponse:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Role' } } }
    RoleDetail:
      allOf:
        - { $ref: '#/components/schemas/Role' }
        - type: object
          required: [permissionCodes]
          properties:
            permissionCodes:
              type: array
              items: { type: string }
              description: |
                Every capability granted, in `(category, code)` order. The ticked
                cells of the matrix; `listPermissions` is the full row set.
    RoleDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RoleDetail' }
    RoleWriteRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 30
          pattern: '^[A-Z][A-Z0-9_]{1,29}$'
          description: Upper-cased server-side. Unique, and immutable once created.
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 255 }
        isActive: { type: boolean, default: true }
    RolePatchRequest:
      type: object
      description: |
        Every field optional; an omitted one keeps its stored value. **`code` is
        deliberately not here** — see `PATCH /masters/roles/{roleId}`. Sending
        one anyway is a `409` rather than being ignored, because silently
        dropping a field the caller believed it changed is how a rename appears
        to succeed and does not.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 255 }
        isActive: { type: boolean }
    RolePermissionsRequest:
      type: object
      required: [permissionCodes]
      properties:
        permissionCodes:
          type: array
          items: { type: string }
          description: |
            The complete set the role should hold afterwards. Absent codes are
            revoked. Duplicates are collapsed; an empty array revokes everything,
            which is a legitimate save and not mistaken for an unsent form.
    RoleInUseProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          properties:
            userCount:
              type: integer
              description: |
                Resources still holding the role. Zero when the refusal is
                `system-role-undeletable` rather than `role-in-use`.
    TaskType:
      type: object
      description: |
        S-11. `code` is the stable identifier and `name` is display text an
        Admin may change — **key behaviour off `code`.** The create form's
        client-mandatory rule (§4B.2) currently matches on `name`, which this
        screen is the reason it should not.

        Every property here is populated on every response and none of them is
        in `required`, which is B-016's call on `Project.status` applied again:
        a required property is an obligation on every consumer that constructs
        one, and the ticket-form fixtures construct these. Optional-but-always-
        present costs a `?` in the generated type and breaks nothing.
      properties:
        id: { type: integer, format: int32 }
        code:
          type: string
          description: Immutable once created. Unique, upper-case.
        name: { type: string }
        icon:
          type: [string, 'null']
          description: A `lucide-react` icon name — the frontend's icon library. No enum.
        colour: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        defaultLevel: { $ref: '#/components/schemas/Level' }
        defaultSlaHrs: { type: [number, 'null'], format: double }
        seq: { type: integer, format: int32, description: Display order in the picker. }
        isActive: { type: boolean }
        ticketCount:
          type: integer
          format: int64
          description: |
            Tickets currently carrying this type. Shown on the grid so that
            retiring a type is an informed decision rather than one whose size
            is discovered afterwards.
    TaskTypeListResponse:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/TaskType' } } }
    TaskTypeResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/TaskType' } }
    TaskTypeWriteRequest:
      type: object
      required: [code, name, colour, defaultLevel]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 40
          pattern: '^[A-Za-z][A-Za-z0-9_]{1,39}$'
          description: Upper-cased on save. Permanent.
        name: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: [string, 'null'], maxLength: 30 }
        colour:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: |
            A blueprint §12.1 token. Required on create even though the column
            is nullable: a type with no colour renders as a hole in the picker,
            the grid and the Task Type Distribution chart at once.
        defaultLevel: { $ref: '#/components/schemas/Level' }
        defaultSlaHrs: { type: [number, 'null'], format: double, minimum: 0 }
        seq: { type: [integer, 'null'], format: int32 }
        isActive: { type: [boolean, 'null'] }
    TaskTypePatchRequest:
      type: object
      description: |
        Every field optional; an omitted one keeps its stored value. `isActive:
        false` is how a type is retired — there is no delete.
      properties:
        code:
          type: string
          description: |
            Here **only so that a changed one can be refused with `409`.**
            Omitting it from the schema would let Jackson discard it silently
            and report a rename that did not happen. Resending the stored value
            is a no-op.
        name: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: [string, 'null'], maxLength: 30 }
        colour: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        defaultLevel: { $ref: '#/components/schemas/Level' }
        defaultSlaHrs: { type: [number, 'null'], format: double, minimum: 0 }
        seq: { type: [integer, 'null'], format: int32 }
        isActive: { type: [boolean, 'null'] }
    Module:
      type: object
      required: [id, code, name, isActive]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, maxLength: 40, examples: [FEES] }
        name: { type: string, maxLength: 80, examples: [Fees] }
        seq: { type: integer, description: Display order in the picker. }
        isActive: { type: boolean }
    ModuleListResponse:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Module' } } }
    Priority:
      type: object
      description: |
        S-12. `level` is the stable identifier — it is the `code` column, and it
        is the value `tickets.level` stores. `name` is display text an Admin may
        change; **key behaviour off `level`.**

        The property is called `level` rather than `code` because that is what
        it has been called since D-001 and what Stream C's `CreateTicketPage`
        and `TicketListPage` already read. Renaming it to match the column would
        break both for no gain.

        Every property is populated on every response and none is `required` —
        B-016's call on `Project.status`, repeated by B-020 on `TaskType`: a
        required property is an obligation on every consumer that constructs
        one, and the ticket-form fixtures construct these.
      properties:
        id: { type: integer, format: int32 }
        level:
          $ref: '#/components/schemas/Level'
          description: The `code` column. Immutable once created.
        name: { type: string, description: 'Display text: Low, Medium, High, Critical.' }
        colour: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        defaultSlaHrs:
          type: [number, 'null']
          format: double
          description: |
            Working hours. Rung 4 of the §6 SLA ladder (`PRIORITY_DEFAULT`) —
            the last rung that still varies with the level, which is why it is
            tried before the task type's. Null means this level contributes no
            default and resolution falls through to the task type.
        autoEscalates:
          type: boolean
          description: |
            The level the SLA engine escalates *to* on breach (§6) — the
            `is_escalation_trigger` column. **Exactly one active level carries
            it**, enforced by `PriorityService`: setting it here clears it
            elsewhere, and clearing the last one is refused.
        seq:
          type: integer
          format: int32
          description: |
            Severity rank and display order — never the id. Also the column
            order of every project's SLA matrix.
        isActive: { type: boolean }
        ticketCount:
          type: integer
          format: int64
          description: Tickets currently at this level. Never blocks a retire; informs it.
        taskTypeCount:
          type: integer
          format: int32
          description: |
            Task types whose `defaultLevel` is this level. **This one does block
            a retire** — `TaskTypeService` refuses a retired level as a default,
            so retiring would leave those types unsaveable on their own screen.
        slaPolicyCount:
          type: integer
          format: int32
          description: |
            `sla_policies` rows written at this level, across all projects.
            Retiring drops the level's whole column from every SLA matrix and
            these rows stop resolving. Never blocks a retire; informs it.
    PriorityListResponse:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Priority' } } }
    PriorityResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Priority' } }
    PriorityWriteRequest:
      type: object
      required: [level, name, colour]
      properties:
        level:
          $ref: '#/components/schemas/Level'
          description: |
            The `code`. Upper-cased on save, unique, permanent. Typed as the
            closed `Level` enum rather than a free string, which is what makes
            S-12's "Admin can add further levels" not yet reachable — see the
            operation description for what opening it costs.
        name: { type: string, minLength: 1, maxLength: 40 }
        colour:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: |
            A blueprint §12.1 "Level chips" token. Required on create even
            though the column is nullable: a level with no colour is a hole in
            the picker, the ticket grid and the Priority Split chart at once.
        defaultSlaHrs: { type: [number, 'null'], format: double, minimum: 0 }
        autoEscalates:
          type: [boolean, 'null']
          description: |
            `true` clears the flag from every other level — it is single-writer.
            Omitted means `false`.
        seq: { type: [integer, 'null'], format: int32 }
        isActive: { type: [boolean, 'null'] }
    PriorityPatchRequest:
      type: object
      description: |
        Every field optional; an omitted one keeps its stored value.
        `isActive: false` is how a level is retired — there is no delete.
      properties:
        level:
          $ref: '#/components/schemas/Level'
          description: |
            Here **only so that a changed one can be refused with `409`.**
            Omitting it from the schema would let Jackson discard it silently
            and report a rename that did not happen. `tickets.level` stores this
            value and is not a foreign key, so a rename orphans history rather
            than cascading. Resending the stored value is a no-op.
        name: { type: string, minLength: 1, maxLength: 40 }
        colour: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        defaultSlaHrs: { type: [number, 'null'], format: double, minimum: 0 }
        autoEscalates: { type: [boolean, 'null'] }
        seq: { type: [integer, 'null'], format: int32 }
        isActive: { type: [boolean, 'null'] }
    NotificationChannel:
      type: string
      enum: [IN_APP, EMAIL, PUSH]
      description: |
        How a notification reaches somebody — D-042's three, and the values
        `notification_templates.channel` holds.

        **The bell is not one of them.** It counts what was written, and it
        renders the same title and body the in-app toast does, from the `IN_APP`
        template. So blueprint §11's "popup" and "bell" columns are one template
        rather than two, and an event ticked bell-only in §11 still has an
        `IN_APP` template — what makes it bell-only is D-043's popup rule, not
        the absence of wording.

        A-007's column comment predicted `POPUP | BELL | EMAIL` and is
        superseded; it was written before D-042 existed. §7.7's Teams, Slack and
        WhatsApp are marked optional with no owner and are not here.
    NotificationRecipient:
      type: string
      enum:
        [ASSIGNEE, STAGE_OWNER, PREVIOUS_ASSIGNEE, REPORTER, PROJECT_MANAGER,
         REPORTING_MANAGER, SUPPORT_DESK, WATCHERS, MENTIONED_USER, CLIENT_CONTACT,
         REQUESTER, ALL_USERS, ADMIN]
      description: |
        Who a notification goes to — blueprint §11's "To" column.

        **These are positions relative to one ticket, not roles**, which is why
        this is a closed vocabulary rather than a list of role ids. `ASSIGNEE` is
        a column on `tickets`, `WATCHERS` a join table, `MENTIONED_USER` comes
        out of the comment that fired the event, and `CLIENT_CONTACT` is not a
        platform user at all — which is why `email_log.to_user_id` is nullable.

        `PROJECT_MANAGER` and `REPORTING_MANAGER` share a spelling with a role
        code and are still not role lookups: they mean the PM *of this ticket's
        project* and the reporting manager *of this ticket's assignee*. `ADMIN`
        is the one that is a role lookup, and it is here rather than as a foreign
        key because it is one member of a vocabulary whose other twelve are not.

        Every value resolves to nobody under some conditions — an unassigned
        ticket has no assignee, an internal one no client contact — and that is a
        normal send of nothing rather than an error.
    NotificationTemplate:
      type: object
      description: |
        S-15. The wording of one notification, for one channel.

        The `(eventCode, channel)` pair is the row's identity and is immutable —
        the unique key is over it, the renderer resolves by it, and sent
        `email_log` rows point at this `id`.

        Every property is populated on every response and none is `required` —
        B-016's call on `Project.status`, repeated by B-020 and B-021.
      properties:
        id: { type: integer, format: int64 }
        eventCode:
          type: string
          description: |
            A `NotificationEvent` — the §11 matrix as a closed vocabulary, plus
            the four codes Stream D and A-044 added that §11 does not list.
            Served by `getNotificationTemplateVocabulary`; not an enum here
            because Stream D owns the list and it grows with their producers.
        category:
          type: string
          enum: [MENTION, ASSIGNMENT, ESCALATION, STATUS_REQUEST, OTHER]
          description: |
            What kind of thing happened — S-26's tabs group on it, and D-036's
            mandatory-mail rule is stated over it. The S-15 grid uses it to
            group, and to explain *why* a template is locked.
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        recipients:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/NotificationRecipient' }
          description: |
            Never empty. A template with no recipients is a row that looks
            configured and sends nothing; switching it off says so instead.
        subjectTemplate:
          type: [string, 'null']
          maxLength: 255
          description: |
            Null on every seeded in-app template — a bell entry has a title, not
            a subject. Required for `EMAIL`.

            Written **without** the `[CRM-26-00347]` prefix: `OutboxEnqueuer`
            prepends the ticket code itself (D-031) so no event can ship without
            it, and repeating it here would double it on every mail.
        bodyTemplate:
          type: string
          description: |
            HTML for `EMAIL`, plain text for the other two. May contain any
            `{{merge_tag}}` from the vocabulary and is refused if it contains one
            that is not.
        isActive:
          type: boolean
          description: |
            Switching a template off silences that event on that channel,
            org-wide. See `isMandatory` for the ones that cannot be.
        isMandatory:
          type: boolean
          description: |
            **Derived, never stored** — `channel == EMAIL` and the event's
            category is `ASSIGNMENT`, `ESCALATION` or `STATUS_REQUEST`, which is
            exactly D-036's `isMandatoryMail`. True means `isActive` cannot be
            set false and the screen should render the toggle as a locked
            statement rather than a control whose only outcome is a `409`.

            A stored column would be a second copy of a rule that is deliberately
            stated over the category, so that an escalation event added next
            month is covered the moment it is declared.
    NotificationTemplateListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NotificationTemplate' } }
    NotificationTemplateResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/NotificationTemplate' } }
    NotificationEventOption:
      type: object
      required: [code, category, mandatoryMail]
      properties:
        code: { type: string }
        category:
          type: string
          enum: [MENTION, ASSIGNMENT, ESCALATION, STATUS_REQUEST, OTHER]
        mandatoryMail:
          type: boolean
          description: |
            The `EMAIL` template for this event cannot be switched off. Lets the
            screen lock the toggle before the click rather than after the `409`.
    NotificationTemplateVocabulary:
      type: object
      required: [events, channels, recipients, mergeTags]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/NotificationEventOption' }
        channels:
          type: array
          items: { $ref: '#/components/schemas/NotificationChannel' }
        recipients:
          type: array
          items: { $ref: '#/components/schemas/NotificationRecipient' }
        mergeTags:
          type: array
          items: { type: string }
          description: |
            The placeholder names, without braces — `ticket_id`, not
            `{{ticket_id}}`. Blueprint §4B.6's five are in here spelled exactly
            as it spells them; the rest are the fields it says a mail body
            carries, plus what its subject table interpolates.
    NotificationTemplateVocabularyResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/NotificationTemplateVocabulary' } }
    NotificationTemplateWriteRequest:
      type: object
      required: [eventCode, channel, recipients, bodyTemplate]
      properties:
        eventCode: { type: string, minLength: 1, maxLength: 60 }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        recipients:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/NotificationRecipient' }
        subjectTemplate:
          type: [string, 'null']
          maxLength: 255
          description: Required when `channel` is `EMAIL`; optional otherwise.
        bodyTemplate: { type: string, minLength: 1 }
        isActive:
          type: [boolean, 'null']
          description: |
            Omitted means `true`. Creating a mandatory `EMAIL` template already
            switched off is refused with `409`, the same as switching one off
            later.
    NotificationTemplatePatchRequest:
      type: object
      description: |
        Every field optional; an omitted one keeps its stored value.
        `isActive: false` switches the template off — there is no delete.
      properties:
        eventCode:
          type: string
          description: |
            Here **only so that a changed one can be refused with `409`.**
            Omitting it from the schema would let Jackson discard it silently and
            report a re-pointing that did not happen.
        channel:
          $ref: '#/components/schemas/NotificationChannel'
          description: Same — present to be refused if changed, a no-op if resent.
        recipients:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/NotificationRecipient' }
        subjectTemplate:
          type: [string, 'null']
          maxLength: 255
          description: |
            Explicitly `null` clears it; omitted keeps it. The two mean different
            things here, which is why the server binds this field through a POJO
            rather than a record — a record would collapse both into "clear it"
            and strip the subject off a mail on a patch that only touched
            `isActive`.
        bodyTemplate: { type: string, minLength: 1 }
        isActive: { type: [boolean, 'null'] }
    Holiday:
      type: object
      required: [id, date, name, isRecurring, isActive]
      properties:
        id: { type: integer, format: int64 }
        date: { type: string, format: date }
        name: { type: string, maxLength: 120 }
        projectId:
          type: [integer, 'null']
          format: int64
          description: |
            `null` is org-wide. A project holiday adds to the org calendar for
            that project rather than replacing it.
        isRecurring:
          type: boolean
          description: |
            A fixed-date annual holiday, stored **once**. The working-hours
            service expands it per year, so a plain date-range query over the
            master does not see next year's occurrence.
        isActive: { type: boolean }
    HolidayResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Holiday' }
    HolidayWriteRequest:
      type: object
      required: [date, name]
      properties:
        date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 120 }
        projectId: { type: [integer, 'null'], format: int64 }
        isRecurring: { type: boolean, default: false }
        isActive: { type: boolean, default: true }
    WeeklyOff:
      type: array
      items: { type: integer, minimum: 1, maximum: 7 }
      uniqueItems: true
      maxItems: 6
      examples: [[6, 7]]
      description: |
        Non-working days of the week as **ISO-8601 day numbers**:
        `1` Mon, `2` Tue, `3` Wed, `4` Thu, `5` Fri, `6` Sat, `7` Sun.
        A standard weekend is `[6, 7]`.

        This is exactly `java.time.DayOfWeek.getValue()`, so the backend reads
        and writes it with no conversion. `0` is not a valid value, and the
        database rejects it.

        **JavaScript callers must convert at the boundary.** `Date.getDay()` is
        Sunday-zero-based (Sun `0` … Sat `6`), which collides with this range
        everywhere except Sat: use `getDay() || 7`. This field previously said
        "ISO" while constraining `0–6`, and the mock sent `[0, 6]` — under that
        reading a backend using `DayOfWeek` treats **Sunday as a working day**,
        which silently mis-states every SLA spanning a weekend. Convert in one
        place; a per-component conversion just relocates the bug.

        At most six days: a seven-day weekend leaves `addWorkingHours` searching
        for a working day that does not exist.
    WorkingWeek:
      type: object
      required: [weeklyOff, workDayStart, workDayEnd, timezone]
      properties:
        weeklyOff: { $ref: '#/components/schemas/WeeklyOff' }
        workDayStart: { type: string, examples: ['09:30'] }
        workDayEnd: { type: string, examples: ['18:30'] }
        timezone:
          type: string
          examples: ['Asia/Kolkata']
          description: |
            The zone `workDayStart` and `workDayEnd` are read in. Storage is UTC
            everywhere, but a working day is a local fact — 09:30 in Kolkata is
            not 09:30 in UTC — so the pair is meaningless without this.
    WorkingWeekResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/WorkingWeek' }
    WorkingWeekUpdateRequest:
      type: object
      required: [weeklyOff, workDayStart, workDayEnd, timezone]
      properties:
        weeklyOff: { $ref: '#/components/schemas/WeeklyOff' }
        workDayStart: { type: string, examples: ['09:30'] }
        workDayEnd: { type: string, examples: ['18:30'] }
        timezone: { type: string, examples: ['Asia/Kolkata'] }
    LeaveStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
      description: |
        Only `APPROVED` stops the SLA clock — a pending request must not, or the
        target depends on paperwork nobody has signed.
    LeaveType:
      type: string
      enum: [PLANNED, SICK, COMP_OFF, OTHER]
    ResourceLeave:
      type: object
      required: [id, userId, startDate, endDate, isHalfDay, status]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          description: Inclusive, and never earlier than `startDate`.
        leaveType: { $ref: '#/components/schemas/LeaveType' }
        isHalfDay:
          type: boolean
          description: |
            A flag, not a count of hours — the working-hours service resolves it
            against that user's `dailyCapacityHrs`.
        status: { $ref: '#/components/schemas/LeaveStatus' }
        reason: { type: [string, 'null'], maxLength: 255 }
    ResourceLeaveResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ResourceLeave' }
    ResourceLeaveListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ResourceLeave' } }
        meta: { $ref: '#/components/schemas/Meta' }
    ResourceLeaveWriteRequest:
      type: object
      required: [userId, startDate, endDate]
      properties:
        userId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        leaveType: { $ref: '#/components/schemas/LeaveType' }
        isHalfDay: { type: boolean, default: false }
        status: { $ref: '#/components/schemas/LeaveStatus' }
        reason: { type: [string, 'null'], maxLength: 255 }
    HolidayPatchRequest:
      type: object
      description: |
        Every field optional. Separate from `HolidayWriteRequest` because a
        create needs a date and a name and an edit does not — sharing one schema
        made a name-only `PATCH` a 400.
      properties:
        date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 120 }
        projectId: { type: [integer, 'null'], format: int64 }
        isRecurring: { type: boolean }
        isActive: { type: boolean }
    ResourceLeavePatchRequest:
      type: object
      description: |
        Every field optional — approving is `{"status": "APPROVED"}` alone.
      properties:
        userId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        leaveType: { $ref: '#/components/schemas/LeaveType' }
        isHalfDay: { type: boolean }
        status: { $ref: '#/components/schemas/LeaveStatus' }
        reason: { type: [string, 'null'], maxLength: 255 }
    HolidayListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            holidays:
              type: array
              items: { $ref: '#/components/schemas/Holiday' }
            weeklyOff: { $ref: '#/components/schemas/WeeklyOff' }
            workDayStart: { type: string, examples: ['09:30'] }
            workDayEnd: { type: string, examples: ['18:30'] }
    WorkflowStage:
      type: object
      properties:
        stageCode: { type: string }
        displayName: { type: string }
        sequence: { type: integer }
        ownerRole: { $ref: '#/components/schemas/RoleCode' }
        icon: { type: [string, 'null'] }
        stageSlaHrs: { type: [number, 'null'], format: double }
        isOptional: { type: boolean }
        canReturnTo:
          type: array
          items: { type: string }
          description: Allowed backward targets. Stored as JSON — MySQL has no array type.
        isDeprecated: { type: boolean, description: 'Deprecated, never deleted — historical ribbons depend on it.' }
    WorkflowTemplate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        version: { type: integer }
        projectId: { type: [integer, 'null'], format: int64 }
        taskTypeId: { type: [integer, 'null'], format: int64 }
        isActive: { type: boolean }
        stages: { type: array, items: { $ref: '#/components/schemas/WorkflowStage' } }
    WorkflowTemplateWriteRequest:
      type: object
      required: [name, stages]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        projectId: { type: [integer, 'null'], format: int64 }
        taskTypeId: { type: [integer, 'null'], format: int64 }
        stages: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WorkflowStage' } }
    WorkflowTemplateResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/WorkflowTemplate' } }
    WorkflowTemplateListResponse:
      type: object
      required: [data]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/WorkflowTemplate' } } }

    # ── dashboard & reports ───────────────────────────────────────────────
    DashboardSummaryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            asOf: { type: string, format: date-time, description: Summary tables refresh every five minutes. }
            cards:
              type: array
              items:
                type: object
                properties:
                  key: { type: string, examples: [open] }
                  label: { type: string }
                  value: { type: number }
                  deltaPct: { type: [number, 'null'] }
                  sparkline: { type: array, items: { type: number } }
                  drillDown: { type: string, examples: ['/tickets?status=OPEN&level=CRITICAL'] }
    WidgetResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            key: { type: string }
            asOf: { type: string, format: date-time }
            # A-056 · additive and optional. Non-null when the caller's role has
            # no summary table that can answer this widget — the delivery roles
            # read `resource_daily_stats`, which carries no task-type split, no
            # four-way priority breakdown and no aging buckets.
            #
            # Deliberately not an empty `series` and not a 404. An empty series
            # renders as "no tickets matched", which is a claim about the data
            # and is false; a 404 on a route the role legitimately holds reads
            # as a bug and has the client retry. Stating it also stops the
            # frontend re-deriving the role rule for itself, which is the drift
            # `DashboardScope` exists on the server to prevent.
            #
            # ⚠️ contracts/ is Stream D's — flagged for Debashis (D-001).
            unavailableReason: { type: [string, 'null'] }
            series:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        x: { type: [string, number] }
                        y: { type: number }
                        drillDown: { type: [string, 'null'] }
    ReportCategory:
      type: string
      description: >
        A-063 · the hub groups its cards by this. §7.8 lists eighteen reports in
        one table; eighteen ungrouped cards is a wall, and the grouping people
        actually use when asking for a report is by subject.
      enum: [PEOPLE, DELIVERY, QUALITY, WORKFLOW, OPERATIONS]
    ReportFilterKind:
      type: string
      description: >
        Which controls the viewer draws for a report. §7.8's five filters, plus
        CLIENT, which D-001 already accepted as a query parameter.
      enum: [DATE_RANGE, PROJECT, RESOURCE, TASK_TYPE, LEVEL, CLIENT]
    ReportDescriptor:
      type: object
      required: [key, title, category, filters, available]
      properties:
        key: { type: string, examples: [date-wise] }
        title: { type: string, examples: [Date-wise Report] }
        description:
          type: string
          description: One line, shown on the card. What question the report answers.
        category: { $ref: '#/components/schemas/ReportCategory' }
        chart:
          type: [string, 'null']
          enum: [line, bar, stacked-bar, donut, null]
          description: >
            The visual §7.8 names for this report, or null for a report that is
            a table only. The viewer shows a chart *and* a table when this is
            set — never a chart alone, because a chart cannot be read for exact
            values and this is a reporting screen.
        filters:
          type: array
          description: >
            Only the filters this report honours. The viewer renders exactly
            these, so a control the runner would ignore is never drawn.
          items: { $ref: '#/components/schemas/ReportFilterKind' }
        available:
          type: boolean
          description: False for a report declared but not yet built (A-066–A-068).
        unavailableReason:
          type: [string, 'null']
          description: >
            Why it cannot be run yet, in a sentence a user can read. Present
            exactly when `available` is false. Same contract as the dashboard's
            widget `unavailableReason` (A-056).
    ReportCatalogueResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [reports]
          properties:
            reports:
              type: array
              items: { $ref: '#/components/schemas/ReportDescriptor' }
            scopeNote:
              type: [string, 'null']
              description: >
                Set when the caller's rows will be narrower than the whole
                organisation — "these reports cover your own work only" for a
                delivery role, or "your projects" for a PM. Null for Admin.
                Stated once here rather than repeated on every card.
        meta: { $ref: '#/components/schemas/Meta' }
    ReportResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            reportKey: { type: string }
            columns:
              type: array
              items:
                type: object
                # A-063 · required, so the generated client types them as
                # present. They always are — a column with no key cannot be
                # looked up in a row and a column with no type cannot be
                # aligned or formatted — and leaving them optional pushed a
                # null check into every renderer for a state the server cannot
                # produce.
                required: [key, label, type]
                properties:
                  key: { type: string }
                  label: { type: string }
                  type: { type: string, enum: [string, number, date, duration, percent] }
            rows: { type: array, items: { type: object, additionalProperties: true } }
        meta:
          allOf:
            - { $ref: '#/components/schemas/Meta' }
            - type: object
              properties:
                appliedScope:
                  type: [string, 'null']
                  description: >
                    A-063 · what the server actually narrowed the rows to, e.g.
                    "your own work" or "projects 1, 4". Present because a
                    delivery role's `?resourceId=` is ignored silently: without
                    this, a filter that did nothing would be indistinguishable
                    from a filter that matched nothing.
    ReportScheduleRequest:
      type: object
      required: [reportKey, cadence, recipients]
      properties:
        reportKey: { type: string }
        cadence: { type: string, enum: [DAILY, WEEKLY, MONTHLY] }
        format: { type: string, enum: [xlsx, csv, pdf], default: xlsx }
        recipients: { type: array, minItems: 1, items: { type: string, format: email } }
        parameters: { type: object, additionalProperties: true }

    # ── notifications, chat, mail, audit ──────────────────────────────────
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        eventKey: { type: string, examples: [TICKET_HANDED_OFF] }
        title: { type: string }
        body: { type: string }
        ticketId: { type: [string, 'null'] }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        deepLink: { type: string }
    NotificationListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        meta:
          allOf:
            - { $ref: '#/components/schemas/Meta' }
            - type: object
              properties:
                unreadCount: { type: integer }
    PushPublicKeyResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [publicKey]
          properties:
            publicKey:
              type: string
              description: >
                base64url, unpadded — the uncompressed P-256 point the Web Push
                API expects as `applicationServerKey`.
              examples: ['BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U']
    PushSubscriptionRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 500 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              maxLength: 128
              description: base64url of the browser's public key (RFC 8291).
            auth:
              type: string
              maxLength: 32
              description: base64url of the 16-byte auth secret.
        userAgent:
          type: [string, 'null']
          maxLength: 255
          description: >
            So somebody can tell which of their devices a subscription is. Sent
            by the client rather than read from the request header, because the
            header describes whatever made the HTTP call and the subscription
            belongs to the browser that granted permission.
    NotificationPreferenceMatrix:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationPreferenceRow' }
    NotificationPreferenceRow:
      type: object
      required: [eventKey, category, inApp, email, emailLocked]
      properties:
        eventKey: { type: string, example: SLA_BREACHED }
        category:
          type: string
          enum: [MENTION, ASSIGNMENT, ESCALATION, STATUS_REQUEST, OTHER]
          description: S-26's grouping, so the grid can be sectioned without a second mapping.
        inApp:
          type: boolean
          description: >
            Whether the D-043 toast fires. Turning it off never suppresses the
            bell entry — S-26 is where you go to find what you missed.
        email: { type: boolean }
        emailLocked:
          type: boolean
          description: >
            D-036. This mail cannot be switched off. Sent rather than inferred
            from the category so the rule has one home.
        push:
          type: boolean
          description: |
            D-045. Whether a browser notification fires for this event, on every
            device the user has granted permission on.

            There is deliberately **no `pushLocked`**. §7.7 gives the guarantee
            to mail; a push only reaches a browser that is still subscribed, on a
            device that is switched on, for a permission the user can revoke in
            their own browser settings without telling us. Locking a channel we
            cannot promise would be a guarantee in name only — an escalation
            whose push is off still sends its mail, which is the promise that was
            actually made.

            A user with no subscription simply receives nothing on this channel;
            the switch is about intent, not about whether a browser exists.
    NotificationPreferenceUpdateRequest:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items: { $ref: '#/components/schemas/NotificationPreferenceUpdate' }
    NotificationPreferenceUpdate:
      type: object
      required: [eventKey]
      properties:
        eventKey: { type: string }
        inApp: { type: boolean, description: Omit to leave this channel unchanged. }
        email: { type: boolean, description: Omit to leave this channel unchanged. }
        push: { type: boolean, description: Omit to leave this channel unchanged. }
    PendingNotificationsResponse:
      type: object
      required: [data, hasMore]
      description: >
        D-046. No cursor: this is drained by acknowledging, not by paging, so
        the next call returns whatever is still unacknowledged.
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        hasMore:
          type: boolean
          description: More were queued than the cap returned.
    NotificationsDeliveredRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 0
          items: { type: integer, format: int64 }
          description: Notification ids the client has shown to the user.
    ChatThread:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [TICKET, DIRECT, PROJECT] }
        title: { type: string }
        ticketId: { type: [string, 'null'] }
        unreadCount: { type: integer }
        lastMessageAt: { type: [string, 'null'], format: date-time }
        participants: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
    ChatThreadListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ChatThread' } }
        meta: { $ref: '#/components/schemas/Meta' }
    ChatMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        body: { type: string }
        author: { $ref: '#/components/schemas/UserRef' }
        kind: { type: string, enum: [TEXT, STATUS_REQUEST, SYSTEM], default: TEXT }
        isEdited: { type: boolean }
        isDeleted: { type: boolean }
        editableUntil: { type: [string, 'null'], format: date-time }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        readBy: { type: array, items: { type: integer, format: int64 } }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
          description: >
            Resolved server-side from the body; the request never supplies it, or
            a caller could aim the notification fan-out at anybody. Only thread
            participants resolve — any other `@handle` stays plain text. Retained
            on a deleted message, whose body is withheld.
        ticketRefs:
          type: array
          items: { $ref: '#/components/schemas/TicketCard' }
          description: |
            D-054 · the `CRM-26-00347` mentions in the body, resolved into cards
            (§7.6). Parsed server-side from the body, like `mentions`.

            **Resolved per reader, on every read — never stored.** Two people
            reading the same message are entitled to different answers, and the
            card carries live state (level, status, stage, holder, lateness)
            rather than how the ticket looked when somebody typed its code.

            A code with no card here **renders as plain text**. That covers a
            ticket the reader may not see and one that does not exist, and the
            two are deliberately indistinguishable — otherwise pasting a range
            of codes would report back which are real.

            Always empty on a deleted message: the body is withheld, so nothing
            in it named anything.

            The blueprint writes this as `TKT-xxxx`; no ticket has ever looked
            like that. C-011 mints `{PROJECT}-{YY}-{NNNNN}`, and that is what is
            matched — see `TicketId`.
        createdAt: { type: string, format: date-time }
    TicketCard:
      type: object
      description: |
        A ticket reference unfurled inside a chat message (§7.6). The fields are
        §4A.1's own compact row plus the stage, because a reference in chat is
        usually asking where something has got to.

        Deliberately carries no description, steps to reproduce or client: a
        preview is a convenience, and one that copies a client's words into a
        thread they were never sent to is not.
      required: [ticketId, title, level, status, isDelayed]
      properties:
        ticketId: { $ref: '#/components/schemas/TicketId' }
        title: { type: string }
        level: { $ref: '#/components/schemas/Level' }
        status: { $ref: '#/components/schemas/StatusCode' }
        currentStageCode: { type: [string, 'null'] }
        assignee: { $ref: '#/components/schemas/UserRef' }
        plannedCloseDate: { type: [string, 'null'], format: date-time }
        isDelayed: { type: boolean }
    TicketCardListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TicketCard' } }
    ChatMessageResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/ChatMessage' } }
    ChatSearchHit:
      type: object
      description: >
        A message found out of context, so it names its thread. Deliberately not
        a `ChatMessage`: a hit carries no `readBy`, `mentions` or `editableUntil`
        — each would cost a query to populate honestly, and would be an empty
        lie otherwise.
      properties:
        messageId: { type: integer, format: int64 }
        threadId: { type: integer, format: int64 }
        threadKind: { type: string, enum: [TICKET, DIRECT, PROJECT] }
        threadTitle: { type: [string, 'null'] }
        ticketId: { type: [string, 'null'], description: 'Ticket code, not the row id.' }
        body: { type: string }
        author: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
    ChatSearchResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ChatSearchHit' } }
        meta: { $ref: '#/components/schemas/Meta' }
    ChatMessageListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        meta: { $ref: '#/components/schemas/Meta' }
    StatusRequest:
      type: object
      description: >
        One "Ask Status" (§7.6) and, once it has been answered, how long it took.
      required: [id, ticketId, threadId, requestMessageId, requestedBy, askedOf, requestedAt, isAnswered]
      properties:
        id: { type: integer, format: int64 }
        ticketId: { type: string, description: 'Ticket code, not the row id.' }
        ticketTitle: { type: string }
        threadId: { type: integer, format: int64 }
        requestMessageId:
          type: integer
          format: int64
          description: 'The `kind: STATUS_REQUEST` message in the thread.'
        requestedBy: { $ref: '#/components/schemas/UserRef' }
        askedOf:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          description: >
            The assignee at the moment of asking. Never rewritten by a later
            reassignment — the metric is about the person actually asked.
        requestedAt: { type: string, format: date-time }
        note:
          type: [string, 'null']
          description: >
            The request message's body as it stands, and `null` once its author
            has deleted it. Read from the message rather than copied, so §7.6's
            tombstone reaches it like anything else said on the ticket.
        isAnswered: { type: boolean }
        answerMessageId: { type: [integer, 'null'], format: int64 }
        answeredAt: { type: [string, 'null'], format: date-time }
        responseWorkingMinutes:
          type: [integer, 'null']
          description: >
            **Working minutes, not wall clock.** A manager who asks at 18:00 on
            Friday and is answered at 09:30 on Monday waited half a working hour,
            not sixty-three hours; the org calendar, project holidays and the
            resource's approved leave are all honoured (B-024). Stamped once when
            the request is answered and never recomputed, so a holiday added
            later cannot restate a figure somebody has already reported. Both
            instants are here too, so wall-clock stays derivable.
    StatusRequestResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StatusRequest' }
    StatusRequestListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StatusRequest' } }
    EmailLogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        toAddress: { type: string, format: email }
        subject: { type: string }
        eventKey: { type: string }
        status: { type: string, enum: [QUEUED, SENT, BOUNCED, FAILED] }
        retryCount: { type: integer }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        providerMessageId: { type: [string, 'null'] }
        sentAt: { type: [string, 'null'], format: date-time }
    EmailLogListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/EmailLogEntry' } }
        meta: { $ref: '#/components/schemas/Meta' }
    AuditLogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor: { $ref: '#/components/schemas/UserRef' }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        ipAddress: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'] }
        detail: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditLogListResponse:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } }
        meta: { $ref: '#/components/schemas/Meta' }
