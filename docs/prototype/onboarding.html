<title>EduTrack Client Onboarding</title>
<style>
  :root{
    --bg-app:#F7F8FC; --bg-surface:#FFFFFF; --bg-subtle:#F1F3F9; --border:#E5E8F0;
    --primary:#4F46E5; --primary-soft:#EEF2FF; --text:#111827; --text-2:#6B7280;
    --success:#10B981; --success-soft:#ECFDF5; --warning:#F59E0B; --warning-soft:#FFFBEB;
    --danger:#EF4444; --danger-soft:#FEF2F2; --info:#3B82F6; --info-soft:#EFF6FF;
    --chart-1:#4F46E5; --chart-2:#06B6D4;
    --shadow:0 1px 2px rgba(16,24,40,.05); --shadow-lg:0 8px 24px rgba(16,24,40,.10);
    --r-card:12px; --r-input:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg-app);color:var(--text);font:14px/20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  h1{font-size:24px;line-height:32px;font-weight:600} h2{font-size:20px;line-height:28px;font-weight:600}
  h3{font-size:16px;line-height:24px;font-weight:600} .cap{font-size:12px;line-height:16px;color:var(--text-2)}
  .eyebrow{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
  a{color:var(--primary)} button{font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
  input,select,textarea{font:inherit;color:var(--text);background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-input);padding:8px 10px;width:100%}
  label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:0 0 4px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text);border-radius:var(--r-input);padding:8px 14px;font-weight:500}
  .btn:hover{background:var(--bg-subtle)}
  .btn-p{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-p:hover{background:#4338CA}
  .btn-danger{background:var(--danger-soft);border-color:#FECACA;color:#B91C1C}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--primary)}
  .btn-sm{padding:4px 10px;font-size:12px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:20px}
  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .chip-green{background:var(--success-soft);color:#047857}.chip-amber{background:var(--warning-soft);color:#B45309}
  .chip-red{background:var(--danger-soft);color:#B91C1C}.chip-blue{background:var(--info-soft);color:#1D4ED8}
  .chip-indigo{background:var(--primary-soft);color:var(--primary)}.chip-grey{background:var(--bg-subtle);color:var(--text-2)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{background:var(--bg-subtle);text-align:left;font-size:12px;color:var(--text-2);font-weight:600;padding:8px 12px;white-space:nowrap}
  td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:top}
  tr.rowlink{cursor:pointer} tr.rowlink:hover td{background:var(--bg-subtle)}
  .tblwrap{overflow-x:auto}
  .grid{display:grid;gap:16px}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
  /* ---------- login & launcher ---------- */
  .center-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:24px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
  .login-card{width:400px;max-width:100%}
  .demo-users{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .demo-users button{border:1px solid var(--border);background:var(--bg-subtle);border-radius:999px;padding:3px 10px;font-size:12px}
  .demo-users button:hover{background:var(--primary-soft);color:var(--primary)}
  .err{background:var(--danger-soft);color:#B91C1C;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
  .mod-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .mod-card{width:320px;max-width:100%;text-align:left;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;transition:box-shadow .15s ease-out,transform .15s ease-out}
  .mod-card:not([disabled]):hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .mod-card[disabled]{opacity:.55;cursor:not-allowed}
  .mod-ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh}
  .side{width:230px;flex:none;background:var(--bg-surface);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
  .side .logo{padding:4px 10px 14px}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 12px;color:var(--text-2);font-weight:500}
  .nav-btn:hover{background:var(--bg-subtle);color:var(--text)}
  .nav-btn.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .nav-sec{margin:14px 12px 4px}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;background:var(--bg-surface);border-bottom:1px solid var(--border);padding:10px 24px;position:sticky;top:0;z-index:30}
  .topbar .sp{flex:1}
  .content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%;margin:0 auto}
  .page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .page-head .sp{flex:1}
  .bell{position:relative;border:1px solid var(--border);background:var(--bg-surface);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
  .bell .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--bg-surface)}
  .notif-pop{position:absolute;right:24px;top:54px;width:380px;max-width:calc(100vw - 32px);background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-lg);z-index:50;overflow:hidden}
  .notif-item{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);font-size:13px}
  .notif-item.unread{background:var(--primary-soft)}
  /* ---------- KPI tiles ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
  .kpi{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 20px}
  .kpi .v{font-size:28px;line-height:36px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi .d{font-size:12px;margin-top:2px}
  /* ---------- charts ---------- */
  .hbar-row{display:grid;grid-template-columns:190px 1fr 34px;align-items:center;gap:10px;padding:4px 0}
  .hbar-lbl{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar-track{height:18px;display:flex;align-items:center}
  .hbar{height:14px;border-radius:0 4px 4px 0;background:var(--chart-1);min-width:2px;transition:width .2s ease-out}
  .hbar-val{font-size:12px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .vbars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:8px 4px 0}
  .vbar-g{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .vbar-stack{display:flex;align-items:flex-end;gap:3px;height:130px}
  .vbar{width:22px;border-radius:4px 4px 0 0;background:var(--chart-1);min-height:2px}
  .vbar.c2{background:var(--chart-2)}
  .vbar-x{font-size:11px;color:var(--text-2);white-space:nowrap}
  .vbar-v{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--text-2);align-items:center;flex-wrap:wrap}
  .legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
  .tooltip{position:fixed;z-index:99;background:#1F2937;color:#F9FAFB;border-radius:8px;padding:7px 10px;font-size:12px;line-height:17px;pointer-events:none;box-shadow:var(--shadow-lg);max-width:260px;display:none}
  /* ---------- RAG board ---------- */
  .rag-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .rag-col{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
  .rag-col .hd{padding:10px 16px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
  .rag-card{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 16px;border-top:1px solid var(--border);font-size:13px}
  .rag-card:first-of-type{border-top:0}
  .rag-card:hover{background:var(--bg-subtle)}
  /* ---------- ribbon ---------- */
  .ribbon-wrap{overflow-x:auto;padding:6px 2px 10px}
  .ribbon{display:flex;align-items:stretch;min-width:max-content}
  .seg{width:148px;flex:none;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);padding:10px 12px;text-align:left;cursor:pointer;position:relative;transition:box-shadow .15s ease-out}
  .seg:hover{box-shadow:var(--shadow-lg)}
  .seg.sel{outline:2px solid var(--primary);outline-offset:1px}
  .seg .st{font-size:11px;font-weight:700;display:flex;gap:5px;align-items:center;margin-bottom:4px}
  .seg .nm{font-size:12.5px;font-weight:600;line-height:16px;min-height:32px}
  .seg .meta{font-size:11px;color:var(--text-2);margin-top:6px;display:flex;align-items:center;gap:6px}
  .seg-done{background:var(--success-soft);border-color:#A7F3D0}.seg-done .st{color:#047857}
  .seg-cur{background:var(--primary-soft);border-color:#C7D2FE}.seg-cur .st{color:var(--primary)}
  .seg-cur::after{content:"";position:absolute;inset:-5px;border:2px solid #C7D2FE;border-radius:13px;animation:pulse 2s ease-out infinite;pointer-events:none}
  @keyframes pulse{0%{opacity:.9}70%{opacity:0}100%{opacity:0}}
  .seg-pend .st{color:#9CA3AF}
  .seg-wait{background:var(--warning-soft);border-color:#FDE68A}.seg-wait .st{color:#B45309}
  .seg-block{border-left:4px solid var(--danger)}.seg-block .st{color:#B91C1C}
  .seg-breach{background:var(--danger-soft);border-color:#FECACA}.seg-breach .st{color:#B91C1C}
  .conn{width:26px;flex:none;display:flex;align-items:center}
  .conn i{display:block;width:100%;border-top:2px solid var(--success)}
  .conn.pend i{border-top-style:dashed;border-color:#D1D5DB}
  .tatbar{height:4px;border-radius:2px;background:rgba(17,24,39,.08);margin-top:8px;overflow:hidden}
  .tatbar i{display:block;height:100%;border-radius:2px;background:var(--success)}
  .tatbar.amber i{background:var(--warning)} .tatbar.red i{background:var(--danger)}
  /* ---------- misc ---------- */
  .split{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
  @media(max-width:980px){.split{grid-template-columns:1fr}}
  .tl{list-style:none}
  .tl li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--border);margin-left:8px}
  .tl li:last-child{padding-bottom:0}
  .tl li::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--bg-surface);border:3px solid var(--primary)}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tab{border:0;background:none;padding:9px 14px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.frow{grid-template-columns:1fr}}
  .steps-ind{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
  .steps-ind b{color:var(--primary)}
  .toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
  .toast{background:#1F2937;color:#F9FAFB;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;max-width:360px;animation:rise .2s ease-out}
  .toast.ok{border-left:4px solid var(--success)} .toast.warn{border-left:4px solid var(--warning)} .toast.bad{border-left:4px solid var(--danger)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .banner-live{background:var(--success-soft);border:1px solid #A7F3D0;color:#047857;border-radius:var(--r-card);padding:14px 20px;display:flex;gap:10px;align-items:center;font-weight:600}
  .otp{display:flex;gap:8px;justify-content:center}
  .otp input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:700}
  .mask{color:var(--text-2);letter-spacing:.12em}
  .chip-x{border:0;background:none;color:inherit;cursor:pointer;font-size:11px;padding:0 0 0 6px;line-height:1}
  .chip-x:hover{color:var(--danger)}
  /* animated status emojis (respect prefers-reduced-motion via the global rule) */
  .emo{display:inline-block;font-size:15px;line-height:1}
  .emo.up{animation:eBounce 1.2s ease-in-out infinite}
  .emo.hi{animation:ePop 1.4s ease-in-out infinite}
  .emo.down{animation:eShake 1.6s ease-in-out infinite}
  .emo.clap{animation:eClap 1s ease-in-out infinite}
  .emo.sad{animation:eSad 2s ease-in-out infinite}
  @keyframes eBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes ePop{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(8deg)}}
  @keyframes eShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  @keyframes eClap{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  @keyframes eSad{0%,100%{transform:translateY(0)}50%{transform:translateY(2px) rotate(-6deg)}}
  /* dashboard drill slide-over (S-06 pattern) */
  .dveil{position:fixed;inset:0;background:rgba(17,24,39,.34);z-index:90}
  .dpanel{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:94vw;background:var(--bg-surface);box-shadow:var(--shadow-lg);z-index:95;display:flex;flex-direction:column;animation:dslide .18s ease-out}
  @keyframes dslide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  .dpanel header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
  .dpanel .bd{flex:1;overflow:auto}
  .drow{display:flex;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--bg-subtle);font-size:13px;flex-wrap:wrap}
  .drow:hover{background:var(--bg-subtle)}
  button.kpi{text-align:left;cursor:pointer;transition:box-shadow .15s ease-out}
  button.kpi:hover{box-shadow:var(--shadow-lg)}
  /* v1.1 — journey accordions */
  .jacc{border:1px solid var(--border);border-radius:var(--r-card);background:var(--bg-surface);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .jstrip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 18px;background:none;border:0;flex-wrap:wrap}
  .jstrip:hover{background:var(--bg-subtle)}
  .jstrip .jname{font-weight:650;font-size:14px}
  .jstrip .jpct{font-weight:700;font-variant-numeric:tabular-nums}
  .jdots{display:inline-flex;gap:4px;align-items:center}
  .jdots i{width:10px;height:10px;border-radius:50%;display:block;background:var(--bg-subtle);border:1.5px solid var(--border)}
  .jdots i.g{background:var(--success);border-color:var(--success)}
  .jdots i.c{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
  .jdots i.a{background:var(--warning);border-color:var(--warning)}
  .jdots i.r{background:var(--danger);border-color:var(--danger)}
  .jdots i.w{background:#D1D5DB;border-color:#D1D5DB}
  .jbody{border-top:1px solid var(--border);padding:16px 18px;background:var(--bg-app)}
  /* prerequisites */
  .prq{border:1px solid var(--border);border-radius:var(--r-card);background:var(--bg-surface);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .prq-h{width:100%;text-align:left;border:0;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg-subtle);cursor:pointer}
  .prq-h:hover{background:var(--primary-soft)}
  .prq-body{display:none}
  .prq.open .prq-body{display:block}
  .prq-row{display:flex;gap:10px;align-items:flex-start;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
  .prq-row .ttl{font-size:13px;font-weight:600;min-width:200px;flex:1}
  .gatebar{height:6px;border-radius:3px;background:var(--bg-subtle);overflow:hidden;flex:1;min-width:120px}
  .gatebar i{display:block;height:100%;background:var(--success)}
  /* client portal */
  .ptop{background:var(--bg-surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px}
  .pwrap{max-width:900px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:18px}
  .empty{padding:28px;text-align:center;color:var(--text-2)}
  .empty .big{font-size:26px;margin-bottom:6px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  @media(max-width:860px){.side{display:none}.topbar .m-nav{display:block}}
  .m-nav{display:none}
</style>

<div id="app"></div>
<div class="toasts" id="toasts"></div>

// step statuses: DONE | CURRENT | WAITING | BLOCKED | PENDING
// serial dates: 1 = 01 Jun 2026 … 81 = 20 Aug (TODAY) … working days approximated as calendar days
function dstr(n){ const L=[["Jun",30],["Jul",31],["Aug",31],["Sep",30],["Oct",31]]; let m=0;
  while(n>L[m][1]){ n-=L[m][1]; m++; } return String(n).padStart(2,"0")+" "+L[m][0]; }
const TODAY_SER = 81;
function mkStepsFrom(TS, currentIdx, opts={}){
  let cur = opts.start ?? 58;
  return TS.map((t,i)=>{
    const st = {name:t.name, tat:t.tat, owner:t.owner, signoff:t.signoff, dep:(t.dep??null), docsReq:[...t.docs],
      subs: t.subs.map((n,k)=>({name:n, val: i<currentIdx?true : (i===currentIdx && k===0 ? true : null), remark:""})),
      docs:[], comms:[], status: i<currentIdx?"DONE": i===currentIdx?"CURRENT":"PENDING",
      pct: i<currentIdx?100: i===currentIdx?(opts.pct??30):0,
      signoffState:"NONE", due: i===currentIdx?(opts.due||"21 Aug, 15:00"):"", blockReason:"",
      completedOn:"", closed:"", sd:"", fd:""};
    if(i<currentIdx){
      st.completedOn = "earlier"; st.docs=[...t.docs];
      st.closed = i%4===1 ? "early" : (i%5===3 ? "late" : "ontime");
      const span = Math.max(1, t.tat + (st.closed==="late"?2 : st.closed==="early"?-Math.ceil(t.tat/3):0));
      st.sd = dstr(cur); st.fd = dstr(cur+span); cur += span+1;
    } else if(i===currentIdx){ st.sd = dstr(Math.min(cur, TODAY_SER)); }
    if(i===currentIdx && opts.status) st.status = opts.status;
    if(i===currentIdx && opts.block)  st.blockReason = opts.block;
    if(i===currentIdx && opts.signoffState) st.signoffState = opts.signoffState;
    return st;
  });
}

function stepRag(s){
  if(s.status==="DONE") return "GREEN";
  if(s.status==="BLOCKED" || s.pct>=100) return "RED";
  if(s.status==="WAITING") return "PAUSED";
  if(s.pct>=SETTINGS.amber) return "AMBER";
  return "GREEN";
}
function clientRag(c){
  if(c.status==="LIVE") return "LIVE";
  const open = c.journeys.filter(j=>j.gate!=="LOCKED");
  if(!open.length) return "GATE";
  const rags = open.flatMap(j=>j.steps).map(stepRag);
  if(rags.includes("RED")) return "RED";
  if(rags.includes("AMBER")) return "AMBER";
  return "GREEN";
}

  let e="",c="",t="";

    if(st.closed==="early"){e="🙌";c="hi";t="Completed before time";}
    else if(st.closed==="late"){e="👎";c="down";t="Closed delayed";}

  } else if(st.status==="BLOCKED"||st.status==="WAITING"){ e="😢";c="sad";t="Blocked / waiting"; }
  else if(st.status==="CURRENT"){ if(st.pct>=100){e="👎";c="down";t="Running delayed";} else {e="👏";c="clap";t="On time";} }
  return e?`<span class="emo ${c}" title="${t}" aria-label="${t}">${e}</span>`:"";

  const cls = used>tot ? "chip-red" : (used/tot>=0.75 && !j.steps.every(s=>s.status==="DONE")) ? "chip-amber" : "chip-grey";
  return `<span class="chip ${cls}" title="Working hours consumed vs the journey's total TAT">⏱ ${used}d / ${tot}d TAT${used>tot?" · overrun":""}</span>`;

/* ---- step actions (journey-aware: cid, ji = journey index, si = step index) ---- */
const jStep = (cid,ji,si)=>{ const c=CLIENTS.find(x=>x.id===cid); return {c, j:c.journeys[ji], s:c.journeys[ji].steps[si]}; };
function depReady(j, s){ return s.dep===null || s.dep===undefined || (j.steps[s.dep] && j.steps[s.dep].status==="DONE"); }
function activateReady(c, ji){
  // Dependency model: a step activates when its declared dependency is DONE
  // (or immediately, if it has none — such steps run in parallel).
  const j = c.journeys[ji];
  j.steps.forEach(s=>{
    if(s.status==="PENDING" && depReady(j, s)){
      s.status="CURRENT"; s.pct=5; s.due="Within "+s.tat+" working day(s)";
      pushNotif("▶️", "“"+s.name+"” ("+prodById(j.prod).name+") activated for "+c.name+" — assigned to "+uById(s.owner).name+".", c.id);
    }
  });
}
function activateNext(c, ji){
  const j = c.journeys[ji];
  if(j.steps.every(s=>s.status==="DONE")){
    pushNotif("🏁", prodById(j.prod).name+" journey complete for "+c.name+".", c.id);
    if(c.journeys.every(x=>x.steps.every(s=>s.status==="DONE"))){
      c.status="LIVE"; c.liveAt=TODAY;
      pushNotif("🎉", c.name+" is fully onboarded and LIVE across all products. CSAT survey sent to SPOC.", c.id);
      toast(c.name+" is LIVE — every journey complete and signed off. 🎉");
    } else toast(prodById(j.prod).name+" journey complete — other journeys still in flight.");
  } else activateReady(c, ji);
}

A.stBlock = (cid,ji,si)=>{ const el=$("blk-reason"); if(!el.value.trim()){ toast("A block reason is mandatory — it powers the ‘where is it stuck’ report.","bad"); return; }

function subsGate(s){
  const un = s.subs.filter(x=>x.val===null);
  if(un.length) return "Answer the full task list first — "+un.length+" still unanswered (e.g. “"+un[0].name+"”).";
  const nf = s.subs.find(x=>x.val===false && !x.remark.trim());
  if(nf) return "A False answer needs a remark — add one on “"+nf.name+"”.";
  return "";
}
A.subSet = (cid,ji,si,k,val)=>{ const {s}=jStep(cid,ji,si); const sb=s.subs[k];

A.stComplete = (cid,ji,si)=>{
  const {c,s}=jStep(cid,ji,si);

  if(s.signoff && s.signoffState!=="ACCEPTED"){ toast("This step needs client sign-off before it can complete — use ‘Request client sign-off’.","bad"); return; }

};

  let opened=false;
  c.journeys.forEach((j,ji)=>{ if(j.gate==="LOCKED"){ j.gate="OPEN"; activateReady(c, ji); opened=true; } });
  if(opened){ pushNotif("🔓","Prerequisites cleared for "+c.name+" — all journeys started, kickoff mails sent, owners notified.", c.id);
    toast("Gate open — journeys started for "+c.name+" 🎉"); }
}

function dueSerial(due){
  if(!due) return null;
  if(/today/i.test(due)) return TODAY_SER;
  const m=String(due).match(/(\d{1,2})\s+(Jun|Jul|Aug|Sep)/);
  if(!m) return null;
  return {Jun:0,Jul:30,Aug:61,Sep:92}[m[2]] + (+m[1]);
}
function dashItems(){
  const items=[];
  CLIENTS.forEach(c=>{
    if(c.status!=="ONBOARDING") return;
    c.journeys.forEach((j,ji)=>{ if(j.gate==="LOCKED") return;
      j.steps.forEach((st,si)=>{ if(["CURRENT","WAITING","BLOCKED"].includes(st.status)){
        const ser=dueSerial(st.due);
        items.push({c,ji,si,label:st.name, owner:uById(st.owner).name, due:st.due||"—",
          prod:prodById(j.prod).name, ser, overdue: st.pct>=100 || /missed/i.test(st.due||"") || (ser!==null&&ser<TODAY_SER)});
      }});});
    c.prereqs.forEach(t=>{ if(t.status==="PENDING"||t.status==="SUBMITTED"){
      const ser=dueSerial(t.due);
      items.push({c,ji:0,si:0,label:"Prerequisite: "+t.title, owner:"Client ("+(c.spocs[0]?c.spocs[0].name:"SPOC")+")",
        due:t.due||"—", prod:"Prerequisites", ser, overdue: ser!==null&&ser<TODAY_SER});
    }});
  });
  return items;
}

function delayedRows(){
  const out=[];
  CLIENTS.forEach(c=>{ if(c.status!=="ONBOARDING") return;
    c.journeys.forEach((j,ji)=>{ if(j.gate==="LOCKED") return;
      const bad=j.steps.map((st,si)=>({st,si})).filter(x=>stepRag(x.st)==="RED");
      if(!bad.length) return;
      const curI=j.steps.findIndex(st=>st.status!=="DONE");
      const cur=j.steps[curI];
      const ser=dueSerial(bad[0].st.due);
      const delay=Math.max(1, ser!==null? TODAY_SER-ser : 2);
      const remaining=j.steps.filter(st=>st.status!=="DONE").reduce((a,st)=>a+st.tat,0);
      out.push({c,ji,si:curI, start:c.onboardDate, prods:c.journeys.map(x=>prodById(x.prod).name).join(", "),
        mod:prodById(j.prod).name, stage:cur?cur.name:"—", owner:uById((cur||bad[0].st).owner).name,
        eta:dstr(TODAY_SER+remaining+delay)+" 2026", delay});
    });});
  return out;
}
function implRows(){
  const owners=new Map();
  USERS.filter(u=>u.role==="STEP_OWNER").forEach(u=>owners.set(u.id,{u,clients:new Set(),ns:0,ok:0,risk:0,late:0,blk:0,ahead:0,doneOk:0,doneLate:0}));
  CLIENTS.forEach(c=>{ if(c.status!=="ONBOARDING"&&c.status!=="LIVE") return;
    c.journeys.forEach(j=>{ if(j.gate==="LOCKED") return;
      j.steps.forEach(st=>{
        if(!owners.has(st.owner)) { const u=uById(st.owner); owners.set(st.owner,{u,clients:new Set(),ns:0,ok:0,risk:0,late:0,blk:0,ahead:0,doneOk:0,doneLate:0}); }
        const o=owners.get(st.owner);
        if(c.status==="ONBOARDING") o.clients.add(c.id);
        if(st.status==="PENDING") o.ns++;
        else if(st.status==="BLOCKED"||st.status==="WAITING") o.blk++;
        else if(st.status==="CURRENT") (st.pct>=100? o.late++ : st.pct>=SETTINGS.amber? o.risk++ : o.ok++);
        else if(st.status==="DONE") (st.closed==="early"? o.ahead++ : st.closed==="late"? o.doneLate++ : o.doneOk++);
      });});});
  return [...owners.values()].map(o=>{
    const done=o.doneOk+o.doneLate+o.ahead;
    let perf=null;
    if(done||o.late||o.blk){
      perf=Math.round(100*(o.doneOk+o.ahead)/(done||1)) - 12*o.late - 6*o.blk - 3*o.risk + 3*o.ahead;
      perf=Math.max(5,Math.min(100,perf));
    }
    return {...o, nclients:o.clients.size, perf};
  }).sort((a,b)=>b.nclients-a.nclients);
}

/* ---------- client detail + ribbon ---------- */
function segClass(s, isCurrent){
  if(s.status==="DONE") return "seg-done";
  if(s.status==="BLOCKED") return "seg-block"+(s.pct>=100?" seg-breach":"");
  if(s.status==="WAITING") return "seg-wait";
  if(s.status==="CURRENT") return s.pct>=100 ? "seg-breach" : "seg-cur";
  return "seg-pend";
}
function segState(s){
  if(s.status==="DONE") return "✓ DONE";
  if(s.status==="BLOCKED") return "⛔ BLOCKED";
  if(s.status==="WAITING") return "⏸ WAITING";
  if(s.status==="CURRENT") return s.pct>=100 ? "⚠ BREACHED" : "▶ IN PROGRESS";
  return "○ PENDING";
}
function prqChip(t){
  return t.status==="VERIFIED" ? '<span class="chip chip-green">✓ Verified</span>'
       : t.status==="SUBMITTED"? '<span class="chip chip-amber">📥 Submitted — awaiting verification</span>'
       : t.status==="SKIPPED"  ? '<span class="chip chip-grey">⏭ Skipped</span>'
       : '<span class="chip chip-grey">○ Pending with client</span>';
}
function prqOpenState(c){
  return S.prqOpen[c.id] !== undefined ? S.prqOpen[c.id] : !gateOk(c);  // open until cleared
}
A.togglePrq = cid=>{ const c=CLIENTS.find(x=>x.id===cid); S.prqOpen[cid]=!prqOpenState(c); render(); };
function prqPanel(c, staff){
  const mand = c.prereqs.filter(t=>t.mand);
  const mandOk = mand.filter(t=>t.status==="VERIFIED").length;
  const cleared = gateOk(c);
  const open = prqOpenState(c);
  return `<div class="prq${open?" open":""}" aria-label="Client prerequisites">
    <button class="prq-h" onclick="A.togglePrq('${c.id}')" aria-expanded="${open}">
      <b style="font-size:13.5px">📋 Prerequisites — client responsibilities before any journey starts</b>
      <span class="chip ${cleared?"chip-green":"chip-amber"}">${cleared?"✓ Cleared — gate open":`${mandOk}/${mand.length} mandatory verified — journeys locked`}</span>
      <div class="gatebar" role="img" aria-label="${mandOk} of ${mand.length} mandatory verified"><i style="width:${mand.length?Math.round(mandOk/mand.length*100):100}%"></i></div>
      <span class="cap" aria-hidden="true">${open?"▲":"▼"}</span>
    </button>
    <div class="prq-body">
    ${c.prereqs.map((t,qi)=>`<div class="prq-row">
      <div class="ttl">${esc(t.title)} ${t.mand?'<span class="chip chip-red" style="font-size:10px">MANDATORY</span>':'<span class="chip chip-grey" style="font-size:10px">OPTIONAL</span>'}
        <div class="cap" style="font-weight:400;margin-top:3px">${esc(t.desc)} · TAT ${t.tat}d · due ${esc(t.due)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">
          ${t.refDoc?`<span class="chip chip-blue">📄 ${esc(t.refDoc)} <span class="cap">(reference)</span></span>`:""}
          ${t.docs.map(d=>`<span class="chip chip-grey">📎 ${esc(d)}</span>`).join("")}
        </div>
        ${t.comments.length?`<div class="cap" style="margin-top:5px">💬 ${t.comments.map(m=>esc(m.by)+": “"+esc(m.text)+"”").join(" · ")}</div>`:""}
        ${t.status==="SKIPPED"&&t.skipReason?`<div class="cap" style="margin-top:4px">⏭ ${esc(t.skipReason)}</div>`:""}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        ${prqChip(t)}
        ${staff && S.user.role!=="VIEWER" ? `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          ${t.status==="SUBMITTED"||t.status==="PENDING"?`<button class="btn btn-sm" onclick="A.prVerify('${c.id}',${qi})">✓ Verify</button>`:""}
          ${t.status==="SUBMITTED"?`<button class="btn btn-sm" onclick="A.prReturn('${c.id}',${qi})">↩ Return</button>`:""}
          ${!t.mand && (t.status==="PENDING"||t.status==="SUBMITTED")?`<input id="prskip-${qi}" placeholder="Skip reason…" style="width:150px;padding:4px 8px;font-size:12px"><button class="btn btn-sm" onclick="A.prSkip('${c.id}',${qi})">⏭ Skip & proceed</button>`:""}
        </div>`:""}
        ${!staff && (t.status==="PENDING") ? `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <input id="prdoc-${qi}" placeholder="Attach file… e.g. data.xlsx" style="width:170px;padding:4px 8px;font-size:12px">
          <button class="btn btn-p btn-sm" onclick="A.prSubmit('${c.id}',${qi})">Submit for verification</button></div>`:""}
        ${!staff ? `<div style="display:flex;gap:6px"><input id="prcm-${qi}" placeholder="Add a comment…" style="width:200px;padding:4px 8px;font-size:12px"><button class="btn btn-sm" onclick="A.prComment('${c.id}',${qi})">💬</button></div>`:""}
      </div>
    </div>`).join("")}
    </div>
  </div>`;
}
function vClient(){
  const c = CLIENTS.find(x=>x.id===S.params.id);
  if(!c) return shell('<div class="content"><div class="card empty">Client not found (404 — out-of-scope IDs don’t reveal existence).</div></div>',"clients");
  let ji = S.params.j;
  if(ji===undefined){ ji = c.journeys.findIndex(j=>j.gate!=="LOCKED" && j.steps.some(s=>s.status!=="DONE")); if(ji<0) ji=0; }
  const jn = c.journeys[ji], steps = jn.steps;
  const selIdx = Math.min(S.params.step ?? Math.max(steps.findIndex(x=>x.status!=="DONE"),0), steps.length-1);
  const s = steps[selIdx];
  const rag = clientRag(c);
  const editable = canEditStep(c, ji, selIdx) && c.status!=="LIVE" && jn.gate!=="LOCKED";
  const owner = uById(s.owner);
  const ribbon = steps.map((st,i)=>{
    const tat = st.status==="DONE" ? "" :
      `<div class="tatbar ${st.pct>=100?"red":st.pct>=SETTINGS.amber?"amber":""}"><i style="width:${Math.min(100,st.pct)}%"></i></div>`;
    return `${i>0?`<div class="conn${steps[i-1].status==="DONE"?"":" pend"}" aria-hidden="true"><i></i></div>`:""}
      <button class="seg ${segClass(st)}${i===selIdx?" sel":""}" onclick="A.selStep('${c.id}',${i},${ji})" aria-label="Step ${i+1}: ${esc(st.name)}, ${segState(st)}">
        <div class="st">${segState(st)}<span style="margin-left:auto">${stEmoji(st)}</span></div><div class="nm">${i+1}. ${esc(st.name)}</div>
        <div class="meta"><span class="avatar" style="width:20px;height:20px;font-size:9px">${initials(uById(st.owner).name)}</span>
          <span>${st.status==="DONE"
            ? `SD ${st.sd} · FD ${st.fd} · ${st.closed==="late"?"⚠ delayed":st.closed==="early"?"✓ early":"✓ on time"}`
            : st.tat+"d TAT"+(st.sd?` · SD ${st.sd}`:"")}<span title="${st.dep!=null?"Depends on service "+(st.dep+1):"No dependency — runs parallel"}">${st.dep!=null?" · ↳"+(st.dep+1):" · ∥"}</span>${st.status!=="DONE"&&st.subs.length?` · ☑ ${st.subs.filter(x=>x.val!==null).length}/${st.subs.length}`:""}</span></div>${tat}
      </button>`;
  }).join("");
  const docsMissing = s.docsReq.filter(d=>!s.docs.includes(d));
  const actions = c.status==="LIVE" ? "" : jn.gate==="LOCKED"
    ? `<p class="cap" style="background:var(--warning-soft);border-radius:8px;padding:10px 12px">🔒 This journey is <b>locked</b> — it starts automatically the moment every mandatory prerequisite above is verified (non-mandatory ones can be skipped by an Admin).</p>`
    : !editable
    ? `<p class="cap" style="background:var(--bg-subtle);border-radius:8px;padding:10px 12px">You can view this step, but only <b>${esc(owner.name)}</b> (or a Manager/Admin) can update it — that's the role model working.</p>`
    : `<div style="display:flex;gap:8px;flex-wrap:wrap">
        ${s.status==="PENDING"?`<button class="btn btn-p btn-sm" onclick="A.stStart('${c.id}',${ji},${selIdx})">▶ Start step</button>`:""}
        ${(s.status==="CURRENT")?`
          ${s.signoff? (s.signoffState==="REQUESTED"
              ? `<button class="btn btn-sm" onclick="A.signoffOpen('${c.id}',${ji},${selIdx})">🔗 Open client sign-off link (simulate)</button>`
              : `<button class="btn btn-p btn-sm" onclick="A.signoffReq('${c.id}',${ji},${selIdx})">✉ Request client sign-off</button>`)
            : `<button class="btn btn-p btn-sm" onclick="A.stComplete('${c.id}',${ji},${selIdx})">✓ Mark complete</button>`}
          <button class="btn btn-sm" onclick="A.stWait('${c.id}',${ji},${selIdx})">⏸ Waiting on client</button>`:""}
        ${(s.status==="WAITING"||s.status==="BLOCKED")?`<button class="btn btn-p btn-sm" onclick="A.stResume('${c.id}',${ji},${selIdx})">▶ Resume clock</button>`:""}
      </div>
      ${s.status!=="BLOCKED" && s.status!=="PENDING" ? `<div style="display:flex;gap:8px;margin-top:10px">
        <input id="blk-reason" placeholder="Block reason (mandatory) — e.g. awaiting vendor assets" style="flex:1">
        <button class="btn btn-danger btn-sm" onclick="A.stBlock('${c.id}',${ji},${selIdx})">⛔ Block</button></div>`:""}
      ${["OB_ADMIN","MANAGER"].includes(S.user.role)?`<div style="display:flex;gap:8px;margin-top:10px;align-items:center">
        <select id="re-owner" style="flex:1">${USERS.filter(u=>u.modules.includes("ONBOARDING")).map(u=>`<option value="${u.id}"${u.id===s.owner?" selected":""}>${esc(u.name)} · ${ROLE_LABEL[u.role]}</option>`).join("")}</select>
        <button class="btn btn-sm" onclick="A.stReassign('${c.id}',${ji},${selIdx})">Reassign</button></div>`:""}`;

    : j2.steps.every(x=>x.status==="DONE") ? '<span class="chip chip-green">✓ Complete</span>'

    : j2.steps.map(stepRag).includes("AMBER") ? '<span class="chip chip-amber">⚠ At risk</span>'
    : '<span class="chip chip-indigo">▶ In progress</span>';
  const accordions = c.journeys.map((j2,k)=>{
    const open = k===ji;
    return `<div class="jacc">
      <button class="jstrip" onclick="A.selJourney('${c.id}',${k})" aria-expanded="${open}">
        <span style="font-size:18px" aria-hidden="true">${prodById(j2.prod).icon}</span>

        <span class="cap">${esc(j2.tpl)} v${j2.ver} · ${j2.steps.length} services</span>
        ${jchip(j2)}
        ${jTatChip(j2)}
        <span style="flex:1"></span>
        ${jDots(j2)}
        <span class="jpct">${jPct(j2)}%</span>
        <span class="cap" aria-hidden="true">${open?"▲":"▼"}</span>
      </button>
      ${open?`<div class="jbody">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="eyebrow">Journey ribbon</span>

        <div style="margin-top:14px">${stepCard(c, ji, selIdx, s, owner, editable, docsMissing, actions)}</div>
      </div>`:""}
    </div>`;
  }).join("");
  return shell(`<div class="content">
    <button class="btn btn-ghost btn-sm" style="align-self:flex-start" onclick="A.nav('clients')">← All clients</button>
    ${c.status==="LIVE"?`<div class="banner-live">🎉 Fully onboarded & LIVE since ${esc(c.liveAt)} — all ${c.journeys.length} journey${c.journeys.length>1?"s":""} complete, sign-offs on record${c.csat?` · CSAT ${c.csat}/5`:""}.</div>`:""}
    <div class="page-head">
      <div><h1 style="text-wrap:balance">${esc(c.name)}</h1>
        <p class="cap" style="margin-top:4px">${esc(c.city)} · ${esc(c.licenseType)} · Sales: ${esc(c.sales)} · Boarded ${esc(c.onboardDate)} · Login: ${(CLIENT_ACCOUNTS.find(a=>a.clientId===c.id)||{}).username||"not issued"}</p></div>
      <span class="sp"></span>
      <div style="text-align:right">${RAG_CHIP[rag]}<div class="cap" style="margin-top:6px">${c.journeys.length} product journey${c.journeys.length>1?"s":""}</div></div>
    </div>
    ${prqPanel(c, true)}
    ${accordions}
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <section class="card" aria-label="Client portal access" style="padding:20px">

        ${(function(){ const a=CLIENT_ACCOUNTS.find(x=>x.clientId===c.id);
          return a ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <span class="chip chip-green">🔑 ${a.username}</span><span class="chip chip-grey">Active</span>
              ${["OB_ADMIN","MANAGER"].includes(S.user.role)?`<button class="btn btn-sm" onclick="A.acctReset('${c.id}')">Reset password</button>`:""}
            </div>`
          : ["OB_ADMIN","MANAGER"].includes(S.user.role)
            ? `<button class="btn btn-p btn-sm" onclick="A.acctCreate('${c.id}')">🔑 Create client login</button>
               <p class="cap" style="margin-top:8px">Generates a username and a one-time password, emailed to the primary SPOC; must change on first login.</p>`
            : '<span class="cap">No login issued yet — an Admin or Manager can create one.</span>'; })()}
      </section>
      <section class="card" aria-label="Client information" style="padding:20px">
        <h3>Client info</h3>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:10px;font-size:13px">
          <div><div class="eyebrow">SPOC</div>${c.spocs.map(sp=>`<div style="margin-top:4px">${esc(sp.name)}${sp.primary?' <span class="chip chip-indigo" style="font-size:10px">PRIMARY</span>':""}<div class="cap">${esc(sp.email)} · ${esc(sp.phone)}</div></div>`).join("")}</div>
          <div><div class="eyebrow">Products bought</div><div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${c.journeys.map(j2=>`<span class="chip chip-grey">${prodById(j2.prod).icon} ${esc(prodById(j2.prod).name)}</span>`).join("")}</div></div>
          <div><div class="eyebrow">Requirements</div><div style="margin-top:4px">${esc(c.requirements)}</div></div>
          <div><div class="eyebrow">Address</div><div style="margin-top:4px" class="cap">${esc(c.addr)}</div></div>
          <div><div class="eyebrow">Attachments (${c.attachments.length})</div><div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${c.attachments.map(a=>`<span class="chip chip-grey">📎 ${esc(a)}</span>`).join("")||'<span class="cap">None</span>'}</div></div>
        </div>
      </section>
    </div>
  </div>`, "clients");
}
function stepCard(c, ji, selIdx, s, owner, editable, docsMissing, actions){
  const steps = c.journeys[ji].steps;
  return `<section class="card" aria-label="Selected step detail">
        <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <div><div class="eyebrow">Service ${selIdx+1} of ${steps.length}</div><h2 style="margin-top:2px">${esc(s.name)} ${stEmoji(s)}</h2></div>
          <span class="sp" style="flex:1"></span>${chipStatus(s)}
        </div>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:14px 0 18px">
          <div><div class="eyebrow">Responsible</div><div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span class="avatar">${initials(owner.name)}</span>${esc(owner.name)}</div></div>
          <div><div class="eyebrow">TAT</div><div style="margin-top:4px">${s.tat} working day(s)</div></div>
          <div><div class="eyebrow">Due</div><div style="margin-top:4px">${s.status==="DONE"?"Completed "+esc(s.completedOn||""):esc(s.due||"—")}</div></div>
          <div><div class="eyebrow">TAT used</div><div style="margin-top:4px;font-weight:600;color:${s.pct>=100?"var(--danger)":s.pct>=SETTINGS.amber?"var(--warning)":"var(--success)"}">${Math.min(s.pct,999)}%</div></div>
          <div><div class="eyebrow">Task list</div><div style="margin-top:4px">☑ ${s.subs.filter(x=>x.val!==null).length}/${s.subs.length} answered</div></div>
        </div>
        ${s.blockReason?`<div class="err">⛔ Blocked: ${esc(s.blockReason)}</div>`:""}
        ${s.signoff?`<p class="cap" style="margin-bottom:12px">✍️ This step requires <b>client sign-off</b> — status: <b>${s.signoffState==="NONE"?"not yet requested":s.signoffState==="REQUESTED"?"link sent, awaiting client":s.signoffState==="ACCEPTED"?"accepted ✓":"objection raised ⚠"}</b></p>`:""}
        ${s.docsReq.length?`<p class="cap" style="margin-bottom:12px">📋 Required documents: ${s.docsReq.map(d=>s.docs.includes(d)?`<span class="chip chip-green">✓ ${esc(d)}</span>`:`<span class="chip chip-grey">○ ${esc(d)}</span>`).join(" ")}</p>`:""}
        ${s.subs.length?`<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden">
          <div style="padding:9px 14px;background:var(--bg-subtle);display:flex;align-items:center;gap:8px">
            <b style="font-size:13px">Task List</b>
            <span class="cap">${s.subs.filter(x=>x.val!==null).length}/${s.subs.length} answered${s.subs.some(x=>x.val===false)?" · has exceptions":""}</span>
            <span class="cap" style="margin-left:auto">step can't complete until all are answered; False needs a remark</span></div>
          ${s.subs.map((sb,j)=>{
            const canAns = editable && s.status!=="PENDING" && c.status!=="LIVE" && s.status!=="DONE";
            return `<div style="padding:10px 14px;border-top:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <span style="font-size:13px;font-weight:500;flex:1;min-width:160px">${esc(sb.name)}</span>
                ${canAns?`<span style="display:inline-flex;gap:6px" role="group" aria-label="${esc(sb.name)} answer">
                  <button class="btn btn-sm" style="${sb.val===true?"background:var(--success-soft);border-color:#A7F3D0;color:#047857;font-weight:700":""}" onclick="A.subSet('${c.id}',${ji},${selIdx},${j},true)" aria-pressed="${sb.val===true}">✓ True</button>
                  <button class="btn btn-sm" style="${sb.val===false?"background:var(--danger-soft);border-color:#FECACA;color:#B91C1C;font-weight:700":""}" onclick="A.subSet('${c.id}',${ji},${selIdx},${j},false)" aria-pressed="${sb.val===false}">✗ False</button></span>`
                : sb.val===null?'<span class="chip chip-grey">— Unanswered</span>':sb.val?'<span class="chip chip-green">✓ True</span>':'<span class="chip chip-red">✗ False</span>'}
              </div>
              ${canAns?`<input value="${esc(sb.remark)}" placeholder="Remark${sb.val===false?" (required for a False answer)":" (optional)"}…" style="margin-top:8px;font-size:13px" onchange="A.subRemark('${c.id}',${ji},${selIdx},${j},this.value)" aria-label="Remark for ${esc(sb.name)}">`
                : sb.remark?`<div class="cap" style="margin-top:6px">📝 ${esc(sb.remark)}</div>`:""}
            </div>`;}).join("")}
        </div>`:""}
        ${actions}
        ${editable && s.status!=="PENDING" ? `<div style="display:flex;gap:8px;margin-top:10px">
          <input id="doc-name" placeholder="Attach a document… ${docsMissing.length?"e.g. "+esc(docsMissing[0]):""}" style="flex:1">
          <button class="btn btn-sm" onclick="A.stAttach('${c.id}',${ji},${selIdx})">📎 Attach</button></div>`:""}
        <h3 style="margin:22px 0 4px">Communication on this step</h3>
        <p class="cap" style="margin-bottom:14px">Append-only — corrections are new entries, never edits.</p>
        ${editable && s.status!=="PENDING" && c.status!=="LIVE" ? `<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
          <select id="cm-type" style="width:130px">${["CALL","EMAIL","WHATSAPP","MEETING","NOTE"].map(t=>`<option>${t}</option>`).join("")}</select>
          <select id="cm-dir" style="width:110px"><option value="OUT">Outbound</option><option value="IN">Inbound</option><option value="INT">Internal</option></select>
          <input id="cm-text" placeholder="What was communicated?" style="flex:1;min-width:180px">
          <button class="btn btn-p btn-sm" onclick="A.stComm('${c.id}',${ji},${selIdx})">Log</button></div>`:""}
        ${s.comms.length? `<ul class="tl">${s.comms.slice().reverse().map(m=>`<li>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip chip-${m.type==="WHATSAPP"?"green":m.type==="EMAIL"?"blue":m.type==="CALL"?"indigo":"grey"}">${m.type}</span>
            <b style="font-size:13px">${esc(m.by)}</b><span class="cap">${esc(m.when)} · ${m.dir==="IN"?"inbound":m.dir==="OUT"?"outbound":"internal"}</span></div>
            <div style="margin-top:4px;font-size:13px">${esc(m.text)}</div></li>`).join("")}</ul>`
          : '<div class="empty cap">No communication logged on this step yet.</div>'}
      </section>`;
}

/* ---------- sign-off (public page simulation) ---------- */
function vSignoff(){
  const {cid,ji,i,verified,err}=S.signoff;
  const c=CLIENTS.find(x=>x.id===cid); const s=c.journeys[ji].steps[i];
  const isFinal = i===c.journeys[ji].steps.length-1;
  return `<div class="center-page" style="background:var(--bg-app)">
    <div class="logo"><div class="logo-mark">E</div>EduTrack · secure sign-off</div>
    <div class="card" style="width:520px;max-width:100%">
      <div class="eyebrow">For ${esc(c.spocs[0].name)} · ${esc(c.name)}</div>
      <h2 style="margin:4px 0 2px;text-wrap:balance">${isFinal?"Go-live sign-off":"Sign-off: "+esc(s.name)}</h2>
      <p class="cap" style="margin-bottom:16px">Single-use link · expires in 48 h · your response is recorded with time, IP and OTP channel.</p>
      ${!verified ? `
        <p style="margin-bottom:12px">Enter the 6-digit OTP sent to your registered email and WhatsApp. <span class="cap">(Demo OTP: <b>123456</b>)</span></p>
        ${err?`<div class="err" role="alert">${esc(err)}</div>`:""}
        <div class="otp" style="margin-bottom:16px">${[0,1,2,3,4,5].map(n=>`<input maxlength="1" inputmode="numeric" aria-label="OTP digit ${n+1}" oninput="if(this.value&&this.nextElementSibling)this.nextElementSibling.focus()">`).join("")}</div>
        <button class="btn btn-p" style="width:100%;justify-content:center" onclick="A.otpVerify()">Verify OTP</button>
      ` : `
        <div style="background:var(--bg-subtle);border-radius:10px;padding:14px;margin-bottom:16px;font-size:13px">
          <div class="eyebrow" style="margin-bottom:6px">You are signing off on</div>
          ${isFinal? `All ${c.journeys[ji].steps.length} steps of the <b>${esc(prodById(c.journeys[ji].prod).name)}</b> journey for <b>${esc(c.name)}</b>. Accepting completes this journey${c.journeys.length>1?" — the client goes Live when every product's journey is complete":" and marks the client <b>fully onboarded and Live</b>"}.`
                   : `<b>${esc(s.name)}</b> — delivered by ${esc(uById(s.owner).name)}. ${s.docs.length?"Documents on record: "+s.docs.map(esc).join(", ")+".":""}`}
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-p" style="justify-content:center" onclick="A.signoffAccept()">✓ Accept & sign off</button>
          <div><label for="so-obj">Or raise an objection</label>
            <div style="display:flex;gap:8px"><input id="so-obj" placeholder="What's not right?"><button class="btn btn-danger" onclick="A.signoffObject()">Object</button></div></div>
        </div>
        ${err?`<div class="err" role="alert" style="margin-top:10px">${esc(err)}</div>`:""}
      `}
    </div>
    <button class="btn btn-ghost btn-sm" onclick="S.signoff=null;go(S.user&&S.user.role==='CLIENT'?'cphome':'client',{id:'${cid}',j:${ji},step:${i}})">← Back${S.user&&S.user.role==="CLIENT"?" to your portal":" to EduTrack (exit client view)"}</button>
  </div>`;
}

/* ---------- reports ---------- */
function vReports(){
  const active = CLIENTS.filter(c=>c.status==="ONBOARDING");
  const tabs=[["funnel","Funnel"],["tat","TAT compliance"],["ttl","Time to live"],["sales","Sales pipeline"],["aging","Stuck & aging"],["signoff","Sign-offs pending"]];
  let body="";
  if(S.reportTab==="funnel"){
    const funnel = TPL_STEPS.map((t,i)=>({name:(i+1)+". "+t.name, n: active.filter(c=>currentIdx(c)===i).length}));
    const maxF=Math.max(1,...funnel.map(f=>f.n));
    body=`<h3>Clients at each journey step</h3><p class="cap" style="margin:2px 0 14px">${active.length} active clients. A healthy funnel drains left to right.</p>
      ${funnel.map(f=>`<div class="hbar-row"><span class="hbar-lbl">${esc(f.name)}</span>
        <span class="hbar-track"><span class="hbar" style="width:${Math.round(f.n/maxF*100)}%" onmouseenter="tipOn(event,'${esc(f.name)}: <b>${f.n}</b>')" onmousemove="tipMove(event)" onmouseleave="tipOff()"></span></span>
        <span class="hbar-val">${f.n}</span></div>`).join("")}`;
  }
  if(S.reportTab==="tat"){
    const pct=[92,84,76,58,81,88,73,95];
    body=`<h3>% of steps completed within TAT — last 90 days</h3><p class="cap" style="margin:2px 0 14px">Waiting-on-client time excluded, so this measures <i>our</i> speed. Data migration is the bottleneck.</p>
      ${TPL_STEPS.map((t,i)=>`<div class="hbar-row"><span class="hbar-lbl">${i+1}. ${esc(t.name)}</span>
        <span class="hbar-track"><span class="hbar" style="width:${pct[i]}%;background:${pct[i]<70?"var(--danger)":pct[i]<85?"var(--warning)":"var(--chart-1)"}" onmouseenter="tipOn(event,'${esc(t.name)}: <b>${pct[i]}%</b> on time')" onmousemove="tipMove(event)" onmouseleave="tipOff()"></span></span>
        <span class="hbar-val">${pct[i]}%</span></div>`).join("")}
      <p class="cap" style="margin-top:12px"><span class="sw" style="background:var(--danger);width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px"></span>below 70% <span class="sw" style="background:var(--warning);width:10px;height:10px;border-radius:3px;display:inline-block;margin:0 6px 0 14px;vertical-align:-1px"></span>70–85%</p>`;
  }
  if(S.reportTab==="ttl"){
    const months=["Mar","Apr","May","Jun","Jul","Aug"], days=[34,31,29,27,26,24];
    const W=560,H=180,P=34, maxY=40;
    const x=i=>P+i*(W-2*P)/(months.length-1), y=v=>H-P-(v/maxY)*(H-2*P);
    const pts=days.map((d,i)=>x(i)+","+y(d)).join(" ");
    body=`<h3>Average time to live (working days)</h3><p class="cap" style="margin:2px 0 10px">Trending down 6 months straight — from 34 to 24 working days.</p>
      <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Line chart: average onboarding time fell from 34 working days in March to 24 in August">
        ${[10,20,30,40].map(g=>`<line x1="${P}" x2="${W-P}" y1="${y(g)}" y2="${y(g)}" stroke="var(--border)" stroke-width="1"/><text x="${P-8}" y="${y(g)+4}" text-anchor="end" font-size="11" fill="#6B7280">${g}</text>`).join("")}
        <polyline points="${pts}" fill="none" stroke="var(--chart-1)" stroke-width="2"/>
        ${days.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d)}" r="${i===days.length-1?5:4}" fill="${i===days.length-1?"var(--chart-1)":"var(--bg-surface)"}" stroke="var(--chart-1)" stroke-width="2"
           onmouseenter="tipOn(event,'${months[i]} 2026: <b>${d} working days</b>')" onmousemove="tipMove(event)" onmouseleave="tipOff()"/>`).join("")}
        ${days.map((d,i)=> (i===0||i===days.length-1)?`<text x="${x(i)}" y="${y(d)-10}" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">${d}</text>`:"").join("")}
        ${months.map((m,i)=>`<text x="${x(i)}" y="${H-P+16}" text-anchor="middle" font-size="11" fill="#6B7280">${m}</text>`).join("")}
      </svg></div>`;
  }
  if(S.reportTab==="sales"){
    const by={};
    CLIENTS.forEach(c=>{ by[c.sales]=by[c.sales]||{n:0,live:0}; by[c.sales].n++; if(c.status==="LIVE")by[c.sales].live++; });
    const rows=Object.entries(by); const maxN=Math.max(...rows.map(([,v])=>v.n));
    body=`<h3>Clients boarded per sales person</h3><p class="cap" style="margin:2px 0 14px">All time. Live count shown beside each bar.</p>
      ${rows.map(([name,v])=>`<div class="hbar-row"><span class="hbar-lbl">${esc(name)}</span>
        <span class="hbar-track"><span class="hbar" style="width:${Math.round(v.n/maxN*100)}%" onmouseenter="tipOn(event,'${esc(name)}: <b>${v.n}</b> boarded, ${v.live} live')" onmousemove="tipMove(event)" onmouseleave="tipOff()"></span></span>
        <span class="hbar-val">${v.n}</span></div>`).join("")}`;
  }
  if(S.reportTab==="aging"){
    const rows = active.flatMap(c=>c.steps.map((s,i)=>({c,s,i})).filter(x=>["BLOCKED","WAITING"].includes(x.s.status)||x.s.pct>=100));
    body=`<h3>Stuck & aging steps</h3><p class="cap" style="margin:2px 0 14px">Blocked, waiting-on-client, or breached — with attribution, so TAT disputes die here.</p>
      <div class="tblwrap"><table><thead><tr><th>Client</th><th>Step</th><th>State</th><th>Owner</th><th>Clock</th><th>Reason</th></tr></thead><tbody>
      ${rows.map(x=>`<tr class="rowlink" tabindex="0" onclick="A.selStep('${x.c.id}',${x.i})">
        <td><b>${esc(x.c.name)}</b></td><td>${esc(x.s.name)}</td><td>${chipStatus(x.s)}</td><td>${esc(uById(x.s.owner).name)}</td>
        <td>${x.s.status==="WAITING"?'<span class="chip chip-grey">⏸ paused · client time</span>':'<span class="chip chip-red">⏱ running · our time</span>'}</td>
        <td class="cap">${esc(x.s.blockReason||"Waiting on client input")}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  if(S.reportTab==="signoff"){
    const rows = CLIENTS.flatMap(c=>c.steps.map((s,i)=>({c,s,i})).filter(x=>x.s.signoff&&x.s.status!=="DONE"));
    body=`<h3>Client sign-offs — pending & upcoming</h3>
      <div class="tblwrap" style="margin-top:12px"><table><thead><tr><th>Client</th><th>Step</th><th>SPOC</th><th>Status</th></tr></thead><tbody>
      ${rows.map(x=>`<tr class="rowlink" tabindex="0" onclick="A.selStep('${x.c.id}',${x.i})">
        <td><b>${esc(x.c.name)}</b></td><td>${esc(x.s.name)}</td><td>${esc(x.c.spocs[0].name)}<div class="cap">${esc(x.c.spocs[0].email)}</div></td>
        <td>${x.s.signoffState==="REQUESTED"?'<span class="chip chip-amber">⏳ Link sent, awaiting client</span>':x.s.signoffState==="OBJECTION"?'<span class="chip chip-red">⚠ Objection raised</span>':'<span class="chip chip-grey">○ Not yet requested</span>'}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  return shell(`<div class="content">
    <div class="page-head"><div><h1>Reports</h1><p class="cap" style="margin-top:2px">All figures from pre-aggregated summaries — dashboards never run live counts.</p></div>
      <span class="sp"></span><button class="btn" onclick="A.exportStub('${tabs.find(t=>t[0]===S.reportTab)[1]}')">⬇ Export XLSX</button></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab${S.reportTab===k?" on":""}" role="tab" aria-selected="${S.reportTab===k}" onclick="A.reportTab('${k}')">${l}</button>`).join("")}</div>
    <div class="card">${body}</div>
  </div>`, "reports");
}
